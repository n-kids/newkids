<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴키즈 - 글쓰기/수정</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body style="background:#f9fbfd;">

    <header></header>

    <div class="container" style="padding-top:100px; padding-bottom:50px;">
        <div class="panel-box" style="max-width:1200px; margin:0 auto;">
            <h2 id="write-header-title" style="text-align:center; color:#1a3c6e; margin-bottom:30px;">✏️ 게시판 글쓰기</h2>

            <div class="form-group">
                <label class="form-label">제목</label>
                <input type="text" id="w-title" class="form-input" placeholder="제목을 입력하세요">
            </div>

            <div style="display:flex; gap:15px; margin-bottom:20px; align-items:flex-end;">
                <div style="flex:1;">
                    <label class="form-label">작성자</label>
                    <input type="text" id="w-author" class="form-input" placeholder="이름 또는 닉네임">
                </div>
                <div style="flex:1;">
                    <label class="form-label">비밀번호 (수정/삭제용)</label>
                    <input type="password" id="w-password" class="form-input" placeholder="비밀번호 4자리 이상">
                </div>
                <div style="flex:0 0 120px; display:flex; align-items:center; height:46px;">
                    <label style="cursor:pointer; display:flex; align-items:center; gap:8px; font-weight:bold; color:#1a3c6e;">
                        <input type="checkbox" id="w-is-secret" style="width:18px; height:18px;"> 🔒 비밀글
                    </label>
                </div>
            </div>

            <div class="form-group" style="background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px dashed #cbd5e1; margin-bottom: 20px;">
                <label class="form-label" style="margin-bottom: 10px;">📎 첨부파일 및 이미지 업로드</label>
                <input type="file" id="w-files" class="form-input" multiple onchange="handleFileSelect(this)" style="background: #fff;">
                <p style="font-size: 0.85rem; color: #666; margin-top: 5px;">* 이미지 및 일반 문서 파일(PDF, HWP, ZIP 등)을 여러 개 선택하실 수 있습니다.</p>
                <div id="file-preview-list" style="margin-top: 12px; display: flex; flex-direction: column; gap: 6px;"></div>
            </div>

            <div class="form-group">
                <label class="form-label">내용</label>
                <textarea id="w-content" class="form-input" style="height:300px; resize:vertical;" placeholder="내용을 입력해주세요."></textarea>
            </div>

            <!-- ★ 취소 버튼 클릭 시 올바른 페이지로 이동하도록 수정 ★ -->
            <div style="text-align:center; margin-top:30px; display:flex; gap:10px; justify-content:center;">
                <button onclick="saveUserPost()" id="submit-btn" class="btn-action" style="min-width:150px;">글 등록하기</button>
                <button onclick="cancelAction()" class="btn-action" style="background:#999; min-width:150px;">취소</button>
            </div>
        </div>
    </div>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="manager.js"></script>
    <script>
        const urlParams = new URLSearchParams(location.search);
        const editPostId = urlParams.get('edit');
        const passedPw = urlParams.get('pw');
        const targetCategory = location.hash.replace('#', '') || 'free';
        let selectedFiles = [];
        let existingImageUrl = null;

        document.addEventListener("DOMContentLoaded", () => {
            const checkReady = setInterval(async () => {
                if (window.sb && window.GLOBAL_CATEGORIES) {
                    clearInterval(checkReady);

                    const catInfo = window.GLOBAL_CATEGORIES.find(c => c.code === targetCategory);
                    if (catInfo) {
                        document.getElementById('write-header-title').innerText = editPostId ? `✏️ ${catInfo.name} 글 수정` : `✏️ ${catInfo.name} 글쓰기`;
                    }

                    if (editPostId) {
                        document.getElementById('submit-btn').innerText = "수정 완료";
                        await loadPostForEdit(editPostId);
                    }
                }
            }, 100);
        });

        async function loadPostForEdit(id) {
            const { data, error } = await window.sb.from('total_posts').select('*').eq('id', id).single();
            if (error || !data) {
                alert("수정할 게시글을 찾을 수 없습니다.");
                location.href = `notice.html#${targetCategory}`;
                return;
            }

            const { data: { session } } = await window.sb.auth.getSession();
            if (!session && data.password && data.password.trim() !== '' && passedPw !== data.password) {
                const inputPw = prompt("게시글 수정을 위해 작성 시 설정한 비밀번호를 입력해주세요.");
                if (inputPw !== data.password) {
                    alert("비밀번호가 일치하지 않습니다.");
                    location.href = `view.html?id=${id}`;
                    return;
                }
            }

            document.getElementById('w-title').value = data.title || '';
            document.getElementById('w-author').value = data.link_url || '';
            document.getElementById('w-password').value = data.password || '';
            document.getElementById('w-is-secret').checked = data.is_secret === true;

            let rawContent = data.content || '';
            rawContent = rawContent.replace(/<br\s*[\/]?>/gi, '\n');
            document.getElementById('w-content').value = rawContent;

            existingImageUrl = data.image_url;
            if (existingImageUrl) {
                renderExistingFileList(existingImageUrl);
            }
        }

        // ★ 취소 버튼 동작 함수 (수정 중이었으면 상세 페이지로, 신규 작성이었으면 목록으로 이동)
        function cancelAction() {
            if (editPostId) {
                location.href = `view.html?id=${editPostId}`;
            } else {
                location.href = `notice.html#${targetCategory}`;
            }
        }

        function renderExistingFileList(urlStr) {
            const container = document.getElementById('file-preview-list');
            const files = urlStr.split('||').map(u => u.trim()).filter(u => u);
            let html = '<div style="font-weight:bold; font-size:0.85rem; color:#1a3c6e; margin-bottom:4px;">기존 첨부파일:</div>';
            files.forEach((item, idx) => {
                let fileName = "첨부파일 " + (idx + 1);
                if (item.includes('@@')) {
                    fileName = item.split('@@')[1];
                }
                html += `<div style="display:flex; justify-content:space-between; align-items:center; background:#fff; padding:6px 10px; border:1px solid #e2e8f0; border-radius:6px; font-size:0.85rem;">
                                <span>📎 ${fileName}</span>
                                <span style="color:#888; font-size:0.8rem;">(유지됨)</span>
                             </div>`;
            });
            container.innerHTML = html;
        }

        function handleFileSelect(input) {
            if (input.files) {
                selectedFiles = Array.from(input.files);
                renderNewFileList();
            }
        }

        function renderNewFileList() {
            const container = document.getElementById('file-preview-list');
            if (selectedFiles.length === 0) {
                if (existingImageUrl) renderExistingFileList(existingImageUrl);
                else container.innerHTML = '';
                return;
            }
            let html = '<div style="font-weight:bold; font-size:0.85rem; color:#e67e22; margin-bottom:4px;">새로 첨부할 파일 (기존 파일은 대체됩니다):</div>';
            selectedFiles.forEach((file, index) => {
                html += `<div style="display:flex; justify-content:space-between; align-items:center; background:#fff; padding:6px 10px; border:1px solid #e2e8f0; border-radius:6px; font-size:0.85rem;">
                                <span>📄 ${file.name} (${(file.size / 1024).toFixed(1)} KB)</span>
                                <button type="button" onclick="removeNewFile(${index})" style="background:none; border:none; color:#ff6b6b; font-weight:bold; cursor:pointer;">삭제</button>
                             </div>`;
            });
            container.innerHTML = html;
        }

        function removeNewFile(index) {
            selectedFiles.splice(index, 1);
            document.getElementById('w-files').value = '';
            renderNewFileList();
        }

        async function saveUserPost() {
            const title = document.getElementById('w-title').value.trim();
            const author = document.getElementById('w-author').value.trim();
            const password = document.getElementById('w-password').value.trim();
            const isSecret = document.getElementById('w-is-secret').checked;
            const content = document.getElementById('w-content').value.trim();

            if (!title || !author || !password || !content) {
                return alert("모든 필수 항목을 입력해주세요.");
            }

            if (!confirm(editPostId ? "게시글을 수정하시겠습니까?" : "글을 등록하시겠습니까?")) return;

            const btn = document.getElementById('submit-btn');
            btn.innerText = "처리 중...";
            btn.disabled = true;

            let uploadedFileUrls = [];
            if (selectedFiles.length > 0) {
                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    const fileExt = file.name.split('.').pop();
                    const safeFileName = `board_${Date.now()}_${i}.${fileExt}`;

                    const { data, error } = await window.sb.storage.from('images').upload(safeFileName, file);
                    if (error) {
                        alert("파일 업로드 실패: " + error.message);
                        btn.innerText = editPostId ? "수정 완료" : "글 등록하기";
                        btn.disabled = false;
                        return;
                    }

                    const publicUrlData = window.sb.storage.from('images').getPublicUrl(data.path);
                    uploadedFileUrls.push(`${publicUrlData.data.publicUrl}@@${file.name}`);
                }
            }

            const safeContent = window.escapeHtml(content).replace(/\n/g, "<br>");
            const finalImageUrl = uploadedFileUrls.length > 0 ? uploadedFileUrls.join('||') : existingImageUrl;

            let error;
            if (editPostId) {
                const res = await window.sb.from('total_posts').update({
                    title: window.escapeHtml(title),
                    content: safeContent,
                    link_url: window.escapeHtml(author),
                    password: password,
                    is_secret: Boolean(isSecret),
                    image_url: finalImageUrl
                }).eq('id', editPostId);
                error = res.error;
            } else {
                const res = await window.sb.from('total_posts').insert([{
                    category: targetCategory,
                    title: window.escapeHtml(title),
                    content: safeContent,
                    link_url: window.escapeHtml(author),
                    password: password,
                    is_secret: Boolean(isSecret),
                    image_url: finalImageUrl,
                    order_num: 0,
                    is_visible: true
                }]);
                error = res.error;
            }

            if (error) {
                alert("오류 발생: " + error.message);
                btn.innerText = editPostId ? "수정 완료" : "글 등록하기";
                btn.disabled = false;
            } else {
                alert(editPostId ? "게시글이 성공적으로 수정되었습니다!" : "글이 성공적으로 등록되었습니다!");
                location.href = editPostId ? `view.html?id=${editPostId}` : `notice.html#${targetCategory}`;
            }
        }
    </script>
</body>
</html>
