<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴키즈 - 견적 요청</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header></header>

    <section class="sub-hero" id="view-hero">
        <div class="container">
            <h1>견적 요청</h1>
            <p>궁금하신 교재와 프로그램을 선택해 주세요.</p>
        </div>
    </section>

    <section style="background-color: #f8f9fa;">
        <div class="container">
            <form id="proposalForm" class="proposal-box">
                <h3 class="form-section-title">👤 신청자 정보</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">원명 (필수)</label>
                        <input type="text" name="wonName" class="form-input" placeholder="예: 해바라기 어린이집" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">담당자 성함 (필수)</label>
                        <input type="text" name="manager" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">연락처 (필수)</label>
                        <input type="tel" name="phone" class="form-input" placeholder="010-0000-0000" maxlength="13" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">이메일 (선택)</label>
                        <input type="email" name="email" class="form-input" placeholder="sample@email.com">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">지역 (시/구) (필수)</label>
                        <input type="text" name="region" class="form-input" placeholder="예: 서울 강남구" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">희망 방문상담 날짜 (선택)</label>
                        <input type="date" name="visitDate" class="form-input">
                    </div>
                </div>

                <h3 class="form-section-title" style="margin-top: 40px;">🎓 관심 교육 프로그램 선택</h3>
                <div id="loading-msg" style="text-align:center; padding:30px; color:#666;">목록 불러오는 중...</div>

                <div id="proposal-grid-area" class="proposal-grid-container"></div>

                <h3 class="form-section-title" style="margin-top: 40px;">🎉 관심 행사 프로그램 선택</h3>

                <div id="event-grid-area" class="proposal-grid-container"></div>

                <div class="form-group full-width" style="margin-top: 30px;">
                    <label class="form-label">문의 내용 / 비고</label>
                    <textarea name="inquiry" class="form-input" style="height: 100px;" placeholder="궁금하신 점이나 요청사항을 적어주세요."></textarea>
                </div>

                <div class="btn-center-wrap">
                    <button type="submit" class="btn-action">견적 요청하기</button>
                </div>
            </form>
        </div>
    </section>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="manager.js"></script>

    <script>
        let CATEGORY_NAMES = {};

        document.addEventListener("DOMContentLoaded", function () {
            const checkSb = setInterval(() => {
                if (window.sb) {
                    clearInterval(checkSb);
                    loadDynamicProposalData(window.sb);
                }
            }, 100);
        });

        async function loadDynamicProposalData(sb) {
            try {
                const { data: catData, error: catError } = await sb
                    .from('program_categories')
                    .select('*')
                    .eq('is_visible', true)
                    .order('order_num');

                if (catError || !catData) throw new Error("카테고리 로드 실패");

                const eduCats = [];
                const eventCats = [];

                catData.forEach(c => {
                    CATEGORY_NAMES[c.code] = c.name;
                    if (c.type === 'EDU') eduCats.push(c.code); else if (c.type === 'EVENT') eventCats.push(c.code);
                });

                const { data: posts, error: postError } = await sb.from('total_posts')
                    .select('title, category, order_num, video_url')
                    .neq('video_url', 'ORDER_ITEM')
                    .order('order_num', { ascending: true });

                document.getElementById('loading-msg').style.display = 'none';

                const groupedData = (posts || []).reduce((acc, item) => {
                    const c = item.category || 'etc';
                    (acc[c] = acc[c] || []).push(item);
                    return acc;
                }, {});

                const createSectionHtml = (categoryCodes) => {
                    let html = "";
                    categoryCodes.forEach(code => {
                        const items = groupedData[code] || [];
                        html += `
                                    <div class="sub-cat-wrapper">
                                        <div class="sub-cat-header" onclick="toggleProposalCategory(this)">
                                            <div class="sub-cat-title">
                                                <span>${CATEGORY_NAMES[code] || code}</span>
                                            </div>
                                            <span class="sub-toggle-icon">▼</span>
                                        </div>
                                        <div class="proposal-check-grid">`;

                        if (items.length > 0) {
                            items.forEach(post => {
                                const safeTitle = window.escapeHtml(post.title);
                                html += `
                                                    <label class="proposal-item">
                                                        <input type="checkbox" name="items" value="[${CATEGORY_NAMES[code]}] ${safeTitle}">
                                                        <span>${safeTitle}</span>
                                                    </label>`;
                            });
                        } else {
                            html += `<div style="padding:10px; color:#999; font-size:0.9rem;">등록된 프로그램이 없습니다.</div>`;
                        }

                        html += `</div></div>`;
                    });
                    return html;
                };

                document.getElementById('proposal-grid-area').innerHTML = createSectionHtml(eduCats);
                document.getElementById('event-grid-area').innerHTML = createSectionHtml(eventCats);

            } catch (e) {
                console.error(e);
                document.getElementById('loading-msg').innerText = "오류가 발생했습니다.";
            }
        }

        window.toggleProposalCategory = function (header) {
            if (window.event) window.event.stopPropagation();
            const wrapper = header.closest('.sub-cat-wrapper');
            const isActive = wrapper.classList.contains('active');
            document.querySelectorAll('.sub-cat-wrapper').forEach(w => {
                w.classList.remove('active');
                const grid = w.querySelector('.proposal-check-grid');
                if (grid) grid.classList.remove('show');
            });
            if (!isActive) {
                wrapper.classList.add('active');
                const grid = wrapper.querySelector('.proposal-check-grid');
                if (grid) grid.classList.add('show');
            }
        };

        document.addEventListener('click', function (e) {
            if (!e.target.closest('.sub-cat-wrapper')) {
                document.querySelectorAll('.sub-cat-wrapper').forEach(w => {
                    w.classList.remove('active');
                    const g = w.querySelector('.proposal-check-grid');
                    if (g) g.classList.remove('show');
                });
            }
        });

        document.addEventListener('change', function (e) {
            if (e.target.type === 'checkbox' && e.target.closest('.sub-cat-wrapper')) {
                const wrapper = e.target.closest('.sub-cat-wrapper');
                const header = wrapper.querySelector('.sub-cat-header');
                const checked = wrapper.querySelectorAll('input:checked').length > 0;
                if (checked) header.classList.add('has-checked');
                else header.classList.remove('has-checked');
            }
        });

        const form = document.getElementById('proposalForm');
        if (form) {
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                const btn = form.querySelector('.btn-action');
                const originalText = btn.innerText;
                const checkedItems = [];
                form.querySelectorAll('input[name="items"]:checked').forEach(cb => checkedItems.push(cb.value));

                if (checkedItems.length === 0) { alert("최소 1개 이상의 프로그램을 선택해 주세요."); return; }

                btn.disabled = true; btn.innerText = "전송 중...";
                const formData = new FormData(form);
                const data = {
                    type: "PROPOSAL",
                    wonName: formData.get("wonName"),
                    manager: formData.get("manager"),
                    phone: formData.get("phone"),
                    email: formData.get("email"),
                    region: formData.get("region"),
                    visitDate: formData.get("visitDate"),
                    items: checkedItems.join("\n"),
                    inquiry: formData.get("inquiry"),
                    timestamp: new Date().toLocaleString()
                };

                fetch(CONFIG.PROPOSAL_SHEET_URL || CONFIG.ORDER_SHEET_URL, { method: "POST", body: JSON.stringify(data) })
                    .then(res => res.json())
                    .then(res => {
                        if (res.result === 'success') { alert("견적 요청이 접수되었습니다."); location.reload(); }
                        else throw new Error(res.error);
                    })
                    .catch(err => { alert("전송 실패: " + err); btn.disabled = false; btn.innerText = originalText; });
            });
        }
    </script>
</body>
</html>
