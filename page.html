<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴키즈 - 페이지</title>
    <link rel="stylesheet" href="style.css?v=20261026">
</head>
<body>
    <header></header>

    <section class="sub-hero" id="page-hero" style="background-color: #1a3c6e; display:none;">
        <div class="container">
            <h1 id="page-hero-title">불러오는 중...</h1>
            <p id="page-hero-desc"></p>
        </div>
    </section>

    <section style="background-color: #f8f9fa; padding: 50px 0;">
        <div class="container">
            <div class="proposal-box" style="max-width: 900px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 12px;">
                <h2 id="page-title" style="color:#1a3c6e; margin-bottom:20px; font-weight:bold;"></h2>
                <div id="page-content" style="line-height: 1.6; color: #333;">
                    데이터를 불러오는 중입니다...
                </div>
            </div>
        </div>
    </section>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=20261026"></script>
    <script src="manager.js?v=20261026"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const categoryCode = urlParams.get('c');

            if (!categoryCode) {
                alert("잘못된 접근입니다.");
                location.href = 'index.html';
                return;
            }

            const checkReady = setInterval(() => {
                if (window.sb) {
                    clearInterval(checkReady);
                    loadPageContent(categoryCode);
                }
            }, 100);
        });

        async function loadPageContent(code) {
            const { data: catData } = await window.sb.from('program_categories').select('*').eq('code', code).single();
            if (catData) {
                if (catData.hero_image) {
                    const heroEl = document.getElementById('page-hero');
                    heroEl.style.backgroundImage = `url('${catData.hero_image}')`;
                    heroEl.style.display = 'block';

                    document.getElementById('page-hero-title').innerText = catData.hero_title || catData.name;
                    document.getElementById('page-hero-desc').innerText = catData.hero_desc || '';

                    if (catData.hero_overlay_color) {
                        const opacity = catData.hero_overlay_opacity !== undefined ? catData.hero_overlay_opacity : 0.8;
                        const rgb = hexToRgb(catData.hero_overlay_color);
                        if (rgb) {
                            heroEl.style.boxShadow = `inset 0 0 0 2000px rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${opacity})`;
                        }
                    }
                    if (catData.hero_title_color) document.getElementById('page-hero-title').style.color = catData.hero_title_color;
                    if (catData.hero_desc_color) document.getElementById('page-hero-desc').style.color = catData.hero_desc_color;
                }
                document.getElementById('page-title').innerText = catData.name;
                document.title = "뉴키즈 - " + catData.name;
            }

            const { data, error } = await window.sb.from('total_posts').select('*').eq('category', code).order('created_at', { ascending: true }).limit(1).single();

            if (error || !data) {
                document.getElementById('page-content').innerHTML = "<div style='text-align:center; padding:50px; color:#999;'>아직 등록된 페이지 내용이 없습니다.</div>";
            } else {
                let finalContent = window.sanitizeHtml(data.content || '');
                finalContent = finalContent.replace(/\[투표:(\d+)\]/g, '<iframe id="form-iframe-$1" src="form.html?id=$1" width="100%" frameborder="0" scrolling="no" style="border:1px solid #ddd; border-radius:12px; margin:30px 0; overflow:hidden; transition:height 0.3s ease;"></iframe>');

                document.getElementById('page-content').innerHTML = finalContent;
            }
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'resizeIframe') {
                let iframe = document.getElementById('form-iframe-' + event.data.formId);
                if (!iframe) {
                    const iframes = document.querySelectorAll('iframe');
                    for (let f of iframes) {
                        if (f.src && f.src.includes('id=' + event.data.formId)) {
                            iframe = f;
                            break;
                        }
                    }
                }
                if (iframe) {
                    iframe.style.height = (event.data.height + 30) + 'px';
                }
            }
        });
    </script>
</body>
</html>
