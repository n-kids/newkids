<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴키즈 - 게시판</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header></header>

    <div class="board-header-section" id="view-hero">
        <div class="container">
            <h1 id="board-title" style="font-size: 2.2rem; margin-bottom:10px; color:#1a3c6e;">📢 알림 & 소식</h1>
            <p id="board-desc" style="color:#666;">데이터를 불러오는 중입니다...</p>
        </div>
    </div>

    <div class="board-container">
        <!-- 글쓰기 버튼 (우측 정렬) -->
        <div style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
            <button id="btn-user-write" class="btn-action" style="display: none;" onclick="location.href='write.html#' + currentCategory">✏️ 글쓰기</button>
        </div>

        <div class="board-list-head">
            <div class="b-num">번호</div>
            <div class="b-cat">작성자</div>
            <div class="b-title">제목</div>
            <div class="b-date">작성일</div>
        </div>

        <div id="board-list-wrapper">
            <div style="text-align:center; padding:50px; color:#999;">데이터를 불러오는 중입니다...</div>
        </div>

        <div id="pagination-box" class="pagination" style="margin-top:40px;"></div>

        <!-- ★ 하단 중앙 검색창 영역 ★ -->
        <div style="display: flex; justify-content: center; align-items: center; margin-top: 30px; gap: 5px;">
            <input type="text" id="search-input" class="form-input" style="width: 250px; padding: 8px;" placeholder="제목 검색" onkeypress="if(event.keyCode==13) executeSearch();">
            <button onclick="executeSearch()" class="btn-action" style="padding: 8px 15px;">검색</button>
        </div>
    </div> <!-- // board-container 끝 -->

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="manager.js"></script>

    <script>
        const ITEMS_PER_PAGE = 10;
        let currentPage = 1;
        let currentCategory = location.hash.replace('#', '') || 'notice';
        let currentSearchKeyword = ''; // 검색어를 저장할 변수

        document.addEventListener("DOMContentLoaded", () => {
            const checkReady = setInterval(() => {
                if (window.sb && window.GLOBAL_CATEGORIES && window.GLOBAL_CATEGORIES.length > 0) {
                    clearInterval(checkReady);
                    updateBoardHeader();
                    loadBoardList(1);
                }
            }, 100);
        });

        window.addEventListener('hashchange', () => {
            currentCategory = location.hash.replace('#', '') || 'notice';

            // 탭 이동 시 검색어 상태 및 입력창 초기화
            currentSearchKeyword = '';
            const searchInput = document.getElementById('search-input');
            if (searchInput) searchInput.value = '';

            updateBoardHeader();
            loadBoardList(1);
        });

        function updateBoardHeader() {
            const catInfo = window.GLOBAL_CATEGORIES.find(c => c.code === currentCategory);
            if (catInfo) {
                document.getElementById('board-title').innerText = catInfo.name;
                document.getElementById('board-desc').innerText = catInfo.hero_desc || "뉴키즈의 게시판입니다.";
                document.title = "뉴키즈 - " + catInfo.name;
            }

            // 카테고리가 'notice'면 글쓰기 버튼 숨김, 아니면 표시
            const writeBtn = document.getElementById('btn-user-write');
            if (currentCategory === 'notice') {
                writeBtn.style.display = 'none';
            } else {
                writeBtn.style.display = 'inline-block';
            }
        }

        // 검색 버튼 클릭 및 엔터 입력 시 실행되는 함수
        function executeSearch() {
            const inputVal = document.getElementById('search-input').value.trim();
            currentSearchKeyword = inputVal;
            loadBoardList(1); // 검색 시 무조건 1페이지부터 보여주기
        }

        async function loadBoardList(page) {
            currentPage = page;
            const listDiv = document.getElementById('board-list-wrapper');

            // 정상 복구된 페이지 계산 수식
            const from = (page - 1) * ITEMS_PER_PAGE;
            const to = from + ITEMS_PER_PAGE - 1;

            listDiv.innerHTML = '<div style="text-align:center; padding:50px; color:#999;">로딩 중...</div>';

            // 1단계: Supabase 쿼리 객체 생성 (숨김 처리된 게시글 제외 조건 재적용)
            let query = window.sb.from('total_posts')
                .select('id, title, category, created_at, link_url', { count: 'exact' })
                .eq('category', currentCategory)
                .neq('is_visible', false);

            // 2단계: 검색어가 존재할 경우에만 제목 기준 부분 일치(ilike) 조건 추가
            if (currentSearchKeyword !== '') {
                query = query.ilike('title', `%${currentSearchKeyword}%`);
            }

            // 3단계: 최종 쿼리에 정렬 및 페이지 범위 적용 후 서버로 요청 전송
            const { data, count, error } = await query
                .order('created_at', { ascending: false })
                .range(from, to);

            if (error) {
                listDiv.innerHTML = `<div style="text-align:center; padding:30px;">에러: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                listDiv.innerHTML = `<div style="text-align:center; padding:50px; border-bottom:1px solid #eee;">등록되거나 검색된 글이 없습니다.</div>`;
                document.getElementById('pagination-box').innerHTML = '';
                return;
            }

            let html = '';
            data.forEach((item, index) => {
                const date = new Date(item.created_at).toISOString().split('T')[0];

                // 공지사항이면 무조건 '관리자', 자유게시판이면 작성자가 쓴 이름(link_url) 표시
                const authorName = (currentCategory === 'notice') ? '관리자' : (item.link_url || '익명');

                // 정상 복구된 화면용 순번 계산 수식
                const displayNum = count - from - index;

                html += `
                                    <div class="board-list-row" onclick="location.href='view.html?id=${item.id}'">
                                        <div class="b-num">${displayNum}</div>
                                        <div class="b-cat"><span class="badge" style="background:#f1f3f5; color:#555;">${authorName}</span></div>
                                        <div class="b-title">${item.title}</div>
                                        <div class="b-date">${date}</div>
                                    </div>`;
            });
            listDiv.innerHTML = html;

            renderPagination(count, currentPage);
        }

        function renderPagination(totalCount, current) {
            const wrapper = document.getElementById('pagination-box');
            wrapper.innerHTML = '';
            const totalPages = Math.ceil(totalCount / ITEMS_PER_PAGE);
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                wrapper.innerHTML += `<button class="page-btn ${i === current ? 'active' : ''}" onclick="loadBoardList(${i})">${i}</button>`;
            }
        }
    </script>
</body>
</html>
