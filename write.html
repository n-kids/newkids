<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴키즈 - 글쓰기</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body style="background:#f9fbfd;">

    <header></header>

    <div class="container" style="padding-top:100px; padding-bottom:50px;">
        <div class="panel-box" style="max-width:1200px; margin:0 auto;">
            <h2 id="write-header-title" style="text-align:center; color:#1a3c6e; margin-bottom:30px;">✏️ 게시판 글쓰기</h2>

            <div class="form-group">
                <label class="form-label">제목</label>
                <input type="text" id="w-title" class="form-input" placeholder="제목을 입력하세요">
            </div>

            <div class="form-group" style="background:#f0f7ff; padding:15px; border-radius:8px; border:1px solid #cce5ff; margin-bottom:20px;">
                <label class="form-label" style="margin-bottom:10px;">게시글 공개 설정</label>
                <div style="display:flex; gap:30px; align-items:center;">
                    <label style="cursor:pointer; display:flex; align-items:center; font-weight:bold;">
                        <input type="radio" name="w-secret" value="false" checked style="width:18px; height:18px; margin-right:8px; accent-color:#1a3c6e;">
                        🌐 공개글 (누구나 볼 수 있음)
                    </label>
                    <label style="cursor:pointer; display:flex; align-items:center; font-weight:bold; color:#d35400;">
                        <input type="radio" name="w-secret" value="true" style="width:18px; height:18px; margin-right:8px; accent-color:#d35400;">
                        🔒 비밀글 (작성자와 관리자만 볼 수 있음)
                    </label>
                </div>
            </div>

            <div style="display:flex; gap:15px; margin-bottom:20px;">
                <div style="flex:1;">
                    <label class="form-label">작성자</label>
                    <input type="text" id="w-author" class="form-input" placeholder="이름 또는 닉네임">
                </div>
                <div style="flex:1;">
                    <label class="form-label">비밀번호 (연락처 / 수정 및 삭제용)</label>
                    <input type="password" id="w-password" class="form-input" placeholder="비밀번호 또는 연락처">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">내용</label>
                <textarea id="w-content" class="form-input" style="height:300px; resize:vertical;" placeholder="내용을 입력해주세요."></textarea>
            </div>

            <div class="form-group" style="margin-top:20px; background-color: #fafafa; padding: 15px; border: 1px dashed #bbb; border-radius: 8px;">
                <label class="form-label">📷 이미지 및 첨부파일 업로드 (선택 / 여러 장 가능)</label>
                <input type="file" id="w-images" class="form-input" accept="image/*" multiple style="background:#fff;">
                <p style="font-size: 0.8rem; color: #888; margin-top: 5px;">* 문의글과 관련된 사진이나 이미지를 첨부하실 수 있습니다.</p>
            </div>

            <div style="text-align:center; margin-top:30px; display:flex; gap:10px; justify-content:center;">
                <button id="btn-submit-user" onclick="saveUserPost()" class="btn-action" style="min-width:150px;">글 등록하기</button>
                <button onclick="history.back()" class="btn-action" style="background:#999; min-width:150px;">취소</button>
            </div>
        </div>
    </div>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="manager.js"></script>
    <script>
        // 현재 접속한 게시판 카테고리 파악
        const targetCategory = location.hash.replace('#', '') || 'free';

        // 💡 구글 엑셀/이메일 연동 웹 앱 URL (여기에 원장님이 발급받으신 주소를 넣으세요!)
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwg3sdchHSL78qiknJqZwSa1FFAq3klTKB0xXQ7t_mTad5AwLyqQwydemkWP4PdmfdooQ/exec";

        document.addEventListener("DOMContentLoaded", () => {
            const checkReady = setInterval(() => {
                if (window.GLOBAL_CATEGORIES && window.GLOBAL_CATEGORIES.length > 0) {
                    clearInterval(checkReady);
                    const catInfo = window.GLOBAL_CATEGORIES.find(c => c.code === targetCategory);
                    if (catInfo) {
                        document.getElementById('write-header-title').innerText = `✏️ ${catInfo.name} 글쓰기`;
                    }
                }
            }, 100);
        });

        async function saveUserPost() {
            const title = document.getElementById('w-title').value.trim();
            const author = document.getElementById('w-author').value.trim();
            const password = document.getElementById('w-password').value.trim();
            const content = document.getElementById('w-content').value.trim();
            const isSecret = document.querySelector('input[name="w-secret"]:checked').value === "true";
            const fileInput = document.getElementById('w-images');

            if (!title || !author || !password || !content) {
                return alert("모든 항목을 입력해주세요.");
            }

            if (!confirm("글을 등록하시겠습니까?")) return;

            // 중복 클릭 방지 처리
            const submitBtn = document.getElementById('btn-submit-user');
            submitBtn.disabled = true;
            submitBtn.innerText = "업로드 중...";

            let finalImageUrls = null;

            try {
                // 1. 첨부파일(이미지)이 있다면 Supabase Storage에 업로드
                if (fileInput.files.length > 0) {
                    let uploadedUrls = [];
                    for (let i = 0; i < fileInput.files.length; i++) {
                        const file = fileInput.files[i];
                        const ext = file.name.split('.').pop();
                        const safeKey = `user_${Date.now()}_${i}.${ext}`;

                        const { data, error: uploadError } = await window.sb.storage.from('images').upload(safeKey, file);
                        if (uploadError) throw uploadError;

                        const publicUrl = window.sb.storage.from('images').getPublicUrl(data.path).data.publicUrl;
                        uploadedUrls.push(publicUrl + '@@' + file.name); // 첨부파일 다운로드 로직을 위해 원본 파일명 매핑
                    }
                    finalImageUrls = uploadedUrls.join('||');
                }

                // 줄바꿈 및 태그 처리
                const safeContent = window.escapeHtml(content).replace(/\n/g, "<br>");

                // 2. 🎯 Supabase 데이터베이스에 공통 저장 (어떤 카테고리든 무조건 저장되어 홈페이지에 노출)
                const { error } = await window.sb.from('total_posts').insert([{
                    category: targetCategory,
                    title: window.escapeHtml(title),
                    content: safeContent,
                    link_url: window.escapeHtml(author), 
                    video_url: password,                 
                    order_num: 0,
                    is_visible: true,
                    is_secret: isSecret,
                    image_url: finalImageUrls 
                }]);

                if (error) throw error;

                // ==========================================================
                // 🚀 [카테고리 분기 핵심 로직] 
                // 견적서(proposal)와 발주요청(order)이 '아닐 때만' 구글 엑셀로 신호를 보냅니다.
                // ==========================================================
                if (targetCategory !== 'proposal' && targetCategory !== 'order') {
                    const formData = new URLSearchParams();
                    formData.append('title', title);
                    formData.append('author', author);
                    formData.append('contact', password); // 비밀번호(연락처) 값 전달
                    formData.append('content', content);

                    // 메일 알림/엑셀 연동 실패가 홈페이지 글 등록 자체를 방해하지 않도록 try-catch 처리
                    try {
                        // GOOGLE_SCRIPT_URL이 제대로 입력되어 있을 때만 실행
                        if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL.includes('script.google.com')) {
                            await fetch(GOOGLE_SCRIPT_URL, {
                                method: 'POST',
                                body: formData,
                                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            });
                        }
                    } catch (excelError) {
                        console.error("구글 엑셀 알림 전송 지연 (게시글 등록은 정상 완료됨):", excelError);
                    }
                }

                alert("글이 성공적으로 등록되었습니다!");
                location.href = `notice.html#${targetCategory}`;

            } catch (err) {
                alert("등록 중 오류가 발생했습니다: " + err.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "글 등록하기";
            }
        }
    </script>
</body>
</html>
