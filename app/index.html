<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뉴키즈 주문</title>
<meta name="theme-color" content="#1B2A4A">
<meta name="description" content="뉴키즈 어린이집·유치원 교재와 물품 주문, A/S 신청, 거래명세서 요청">
<meta property="og:title" content="뉴키즈 주문">
<meta property="og:description" content="교재 · 물품 주문과 A/S를 한 곳에서">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo-n.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="뉴키즈 주문">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
/* 레이아웃: 휴대폰 한 화면. 위 앱바 + 가운데 스크롤 + 아래 탭바. 넓은 화면에서는 가운데 560px
   크기·간격·모서리는 app.css 머리말의 디자인 값만 사용 */
html,body{height:100%}
body{display:flex;justify-content:center;background:#F6EBE1}
.app{width:100%;max-width:560px;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px)}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.brandmark{display:flex;align-items:center;gap:8px}
.brandmark img{width:32px;height:32px;border-radius:var(--r-xs)}
.brandmark b{font-size:18px;line-height:24px;font-weight:700;letter-spacing:-.01em}
.brandmark small{display:block;font-size:12px;line-height:16px;color:var(--muted)}
.who{font-size:12px;line-height:16px;color:var(--muted);text-align:right;border:0;background:none;padding:4px;border-radius:var(--r-xs);transition:background-color .3s var(--ease)}
.who:hover{background:var(--sunk)}
.who b{color:var(--ink);font-size:14px;line-height:20px;font-weight:600}
.scroll{flex:1;overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.scroll>*{flex-shrink:0}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;line-height:16px;font-weight:500;color:var(--muted);padding:4px 0;position:relative;border-radius:var(--r-xs);
  transition:color .3s var(--ease),background-color .3s var(--ease)}
.tabbar button:hover{color:var(--ink)}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--accent-text);font-weight:600}
.dot{position:absolute;top:0;right:22%;min-width:16px;height:16px;border-radius:var(--r-xs);background:var(--accent);color:#fff;font-size:12px;line-height:16px;font-weight:600;padding:0 4px}
.pending{background:var(--soft);color:var(--accent-text);border-radius:var(--r-sm);padding:8px 12px;font-size:14px;line-height:20px}

.join{flex:1;overflow-y:auto;padding:8px 24px 32px;display:flex;flex-direction:column;gap:16px}
.join>*{flex-shrink:0}
.join .hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:24px 0 4px}
.join .hero img{width:72px;height:72px;border-radius:var(--r-md)}
.rainbow{display:flex;gap:4px;justify-content:center}
.rainbow i{width:24px;height:4px;border-radius:2px}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:var(--r-sm);padding:4px}
.seg2 button{border:0;background:none;border-radius:var(--r-xs);padding:8px;color:var(--muted);font-weight:500;transition:background-color .3s var(--ease),color .3s var(--ease)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600}
.regions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.regions label{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 0;text-align:center;background:var(--surface);cursor:pointer;font-weight:500;transition:background-color .3s var(--ease),border-color .3s var(--ease)}
.regions label:hover{background:var(--sunk)}
.regions label:has(input:checked){border-color:var(--accent);background:var(--soft);color:var(--accent-text);font-weight:600}
.regions input{position:absolute;opacity:0;pointer-events:none}

.banner{background:var(--brand);color:#fff;border-radius:var(--r);padding:16px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.banner b{font-size:20px;line-height:28px;font-weight:600;display:block;letter-spacing:-.01em}
.banner small{opacity:.8;font-size:12px;line-height:16px}
button.banner{border:0;width:100%;text-align:left;cursor:pointer;transition:background-color .3s var(--ease),transform .5s var(--ease)}
button.banner:hover{background:var(--brand-hover)}
button.banner:active{transform:scale(.98)}
button.banner span{display:flex;flex-direction:column;gap:2px}
button.banner img{border-radius:var(--r-xs)!important}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;line-height:16px;font-weight:500;
  transition:background-color .3s var(--ease),transform .5s var(--ease)}
.quick button:hover{background:var(--sunk)}
.quick button:active{transform:scale(.98)}
.quick svg{width:24px;height:24px;color:var(--accent)}
.homelink{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);transition:background-color .3s var(--ease),transform .5s var(--ease)}
.homelink:hover{background:var(--sunk)}
.homelink:active{transform:scale(.98)}
.homelink img{width:40px;height:40px;flex:none}
.homelink span{flex:1;display:flex;flex-direction:column;gap:2px}
.homelink svg{width:20px;height:20px;flex:none;color:var(--muted)}
.quick.three{grid-template-columns:repeat(3,1fr)}
.eline{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.eline-h{display:flex;align-items:center;gap:8px}
.eline-h b{flex:1;min-width:0;font-size:14px;line-height:20px;font-weight:600}
.eline-q{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eline-q .step{background:var(--sunk);border-radius:var(--r-xs);padding:4px}
.eline .ages{padding:0}
.xbtn{border:0;background:none;color:var(--muted);font-size:12px;line-height:16px;font-weight:600;padding:4px 8px;border-radius:var(--r-2xs);min-height:28px;transition:background-color .3s var(--ease)}
.xbtn:hover{background:var(--sunk);color:var(--ink)}
.morebtn{border:1px dashed var(--accent);background:var(--surface);color:var(--accent-text);border-radius:var(--r-sm);padding:8px 12px;min-height:40px;font-size:14px;line-height:20px;font-weight:600;transition:background-color .3s var(--ease)}
.morebtn:hover{background:var(--soft)}
.notice{display:flex;flex-direction:column;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.notice li{display:flex;gap:8px;font-size:14px;line-height:20px;align-items:baseline;text-wrap:pretty}

.past{background:var(--soft);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:8px}
.past .btn{border-radius:var(--r-2xs)}
.past ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:20px}
.past li{display:flex;justify-content:space-between;gap:8px}
.past li span:last-child{color:var(--muted);white-space:nowrap}
.plist{display:flex;flex-direction:column;gap:8px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;transition:border-color .3s var(--ease)}
.prog.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.prog-h{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px;text-align:left;transition:background-color .3s var(--ease)}
.prog-h:hover{background:var(--sunk)}
.prog-h .ck{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-size:14px;transition:background-color .3s var(--ease),border-color .3s var(--ease)}
.prog.on .ck{background:var(--accent);border-color:var(--accent)}
.prog-h b{display:block;font-size:14px;line-height:20px;font-weight:600}
.prog-h .tags{font-size:12px;line-height:16px;color:var(--accent-text)}
.prog-h .q{margin-left:auto;font-size:14px;line-height:20px;font-weight:600;color:var(--ink);white-space:nowrap}
.ages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px 12px}
.age{background:var(--sunk);border-radius:var(--r-xs);padding:4px;text-align:center}
.age label{font-size:12px;line-height:16px;color:var(--muted);display:block}
.step{display:flex;align-items:center;justify-content:center;gap:2px}
.step button{width:28px;height:28px;border-radius:var(--r-2xs);border:0;background:var(--surface);line-height:1;padding:0;transition:background-color .3s var(--ease),transform .5s var(--ease)}
.step button:hover{background:var(--soft)}
.step button:active{transform:scale(.98)}
.step input{width:32px;text-align:center;border:0;background:none;font-weight:600;padding:0}
.sticky{position:sticky;bottom:0;z-index:2}
.cartbar{background:var(--brand);color:#fff;border-radius:var(--r-md);padding:8px 8px 8px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:var(--float)}
.cartbar .btn{background:var(--accent);color:#fff}
.cartbar .btn:hover{background:#D46D45}

.sections{display:grid;gap:8px}
.section{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  transition:background-color .3s var(--ease),transform .5s var(--ease)}
.section:hover{background:var(--sunk)}
.section:active{transform:scale(.98)}
.section .ic{width:56px;height:56px;border-radius:var(--r-xs);display:grid;place-items:center}
.section .ic svg{width:32px;height:32px}
.section b{display:block;font-size:16px;line-height:24px;font-weight:600}
.section small{color:var(--muted);font-size:12px;line-height:16px}
.backbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 8px;min-height:32px;font-size:14px;line-height:20px;font-weight:600;color:var(--ink);
  transition:background-color .3s var(--ease),transform .5s var(--ease)}
.backbtn:hover{background:var(--sunk)}
.backbtn:active{transform:scale(.98)}
.backbtn svg{width:16px;height:16px}
.backrow{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:8px}
.good{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.good .pic{aspect-ratio:1;max-width:100%;background:#fff;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line)}
.good .pic img{width:100%;height:100%;object-fit:contain;background:#fff}
.good .pic.page img{padding:4px}
.good .pic .ph{font-size:24px;line-height:32px;font-weight:600;color:var(--muted);opacity:.5;text-align:center;padding:8px}
.good .meta{padding:8px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.good .meta b{font-size:14px;line-height:20px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.good .meta small{color:var(--muted);font-size:12px;line-height:16px}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px}
.price s{color:var(--muted);font-size:12px}
.price em{font-style:normal;color:var(--accent-text);font-weight:600;font-size:12px}
.price strong{font-size:16px;line-height:24px;font-weight:600}
.good .btn{margin-top:auto;border-radius:var(--r-2xs)}
.kplink{align-self:flex-start;font-size:12px;line-height:16px;font-weight:600;color:var(--accent-text);text-decoration:none;padding:2px 0}
.kplink:hover{text-decoration:underline}
.more{align-self:center}
.pages{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;flex-shrink:0}
.pages button{flex:none;border:1px solid var(--line);border-radius:var(--r-xs);padding:0;background:var(--surface);overflow:hidden;width:64px;transition:transform .5s var(--ease)}
.pages button:hover{transform:translateY(-2px)}
.pages img{display:block;width:64px;height:auto}

.sheet{position:absolute;inset:0;background:rgba(27,42,74,.4);display:flex;align-items:flex-end;z-index:20;animation:sheet-bg .3s var(--ease)}
.sheet.still,.sheet.still .panel{animation:none}
.sheet .panel{background:var(--bg);width:100%;border-radius:var(--r) var(--r) 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;
  animation:sheet-up .5s var(--ease)}
@keyframes sheet-bg{from{opacity:0}to{opacity:1}}
@keyframes sheet-up{from{transform:translateY(32px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 0;padding:8px 40px;box-sizing:content-box;background-clip:content-box;flex:none;touch-action:none}
.sheet .panel{overscroll-behavior:contain}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.col{grid-template-columns:1fr}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;cursor:pointer;background:var(--surface);transition:background-color .3s var(--ease),border-color .3s var(--ease)}
.opt:hover{background:var(--sunk)}
.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}
.opt input{margin-top:2px;accent-color:var(--accent)}
.opt b{display:block;font-size:14px;line-height:20px;font-weight:600}
.opt small{display:block;color:var(--muted);font-size:12px;line-height:16px}
.li{display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:20px;padding:4px 0}
.li span:first-child{min-width:0}
.total{display:flex;justify-content:space-between;font-weight:600;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}

.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:72px;height:72px;object-fit:cover;border-radius:var(--r-xs);border:1px solid var(--line)}
.upload{width:72px;height:72px;border-radius:var(--r-xs);border:1px dashed var(--accent);display:grid;place-items:center;color:var(--accent-text);font-size:12px;line-height:16px;text-align:center;cursor:pointer;background:var(--surface);transition:background-color .3s var(--ease)}
.upload:hover{background:var(--soft)}

.trk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:8px}
.trk-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.trk-top b{font-size:14px;line-height:20px;font-weight:600}
.trk-top small{color:var(--muted);font-size:12px;line-height:16px;white-space:nowrap}
.trk p{margin:0;font-size:14px;line-height:20px;color:var(--muted)}
.bars{display:grid;gap:4px}
.bars i{height:4px;border-radius:2px;background:var(--line);transition:background-color .3s var(--ease)}
.bars i.on{background:var(--accent)}
.names{display:grid;font-size:12px;line-height:16px;color:var(--muted)}
.names .on{color:var(--accent-text);font-weight:600}
.trk .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r-xs);padding:8px 12px;background:var(--surface)}
.start{display:flex;flex-direction:column;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.start .btns{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="root" style="display:flex;flex-direction:column;flex:1;min-height:0"><div class="spinner" aria-label="불러오는 중"><div class="skel" style="height:56px"></div><div class="skel" style="height:112px;border-radius:24px"></div><div class="skel" style="height:72px"></div><div class="skel" style="height:136px"></div></div></div>
  <div id="sheetHost"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
/* ---------- 상태 ---------- */
const TOKEN_KEY = 'nk-order-token';
let me = null;                 // {token,kg,name,phone,region,status,email}
let myOrders = [];
let auth = {mode:'join', kg:'', name:'', phone:'', region:'', pin:'', pin2:'', busy:false};
let tab = 'home';
let book = {month:MONTHS[MONTHS.length-1], tag:'전체', q:'', sel:{}};
let goods = {sec:null, cat:'rec', q:'', shown:24, wear:'전체'};
let cart = {};
let as = {prog:'', step:'', ho:'', photos:[], text:''};
const blankReq = kind => ({kind, topic:'', text:'', name:'', date:'', phone:me?fmtPhone(me.phone||''):'', item:'', ho:'', qty:'', reason:'', photos:[]});
let req = blankReq('ask');   // 단순 문의 · 행사 문의 · 반품 요청
let stmtOpen = null;
let checkout = null;
let busy = false;
let backTo = null;   // 주문을 넣기 전에 보던 화면. 내 주문에서 "…계속하기"로 돌아감

// 휴대폰 뒤로가기: 앱 안 화면 이동을 기록해 두고 하나씩 되돌림. 아래에서 올라온 창이 열려 있으면 그 창부터 닫음
const navStack = [];
function pushView(){
  navStack.push({tab, sec:goods.sec, cat:goods.cat, wear:goods.wear});
  try { if (history.state?.sheet) history.replaceState({nk:navStack.length}, ''); else history.pushState({nk:navStack.length}, ''); } catch(_){}
}
function sheetOpened(){ try { if (!history.state?.sheet) history.pushState({sheet:1}, ''); } catch(_){} }
function closeSheet(){ checkout = null; $('#sheetHost').innerHTML = ''; }
function dismissSheet(){ if (history.state?.sheet) history.back(); else closeSheet(); }
// 아래에서 올라온 창: 아래로 쓸어 내리거나 바깥 어두운 곳을 누르면 닫힘 (창 안을 내려 본 상태면 맨 위 손잡이에서만)
let drag = null;
document.addEventListener('touchstart', e => {
  const p = e.target.closest('.sheet .panel'); if (!p) return;
  if (p.scrollTop > 0 && !e.target.closest('.grab')) return;
  drag = {p, y0:e.touches[0].clientY, t0:Date.now(), dy:0};
}, {passive:true});
document.addEventListener('touchmove', e => {
  if (!drag) return;
  const dy = e.touches[0].clientY - drag.y0;
  if (dy <= 0 && !drag.dy){ drag = null; return; }   // 위로 밀면 그냥 창 안 스크롤
  drag.dy = Math.max(0, dy);
  drag.p.style.transition = 'none'; drag.p.style.transform = `translateY(${drag.dy}px)`;
  if (e.cancelable) e.preventDefault();
}, {passive:false});
document.addEventListener('touchend', () => {
  if (!drag) return;
  const {p, dy, t0} = drag; drag = null;
  if (dy > Math.min(120, p.offsetHeight * .25) || (dy > 40 && dy / (Date.now() - t0) > .5)){
    p.style.transition = 'transform .25s var(--ease)'; p.style.transform = 'translateY(100%)'; setTimeout(dismissSheet, 200);
  } else if (dy){ p.style.transition = 'transform .3s var(--ease)'; p.style.transform = ''; }
});
document.addEventListener('click', e => { if (e.target.classList?.contains('sheet')) dismissSheet(); });
// 수량을 바꾸면 목록과 주문 확인 창을 같이 다시 그림
function redraw(){ keepScroll(render); if (checkout) renderSheet(); }
window.addEventListener('popstate', () => {
  if ($('#sheetHost .sheet')){ closeSheet(); return; }
  const v = navStack.pop(); if (!v || !me) return;
  tab = v.tab; goods.sec = v.sec; goods.cat = v.cat; goods.wear = v.wear; render();
  if ($('#appScroll')) $('#appScroll').scrollTop = 0;
});

const token = () => { try { return localStorage.getItem(TOKEN_KEY); } catch(_) { return null; } };
const saveToken = t => { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch(_) {} };

async function boot(){
  const t = token();
  if (t){
    try { me = await rpc('nk_me', {p_token:t}); await loadOrders(); }
    catch(e){ me = null; saveToken(null); }
  }
  render();
}
async function loadOrders(){ if (me) myOrders = await rpc('nk_my_orders', {p_token:me.token}) || []; }

/* ---------- 화면 ---------- */
function render(){
  const root = $('#root');
  if (!me){ root.innerHTML = authView(); return; }
  const active = myOrders.filter(o=>!isDone(o)).length;
  root.innerHTML = `
    <div class="appbar">
      <span class="brandmark"><img src="logo-n.png" alt=""><span><b>뉴키즈</b><small>어린이집 · 유치원 파트너</small></span></span>
      <button class="who" id="whoBtn" aria-label="내 정보"><b>${esc(me.kg)}</b><br>${esc(me.name)}님 · ${esc(me.region)}</button>
    </div>
    <div class="scroll" id="appScroll">
      ${me.status!=='approved'?`<div class="pending"><b>가입 승인 대기 중이에요.</b> 뉴키즈에서 확인하면 바로 주문할 수 있어요. 그동안 상품은 둘러보실 수 있습니다.</div>`:''}
      ${({home:homeView,book:bookView,goods:goodsView,as:asView,req:reqView,track:trackView})[tab]()}

    <nav class="tabbar">${[['home','홈','home'],['book','교재 주문','book'],['goods','물품 주문','box'],['as','A/S','tool'],['track','내 주문','list']].map(([k,l,i])=>
      `<button data-tab="${k}" ${tab===k?'aria-current="page"':''}>${ICON[i]}${l}${k==='track'&&active?`<span class="dot num">${active}</span>`:''}</button>`).join('')}</nav>`;
}

const emptySel = () => ({q:[0,0,0,0,0,0], st:{}});
// 연령별(또는 단계별) 수량 칸. 교재 목록과 주문 확인 창에서 같이 씀 (pre = id 앞머리, 두 곳의 id가 겹치지 않게)
function qtyBoxes(b, s, pre){
  const n = esc(b.n);
  const box = (id, label, val, key, input) => `<div class="age"><label for="${id}">${label}</label>
      <div class="step"><button data-${key}="${n}|${input}|-1" aria-label="${n} ${label} 빼기">−</button>
      <input id="${id}" class="num" inputmode="numeric" value="${val}" data-${key}input="${n}|${input}">
      <button data-${key}="${n}|${input}|1" aria-label="${n} ${label} 더하기">+</button></div></div>`;
  return BOOK_STEPS[b.n]
    ? BOOK_STEPS[b.n].map((st,i)=>box(`${pre}s-${n}-${i}`, stepLabel(st), s.st[st]||0, 'stp', st)).join('')
    : AGES.map((a,j)=>agesOf(b.n).includes(j) ? box(`${pre}a-${n}-${j}`, a, s.q[j], 'age', j) : '').join('');
}
function bookCard(b){
  const on = !!book.sel[b.n]; const s = book.sel[b.n];
  const n = esc(b.n);
  const boxes = on ? qtyBoxes(b, s, '') : '';
  return `<div class="prog ${on?'on':''}">
    <button class="prog-h" data-prog="${n}" aria-expanded="${on}"><span class="ck">${on?'✓':''}</span>
      <span style="min-width:0"><b>${n}</b><span class="tags">${b.t.map(t=>'#'+t).join(' ')}</span></span>
      ${on?`<span class="q num">${lineTotal(s)}${b.n==='쿡쿡'?'개':'권'}</span>`:''}</button>
    ${on?`<div class="ages">${boxes}</div>${BOOK_NOTES[b.n]?`<p class="hint" style="margin:0 12px 10px">${esc(BOOK_NOTES[b.n])}</p>`:''}`:''}
  </div>`;
}

/* 물품 주문 */

    </div>${bar}`;
  const back = `<button class="backbtn" data-sec="">${ICON.back}물품 주문 처음으로</button>`;
  if (goods.sec==='equip'){
    if (kpReady!==true) return `${back}${kpReady==='fail'?'<div class="card hint">상품 목록을 불러오지 못했어요. 잠시 뒤 다시 열어주세요.</div>':`<div class="skel" style="height:40px"></div><div class="grid2" aria-label="상품 불러오는 중">${'<div class="skel" style="height:248px"></div>'.repeat(4)}</div>`}`;

    const all = KP.items.filter(it=>it[5]==='');

      <div><p class="h2">비품 및 교구</p><p class="sub">국민서관 키드팡 상품 <b class="num">${all.length.toLocaleString()}</b>개 · ${KP.at} 기준 할인가</p></div>

        ${r ? `<p class="flabel" style="margin:8px 0 0;font-size:16px;line-height:24px">${esc(r[0])} <span class="tag sun">이번 달</span> <span class="hint num">${its.length}</span></p>` : ''}

      ${list.length>goods.shown?`<button class="btn line small more" id="gMore">더 보기 (${(list.length-goods.shown).toLocaleString()}개 남음)</button>`:''}${bar}`;
  }
  if (goods.sec==='gift'){
    const q = goods.q.trim().replace(/\s+/g,'');
    const items = GIFTS.map(([n,grp],i)=>({type:'gift', id:'g:'+n, name:n, vendor:'나비북스', sub:grp, img:`nbi/nb${String(i+1).padStart(2,'0')}.jpg`}))

    ['국민서관', [['', KPW.map(it=>({type:'wear', id:it[0], name:it[1], vendor:'국민서관', sub:it[5]==='bag'?'가방':'원복'}))]]],

  ];
  const show = groups.filter(([v])=>goods.wear==='전체'||goods.wear===v);
  const count = subs => subs.reduce((a,[,items])=>a+items.length,0);

function goodCard(g){
  const th = g.img || THUMBS[g.id];
  const inCart = cart[g.id]?.qty;
  const priced = g.type==='equip';
  const pct = priced && g.list && g.sale && g.sale<g.list ? Math.round((1-g.sale/g.list)*100) : 0;
  // 국민서관 상품은 사진·상세보기를 누르면 키드팡 상품 쪽이 새 창으로 열림
  const kp = g.vendor==='국민서관' && /^\d+$/.test(g.id) ? `https://kidpang.net/product/detail.html?product_no=${g.id}` : '';
  const pic = th?`<img src="${th}" alt="" loading="lazy">`:`<span class="ph">${esc(g.name.replace(/^\[[^\]]*\]/,'').slice(0,4))}</span>`;
  return `<div class="good">
    <div class="pic ${g.page?'page':''}">${g.page?`<button data-cat-page="${g.cat}|${g.page}" aria-label="카탈로그 ${g.page}쪽 크게 보기" style="border:0;padding:0;background:none;width:100%;height:100%">${pic}</button>`
      : kp?`<a href="${kp}" target="_blank" rel="noopener" aria-label="${esc(g.name)} 키드팡에서 자세히 보기" style="display:contents">${pic}</a>`:pic}</div>
    <div class="meta">${g.isNew?'<span class="tag sun" style="align-self:flex-start">NEW</span>':''}
      <b>${esc(g.name)}</b><small>${esc(g.vendor)}${g.sub?' · '+g.sub:''}</small>${g.note?`<small>${esc(g.note)}</small>`:''}
      ${kp?`<a class="kplink" href="${kp}" target="_blank" rel="noopener">키드팡 상세보기 ›</a>`:''}
      ${priced?`<span class="price">${pct?`<s class="num">${won(g.list)}</s><em class="num">${pct}%</em>`:''}<strong class="num">${won(g.sale||g.list)}</strong></span>`:'<small>가격 문의</small>'}
      <button class="btn small ${inCart?'':'ghost'}" data-add="${esc(g.id)}" data-type="${g.type}" data-name="${esc(g.name)}" data-vendor="${esc(g.vendor)}" data-price="${priced?(g.sale||g.list):0}">${inCart?`담김 ${inCart} · 더 담기`:'담기'}</button>
    </div></div>`;
}

    </div>

    ${c.kind==='goods'?`<span class="flabel">결제</span><div class="opts col">${payOpts.map(([k,t,s])=>`<label class="opt"><input type="radio" name="pay" value="${k}" ${c.pay===k?'checked':''}><span><b>${t}</b><small>${s}</small></span></label>`).join('')}</div>

async function placeOrder(){
  const c = checkout;
  const order = {kind:c.kind, quote_want:c.quote==='yes', quote_email:c.quote==='yes'?c.email.trim():'', memo:(c.memo||'').trim()};
  if (c.kind==='book'){
    order.month = book.month;
    order.lines = Object.entries(book.sel).filter(([,s])=>lineTotal(s)>0).map(([n,s])=>{ const l = {name:n, vendor:BOOKS.find(b=>b.n===n).v, q:[...s.q]}; if (Object.keys(s.st).length) l.st = {...s.st}; return l; });
    if (!order.lines.length){ toast('수량을 넣어주세요.'); return; }
  }
  else { order.lines = Object.values(cart).map(i=>({...i})); order.pay = c.pay; }
  busy = true; renderSheet();
  try {
    await rpc('nk_place_order', {p_token:me.token, p_order:order});
    if (order.quote_email) me.email = order.quote_email;
    if (c.kind==='book') book.sel = {}; else cart = {};
    backTo = {tab:c.kind, sec:goods.sec, cat:goods.cat, wear:goods.wear};
    checkout = null; renderSheet(); await loadOrders(); pushView(); tab='track'; render();
    toast(order.quote_want ? '주문이 접수됐어요. 견적서는 메일로 보내드려요.' : '주문이 접수됐어요.');
  } catch(e){ toast(e.message); }
  finally { busy = false; if (checkout) renderSheet(); }
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.auth){ auth.mode = d.auth; render(); return; }
  if (t.id==='aJoin' || t.id==='aLogin'){
    auth.busy = true; render();
    try {
      const h = await pinHash(auth.phone, auth.pin);
      if (t.id==='aJoin') me = await rpc('nk_signup', {p_kg:auth.kg, p_name:auth.name, p_phone:auth.phone, p_region:auth.region, p_pin:h});
      else {
        try { me = await rpc('nk_login', {p_phone:auth.phone, p_pin:h}); }
        catch(err){
          // 예전 방식으로 가입한 원: 한 번만 예전 비밀번호로 확인하고 새 방식(2중 해시)으로 바꿈
          if (err.message !== 'NK_UPGRADE') throw err;
          me = await rpc('nk_login_upgrade', {p_phone:auth.phone, p_pin_old:auth.pin, p_pin:h});
        }
      }
      saveToken(me.token); auth = {mode:'login', kg:'', name:'', phone:'', region:'', pin:'', pin2:'', busy:false};
      await loadOrders(); tab='home'; render();
      toast(me.status==='approved' ? '로그인했어요.' : '가입 신청이 접수됐어요. 승인되면 주문할 수 있어요.');
    } catch(err){ auth.busy = false; render(); toast(err.message); }
    return;
  }
  if (t.id==='whoBtn'){
    $('#sheetHost').innerHTML = `<div class="sheet ${$('#sheetHost .sheet')?'still':''}"><div class="panel"><div class="grab"></div>
      <p class="h2">${esc(me.kg)}</p><p class="sub">${esc(me.name)}님 · ${esc(me.region)} · ${esc(fmtPhone(me.phone))}</p>
      <span class="tag ${me.status==='approved'?'ok':'warn'}" style="align-self:flex-start">${me.status==='approved'?'승인됨':'승인 대기'}</span>
      <button class="btn block line" id="logout">로그아웃</button><button class="btn block" id="coClose">닫기</button></div></div>`;
    sheetOpened(); return;
  }
  if (t.id==='logout'){ saveToken(null); me = null; myOrders = []; $('#sheetHost').innerHTML=''; render(); return; }
  if (d.tab){ if (d.tab!==tab) pushView(); tab = d.tab; checkout=null; renderSheet(); if (tab==='track') { await refresh(); } render(); $('#appScroll') && ($('#appScroll').scrollTop = 0); return; }
  if (d.go){ pushView(); tab = d.go; if (tab==='track') await refresh(); render(); return; }
  if (t.id==='goRec'){ pushView(); tab='goods'; goods.sec='equip'; goods.cat='rec'; goods.q=''; goods.shown=24; render(); $('#appScroll').scrollTop=0; return; }
  if (t.id==='reload'){ await refresh(); keepScroll(render); toast('최신 상태로 바꿨어요.'); return; }
  // 교재
  if (d.tag){ book.tag = d.tag; render(); return; }
  if (d.prog){ if (book.sel[d.prog]) delete book.sel[d.prog]; else book.sel[d.prog] = emptySel(); keepScroll(render); return; }
  if (d.age){ const [n,j,dl] = d.age.split('|'); const q = book.sel[n].q; q[+j] = Math.max(0, q[+j] + +dl); redraw(); return; }
  if (d.stp!==undefined){ const [n,st,dl] = d.stp.split('|'); const m = book.sel[n].st; m[st] = Math.max(0, (m[st]||0) + +dl); if (!m[st]) delete m[st]; redraw(); return; }
  if (t.id==='bRepeat'){ const last = lastBook(); book.sel = {}; last.lines.forEach(l=>{ if (BOOKS.some(b=>b.n===l.name)) book.sel[l.name] = {q:[...(l.q||[0,0,0,0,0,0])], st:{...(l.st||{})}}; }); render(); toast('지난번 주문을 그대로 담았어요. 바뀐 반만 고치세요.'); return; }
  if (t.id==='bCheckout'){ openCheckout('book'); return; }
  // 물품
  if (t.id==='backToShop'){ const b = backTo; backTo = null; pushView(); tab = b.tab; if (b.tab==='req') req = blankReq(b.kind); if (b.tab==='goods'){ goods.sec = b.sec; goods.cat = b.cat; goods.wear = b.wear; } render(); $('#appScroll').scrollTop=0; return; }
  if (d.sec!==undefined){ pushView(); goods.sec = d.sec||null; goods.q=''; goods.shown=24; goods.cat='rec'; render(); $('#appScroll').scrollTop=0; return; }
  if (d.cat!==undefined){ goods.cat = d.cat==='rec' ? 'rec' : +d.cat; goods.shown=24; render(); return; }
  if (d.wear){ goods.wear = d.wear; render(); return; }
  if (t.id==='gMore'){ goods.shown += 24; keepScroll(render); return; }
  if (d.add){ const c = cart[d.add] || (cart[d.add] = {type:d.type, name:d.name, vendor:d.vendor, price:+d.price, qty:0}); c.qty++; keepScroll(render); return; }
  if (t.id==='gCheckout'){ openCheckout('goods'); return; }
  if (d.catPage){ const [k,n] = d.catPage.split('|'); openCatalog(k, +n); return; }
  // 시트
  if (t.id==='coClose' || t.id==='coMore'){ dismissSheet(); return; }
  if (t.id==='coGo'){ placeOrder(); return; }
  if (d.unsel!==undefined){ delete book.sel[d.unsel]; if (!Object.keys(book.sel).length) dismissSheet(); redraw(); return; }
  if (d.gq){ const [id,dl] = d.gq.split('|'); if (cart[id]) cart[id].qty = Math.max(1, cart[id].qty + +dl); redraw(); return; }
  if (d.gdel!==undefined){ delete cart[d.gdel]; if (!Object.keys(cart).length) dismissSheet(); redraw(); return; }
  // 단순 문의 · 행사 문의 · 반품 요청
  if (d.req){ pushView(); req = blankReq(d.req); tab = 'req'; render(); $('#appScroll').scrollTop = 0; return; }
  if (d.reqkind){ req = blankReq(d.reqkind); keepScroll(render); return; }
  if (d.rqtopic){ req.topic = req.topic===d.rqtopic ? '' : d.rqtopic; keepScroll(render); return; }
  if (d.rqevent){ req.name = req.name===d.rqevent ? '' : d.rqevent; keepScroll(render); return; }
  if (t.id==='rqSubmit'){
    const r = req, k = r.kind;
    const info = k==='ask' ? {topic:r.topic}
      : k==='event' ? {group:(EVENT_GROUPS.find(([,ns])=>ns.includes(r.name))||[''])[0], name:r.name, date:r.date, phone:digits(r.phone)}
      : {cat:'교재', item:r.item, ho:r.ho, qty:digits(r.qty), reason:r.reason, vendor:BOOKS.find(b=>b.n===r.item)?.v||''};
    const order = {kind:k, as_info:info, memo:r.text.trim()};
    if (k==='return' && r.photos.length) order.photos = r.photos;
    busy = true; keepScroll(render);
    try {
      await rpc('nk_place_order', {p_token:me.token, p_order:order});
      req = blankReq(k); await loadOrders(); backTo = {tab:'req', kind:k}; pushView(); tab='track'; busy=false; render();
      toast(({ask:'문의가 접수됐어요. 확인해서 연락드릴게요.', event:'행사 문의가 접수됐어요. 담당자가 연락드릴게요.', return:'반품 요청이 접수됐어요.'})[k]);
    } catch(err){ busy=false; keepScroll(render); toast(err.message); }
    return;
  }
  // A/S
  if (t.id==='asSubmit'){
    const b = BOOKS.find(x=>x.n===as.prog);
    busy = true; keepScroll(render);
    try {
      await rpc('nk_place_order', {p_token:me.token, p_order:{kind:'as', as_info:{prog:as.prog, step:as.step, ho:as.ho, vendor:b.v}, photos:as.photos, memo:as.text.trim()}});
      as = {prog:'', step:'', ho:'', photos:[], text:''}; await loadOrders(); backTo = {tab:'as'}; pushView(); tab='track'; busy=false; render(); toast('A/S 신청이 접수됐어요.');
    } catch(err){ busy=false; keepScroll(render); toast(err.message); }
    return;
  }
  // 거래명세서
  if (d.stmt){ stmtOpen = +d.stmt; keepScroll(render); setTimeout(()=>$('#stmtEmail')?.focus(),0); return; }
  if (d.stmtgo){
    const email = $('#stmtEmail').value.trim();
    if (!/.+@.+\..+/.test(email)){ toast('메일 주소를 확인해 주세요.'); return; }
    try { await rpc('nk_request_stmt', {p_token:me.token, p_order_id:+d.stmtgo, p_email:email}); me.email = email; stmtOpen = null; await loadOrders(); keepScroll(render); toast('거래명세서를 요청했어요.'); }
    catch(err){ toast(err.message); }
    return;
  }
});
// 글자 입력 중에는 화면을 다시 그리지 않는다(한글 조합이 끊김). 버튼 상태만 바꾸고, 검색은 조합이 끝난 뒤 잠깐 쉬었다가 목록만 다시 그림
const authMap = {aKg:'kg', aName:'name', aPhone:'phone', aPin:'pin', aPin2:'pin2'};
let searchTimer = null;
function onTyping(e){
  const id = e.target.id;
  if (authMap[id]){ auth[authMap[id]] = e.target.value; updateAuthButtons(); }
  if (id==='qEmail'){ checkout.email = e.target.value; const b = $('#coGo'); if (b) b.disabled = busy || (checkout.quote==='yes' && !/.+@.+\..+/.test(checkout.email)); }
  if (id==='asText'){ as.text = e.target.value; }
  if (id==='coMemo' && checkout){ checkout.memo = e.target.value; }
  const rq = {rqText:'text', rqPhone:'phone', rqQty:'qty', rqDate:'date'}[id];
  if (rq){ req[rq] = e.target.value; const b = $('#rqSubmit'); if (b) b.disabled = !reqReady(); }
  if (id==='bSearch' || id==='gSearch'){
    if (id==='bSearch') book.q = e.target.value; else { goods.q = e.target.value; goods.shown = 24; }
    clearTimeout(searchTimer); searchTimer = setTimeout(() => refreshBelow(id), 200);
  }
}
// 검색창은 그대로 두고 그 아래 목록만 새로 그림 (검색창을 다시 만들면 한글 조합이 끊겨 두 번째 글자부터 안 써짐)
function refreshBelow(id){
  const inp = document.getElementById(id);
  const tmp = document.createElement('div');
  tmp.innerHTML = ({book:bookView, goods:goodsView})[tab]?.() || '';
  const fresh = tmp.querySelector('#'+id);
  if (!inp || !fresh || inp.parentNode !== $('#appScroll')) { refocus(id, render); return; }
  while (inp.nextSibling) inp.nextSibling.remove();
  let n = fresh.nextSibling;
  while (n){ const next = n.nextSibling; inp.parentNode.appendChild(n); n = next; }
}
document.addEventListener('input', onTyping);
document.addEventListener('compositionend', onTyping);
function updateAuthButtons(){
  const a = auth;
  const join = $('#aJoin'), login = $('#aLogin');
  if (join) join.disabled = a.busy || !(a.kg.trim() && a.name.trim() && /^\d{10,11}$/.test(digits(a.phone)) && a.region && /^\d{4,8}$/.test(a.pin) && a.pin===a.pin2);
  if (login) login.disabled = a.busy || !(/^\d{10,11}$/.test(digits(a.phone)) && /^\d{4,8}$/.test(a.pin));
  const hint = $('#pinHint'); if (hint) hint.hidden = !(a.pin2 && a.pin!==a.pin2);
}
document.addEventListener('change', e => {
  const el = e.target;
  if (el.name==='region'){ auth.region = el.value; updateAuthButtons(); }
  if (el.id==='bMonth'){ book.month = el.value; render(); }
  if (el.dataset.ageinput){ const [n,j] = el.dataset.ageinput.split('|'); book.sel[n].q[+j] = Math.max(0, parseInt(el.value)||0); redraw(); }
  if (el.dataset.stpinput!==undefined){ const [n,st] = el.dataset.stpinput.split('|'); const v = Math.max(0, parseInt(el.value)||0); if (v) book.sel[n].st[st] = v; else delete book.sel[n].st[st]; redraw(); }
  if (el.dataset.gqinput!==undefined){ const c = cart[el.dataset.gqinput]; if (c) c.qty = Math.max(1, parseInt(el.value)||1); redraw(); }
  if (el.id==='rqBook'){ req.item = el.value; keepScroll(render); }
  if (el.id==='rqHo'){ req.ho = el.value; const b = $('#rqSubmit'); if (b) b.disabled = !reqReady(); }
  if (el.id==='rqReason'){ req.reason = el.value; const b = $('#rqSubmit'); if (b) b.disabled = !reqReady(); }
  if (el.id==='rqFile'){
    const files = [...el.files].slice(0, 4-req.photos.length);
    Promise.all(files.map(f=>shrinkPhoto(f, 1280, .72))).then(list=>{ req.photos.push(...list.filter(Boolean)); keepScroll(render); });
  }
  if (el.name==='quote'){ checkout.quote = el.value; renderSheet(); }
  if (el.name==='pay'){ checkout.pay = el.value; renderSheet(); }
  if (el.id==='asProg'){ as.prog = el.value; as.step=''; as.ho=''; keepScroll(render); }
  if (el.id==='asStep'){ as.step = el.value; keepScroll(render); }
  if (el.id==='asHo'){ as.ho = el.value; keepScroll(render); }
  if (el.id==='asFile'){
    const files = [...el.files].slice(0, 4-as.photos.length);
    Promise.all(files.map(f=>shrinkPhoto(f, 1280, .72))).then(list=>{ as.photos.push(...list.filter(Boolean)); keepScroll(render); });
  }
});
async function refresh(){ try { me = await rpc('nk_me', {p_token:me.token}); await loadOrders(); } catch(e){ toast(e.message); } }
function keepScroll(fn){ const s = $('#appScroll'); const y = s?s.scrollTop:0; fn(); const n = $('#appScroll'); if (n) n.scrollTop = y; }
function refocus(id, fn){ const el = document.getElementById(id); const pos = el.selectionStart; keepScroll(fn); const n = document.getElementById(id); if (n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } }

loadCatalogData(() => { if (me && (tab==='goods' || tab==='home') && !document.activeElement?.matches?.('input,textarea')) keepScroll(render); });
boot();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
