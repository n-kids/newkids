<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>뉴키즈</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header></header>

    <section class="sub-hero" id="view-hero">
        <div class="container">
            <h1 id="page-title">로딩 중...</h1>
            <p id="page-desc"></p>
        </div>
    </section>

    <section class="container" style="padding: 50px 0;">
        <div id="page-content" class="view-content" style="min-height: 400px; max-width: 1200px; margin: 0 auto;">
            <div style="text-align:center; padding:50px; color:#999;">내용을 불러오는 중입니다...</div>
        </div>
    </section>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="manager.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const categoryCode = urlParams.get('c');

            if (!categoryCode) {
                alert("잘못된 접근입니다.");
                location.href = 'index.html';
                return;
            }

            const checkReady = setInterval(() => {
                if (window.sb) {
                    clearInterval(checkReady);
                    loadPageContent(categoryCode);
                }
            }, 100);
        });

        async function loadPageContent(code) {
            // 카테고리 정보 로드 (상단 배경이미지 등)
            const { data: catData } = await window.sb.from('program_categories').select('*').eq('code', code).single();
            if (catData) {
                if (catData.hero_image) {
                    const heroEl = document.getElementById('page-hero');
                    heroEl.style.backgroundImage = `url('${catData.hero_image}')`;
                    heroEl.style.display = 'block';

                    document.getElementById('page-hero-title').innerText = catData.hero_title || catData.name;
                    document.getElementById('page-hero-desc').innerText = catData.hero_desc || '';

                    if (catData.hero_overlay_color) {
                        const opacity = catData.hero_overlay_opacity !== undefined ? catData.hero_overlay_opacity : 0.8;
                        const rgb = hexToRgb(catData.hero_overlay_color);
                        if (rgb) {
                            heroEl.style.boxShadow = `inset 0 0 0 2000px rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${opacity})`;
                        }
                    }
                    if (catData.hero_title_color) document.getElementById('page-hero-title').style.color = catData.hero_title_color;
                    if (catData.hero_desc_color) document.getElementById('page-hero-desc').style.color = catData.hero_desc_color;
                }
                document.getElementById('page-title').innerText = catData.name;
                document.title = "뉴키즈 - " + catData.name;
            }

            // 본문 내용 로드
            const { data, error } = await window.sb.from('total_posts').select('*').eq('category', code).order('created_at', { ascending: true }).limit(1).single();

            if (error || !data) {
                document.getElementById('page-content').innerHTML = "<div style='text-align:center; padding:100px 20px; color:#999; font-size:1.1rem;'>아직 등록된 페이지 내용이 없습니다.</div>";
            } else {
                // ★ 본문 내용에서 [투표:ID숫자]를 찾아 스크롤바 없는 iframe으로 화면에 매립
                let finalContent = data.content || '';
                finalContent = finalContent.replace(/\[투표:(\d+)\]/g, '<iframe id="form-iframe-$1" src="form.html?id=$1" width="100%" frameborder="0" scrolling="no" style="border:1px solid #ddd; border-radius:12px; margin:30px 0; overflow:hidden; transition:height 0.3s ease;"></iframe>');

                document.getElementById('page-content').innerHTML = finalContent;
            }
        }

        // HEX 색상 변환 헬퍼 함수
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        // ★ form.html에서 보낸 폼 높이 데이터를 받아 iframe의 세로 길이를 쫙 늘려줌
        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'resizeIframe') {
                const iframe = document.getElementById('form-iframe-' + event.data.formId);
                if (iframe) {
                    iframe.style.height = (event.data.height + 20) + 'px';
                }
            }
        });
    </script>
</body>
</html>
