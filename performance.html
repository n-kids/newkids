<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴키즈 - 부모 참여 행사</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header></header>

    <section class="sub-hero bg-performance">
        <div class="container">
            <h1>부모 참여 행사</h1>
            <p>아이들의 잠재된 창의력과 감성을 깨워주는 특별한 시간</p>
        </div>
    </section>

    <section style="background-color: var(--bg-light);">
        <div class="container">
            <h2 style="text-align: left; margin-bottom: 30px;">📸 활동 갤러리</h2>
            <div id="post-list" class="gallery-grid">
                <div style="text-align:center; width:100%; grid-column: 1/-1; padding:50px;">로딩 중...</div>
            </div>
        </div>
    </section>

    <section style="text-align: center; background-color: var(--primary-color); color: #fff;">
        <div class="container">
            <h2 style="color: #fff;">부모님도 아이들도 만족하는 참여 수업!</h2>
            <p style="margin-bottom: 20px;">원장님께 딱 맞는 행사 프로그램을 제안해 드립니다.</p>
            <a href="proposal.html" class="btn" style="background: #fff; color: var(--primary-color);">📋 견적 및 상담 신청</a>
        </div>
    </section>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="manager.js"></script>

    <script>
        const CATEGORY_NAME = 'performance'; // 카테고리 설정

        document.addEventListener("DOMContentLoaded", function () {
            // manager.js에서 sb(Supabase Client)가 초기화될 때까지 대기
            const checkSb = setInterval(() => {
                if (window.sb) {
                    clearInterval(checkSb);
                    loadPosts(window.sb);
                }
            }, 100);
        });

        async function loadPosts(sb) {
            // 해당 카테고리의 게시글 가져오기 (순서: 지정된 번호순 -> 최신순)
            const { data } = await sb.from('total_posts')
                .select('*')
                .eq('category', CATEGORY_NAME)
                .eq('is_visible', true
                .order('order_num', { ascending: true })
                .order('created_at', { ascending: false });

            const list = document.getElementById('post-list');
            list.innerHTML = "";

            if (!data || data.length === 0) {
                listContainer.innerHTML = `
                <div style="text-align:center; padding: 80px 20px; color:#888; background-color:#f9f9f9; border-radius:12px; grid-column: 1 / -1; width: 100%;">
                <div style="font-size: 3rem; margin-bottom: 15px;">📭</div>
                <h3 style="color:#555; margin-bottom: 10px;">현재 준비 중인 프로그램입니다.</h3>
                <p style="font-size: 1rem;">새로운 콘텐츠가 곧 업데이트될 예정입니다. 조금만 기다려주세요!</p>
                </div>
                `;
                return;
            }
            data.forEach(item => {
                // 1. 대표 이미지 처리
                let displayImg = item.thumbnail_url;
                if (!displayImg) {
                    try {
                        const parsed = JSON.parse(item.image_url);
                        if (Array.isArray(parsed) && parsed.length > 0) displayImg = parsed[0];
                        else displayImg = item.image_url;
                    } catch (e) {
                        displayImg = item.image_url;
                    }
                }

                // 2. 유튜브 썸네일 처리 (manager.js의 유틸리티 사용)
                const yId = window.getYoutubeId(displayImg);
                let isVideo = !!yId;
                if (yId) {
                    displayImg = `https://img.youtube.com/vi/${yId}/hqdefault.jpg`;
                } else if (!displayImg) {
                    displayImg = 'https://via.placeholder.com/400x300?text=No+Image';
                }

                // 3. 카드 생성
                const linkIcon = item.link_url ? `<div class="link-icon">🔗</div>` : '';
                const div = document.createElement('div');
                div.className = 'card';
                div.onclick = () => {
                    if (item.link_url && item.link_url.trim() !== "") {
                        let url = item.link_url;
                        if (!url.startsWith('http')) url = 'https://' + url;
                        window.open(url, '_blank');
                    } else {
                        location.href = `view.html?id=${item.id}`;
                    }
                };

                div.innerHTML = `
                        ${linkIcon}
                        <div class="card-img-wrap">
                            <img src="${displayImg}" class="card-img" onerror="this.src='https://via.placeholder.com/400x300?text=Error'">
                            <div style="display:${isVideo ? 'block' : 'none'}; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:white; font-size:3rem; text-shadow:0 0 10px rgba(0,0,0,0.5);">▶</div>
                        </div>
                        <div class="card-body">
                            <div class="card-title">${item.title}</div>
                            <div class="card-text">${item.content}</div>
                        </div>`;
                list.appendChild(div);
            });
        }
    </script>
</body>
</html>
