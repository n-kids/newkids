<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뉴키즈 주문관리</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo-n.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
/* 레이아웃: 메인 컴퓨터용. 위 요약 숫자 → 탭(할 일 / 업체별 발주 / 원별 / 가입한 원) → 목록 */
body{padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.top .brandmark{display:flex;align-items:center;gap:10px}
.top img{width:38px;height:38px;border-radius:10px}
.top h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.top .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.login{max-width:380px;margin:60px auto;display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
.stat small{color:var(--muted);font-size:12px}
.stat b{display:block;font-size:24px}
.stat.hot{border-color:var(--warn);background:var(--warn-soft)}
.stat.hot b{color:var(--warn)}
.nav{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px}
.nav button{border:0;background:none;padding:8px 14px;border-radius:10px;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
.nav button[aria-current="page"]{background:var(--brand);color:#fff}
.nav .n{min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;line-height:18px;padding:0 5px;text-align:center}
.box{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.box h3{margin:0;padding:11px 14px;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);background:var(--sunk)}
.box h3 small{font-weight:400;color:var(--muted);font-size:12px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .t{border:0;background:none;text-align:left;padding:0;min-width:0}
.item .t b{display:block;font-size:14px}
.item .t small{color:var(--muted);font-size:12px;display:block}
.item .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.kind{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap}
.kind.book{background:var(--ok-soft);color:var(--ok)}
.kind.goods{background:var(--soft);color:var(--ink)}
.kind.as,.kind.return{background:var(--info-soft);color:var(--info)}
.kind.ask,.kind.event{background:var(--warn-soft);color:var(--warn)}
.kind.doc{background:var(--warn-soft);color:var(--warn)}
.detail{grid-column:1/-1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}
.vend{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;border-top:1px solid var(--line)}
.vend:first-of-type{border-top:0}
.vend b{font-size:15px}
.vend ul{margin:6px 0 0;padding:0 0 0 16px;font-size:12.5px;color:var(--muted)}
.reco{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:10px 12px}
.reco b{color:var(--ink)}
.as-ph{display:flex;gap:8px;flex-wrap:wrap}
.as-ph img{width:140px;height:105px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.log{font-size:12px;color:var(--muted);margin:0;padding:0 0 0 16px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.gform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px}
.gform .wide{grid-column:1/-1}
.gform .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kind.gather{background:var(--ok-soft);color:var(--ok)}
.kind.off{background:var(--sunk);color:var(--muted)}
@media (max-width:760px){.gform{grid-template-columns:minmax(0,1fr)}}
.toast{bottom:24px}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .item{grid-template-columns:minmax(0,1fr)}
  .item .a{justify-content:flex-start}
}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="spinner">불러오는 중…</div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
let session = null, isAdmin = false;
let members = [], orders = [];
let tab = 'todo', openId = null, kgFilter = '전체';
let photoCache = {};
let gatherings = [], gCounts = {}, gEdit = null, gOpen = null, gSignups = {};   // 원장님 행사 (참가 신청)
let seen = new Set(); let firstLoad = true; let fresh = new Set();
const memberOf = o => members.find(m => m.id === o.member_id) || {kg:'(알 수 없음)', region:''};
const vendorsOf = o => [...new Set((o.lines || []).map(l => l.vendor))];

async function boot(){
  const { data } = await sb.auth.getSession(); session = data.session;
  if (session){ isAdmin = await rpc('nk_is_admin', {}).catch(() => false); if (isAdmin) await load(); }
  render();
}
async function load(){
  const baseCols = 'id,member_id,kind,month,lines,quote_want,quote_email,quote_sent,pay,stmt_want,stmt_email,stmt_at,stmt_sent,state,done,as_info,memo,log,sheet_synced_at,sheet_note,created_at';
  const extCols = baseCols + ',ec_synced_at,ec_delivered_at,ec_delivered_by';
  const [m, oTry] = await Promise.all([
    sb.rpc('nk_admin_members'),   // 전화번호는 암호화돼 있어 관리자 전용 함수로 풀어서 받음
    sb.from('nk_orders').select(extCols).order('created_at', {ascending:false}).limit(500),
  ]);
  let o = oTry;
  if (o.error && /column|ec_delivered|ec_synced/i.test(o.error.message || '')) {
    o = await sb.from('nk_orders').select(baseCols).order('created_at', {ascending:false}).limit(500);
  }
  if (m.error || o.error){ toast((m.error || o.error).message); return; }
  members = m.data; orders = o.data;
  await loadGatherings();
  orders.forEach(x => { if (!seen.has(x.id)){ if (!firstLoad) fresh.add(x.id); seen.add(x.id); } });
  firstLoad = false;
  const n = orders.filter(x => x.state === 0).length + members.filter(x => x.status === 'pending').length;
  document.title = (n ? `(${n}) ` : '') + '뉴키즈 주문관리';
}
// 원장님 행사: 행사 목록과 신청 수 (명단은 연락처를 풀어야 해서 열 때 따로 받음)
async function loadGatherings(){
  const [g, s] = await Promise.all([
    sb.from('nk_gatherings').select('*').order('created_at', {ascending:false}),
    sb.from('nk_gathering_signups').select('gathering_id,people'),
  ]);
  if (g.error || s.error) return;   // 표가 아직 없으면 탭만 비어 보임
  gatherings = g.data; gCounts = {};
  s.data.forEach(x => { const c = gCounts[x.gathering_id] || (gCounts[x.gathering_id] = {kg:0, people:0}); c.kg++; c.people += x.people; });
  if (gOpen) await loadSignups(gOpen);
}
async function loadSignups(id){ const r = await sb.rpc('nk_admin_gathering_signups', {p_id:id}); if (!r.error) gSignups[id] = r.data; }

function render(){
  const root = $('#root');
  if (!session) { root.innerHTML = loginView(); return; }
  if (!isAdmin) { root.innerHTML = `<div class="login card"><p class="h2">관리자 등록이 필요해요</p>
    <p class="sub">${esc(session.user.email)} 계정은 아직 주문관리 관리자로 등록되지 않았어요. Supabase의 nk_admins 표에 이 이메일을 넣어주세요.</p>
    <button class="btn line" id="logout">로그아웃</button></div>`; return; }
  const need = orders.filter(o => o.state === 0);
  const quotes = orders.filter(o => o.quote_want && !o.quote_sent);
  const stmts = orders.filter(o => o.stmt_want && !o.stmt_sent);
  const asOpen = orders.filter(o => (o.kind === 'as' || o.kind === 'return') && o.state > 0 && !isDone(o));
  const asks = orders.filter(o => (o.kind === 'ask' || o.kind === 'event') && o.state === 1);
  const ship = orders.filter(o => isOrder(o) && o.state === 2);
  const sheet = orders.filter(o => o.kind === 'book' && o.state >= 1 && !o.sheet_synced_at);
  const sheetNotes = orders.filter(o => o.kind === 'book' && o.sheet_synced_at && o.sheet_note && o.state < 3);
  const vq = vendorQueue();
  const pending = members.filter(m => m.status === 'pending');
  const todo = need.length + asks.length + quotes.length + stmts.length + asOpen.length + ship.length;
  root.innerHTML = `
    <div class="top">
      <span class="brandmark"><img src="logo-n.png" alt=""><h1>뉴키즈 주문관리</h1></span>
      <span class="right"><span class="hint">${esc(session.user.email)}</span><button class="btn line small" id="reload">새로 고침</button><button class="btn line small" id="csv">주문 내려받기</button><button class="btn line small" id="logout">로그아웃</button></span>
    </div>
    <div class="stats">
      <div class="stat ${need.length?'hot':''}"><small>새 주문·요청</small><b class="num">${need.length}</b></div>
      <div class="stat"><small>업체 발주 대기</small><b class="num">${vq.length}</b></div>
      <div class="stat"><small>견적서 요청</small><b class="num">${quotes.length}</b></div>
      <div class="stat"><small>거래명세서 요청</small><b class="num">${stmts.length}</b></div>
      <div class="stat ${pending.length?'hot':''}"><small>가입 승인 대기</small><b class="num">${pending.length}</b></div>
    </div>
    <nav class="nav">${[['todo','할 일',todo],['vendor','업체별 발주',vq.length],['kg','원별 보기',0],['members','가입한 원',pending.length],['gather','원장님 행사',0]].map(([k,l,n]) =>
      `<button data-tab="${k}" ${tab===k?'aria-current="page"':''}>${l}${n?`<span class="n num">${n}</span>`:''}</button>`).join('')}</nav>
    ${({todo:() => todoView(need, quotes, stmts, asOpen, asks, ship, sheet, sheetNotes), vendor:() => vendorView(vq), kg:kgView, members:membersView, gather:gatherView})[tab]()}`;
}

function loginView(){
  return `<div class="login card"><p class="h2">뉴키즈 주문관리</p><p class="sub">홈페이지 관리자 계정으로 로그인하세요.</p>
    <div class="field"><label for="lEmail">이메일</label><input id="lEmail" type="email" autocomplete="username"></div>
    <div class="field"><label for="lPw">비밀번호</label><input id="lPw" type="password" autocomplete="current-password"></div>
    <button class="btn block" id="login">로그인</button></div>`;
}

const kindTag = o => `<span class="kind ${o.kind}">${KIND_NAME[o.kind]}</span>`;
function itemHead(o){
  const m = memberOf(o);
  return `<button class="t" data-open="${o.id}"><b>${esc(m.kg)} · ${esc(orderTitle(o))} ${fresh.has(o.id)?'<span class="tag warn">NEW</span>':''}</b>
    <small class="num">#${o.id} · ${fmtDate(o.created_at)} · ${esc(m.region)} · ${esc(orderSummary(o))}</small></button>`;
}
function todoView(need, quotes, stmts, asOpen, asks, ship, sheet, sheetNotes){
  const box = (t, sub, items) => `<div class="box"><h3>${t}<small>${sub}</small></h3>${items || '<div class="empty">없음</div>'}</div>`;
  return `
    ${box('새로 들어온 주문·요청', '확인을 누르면 업체별 발주로 넘어가고, 교재는 메인 컴퓨터가 납품시트에 넣어요. 문의·반품은 확인 후 아래에서 이어서 처리', need.map(o => `
      <div class="item">${kindTag(o)}${itemHead(o)}
        <span class="a">${o.quote_want?'<span class="tag info">견적서</span>':''}${o.pay?`<span class="tag">${esc(PAY_NAME[o.pay]||o.pay)}</span>`:''}<button class="btn small brand" data-act="confirm" data-id="${o.id}">확인</button></span>
        ${openId===o.id?`<div class="detail">${detail(o)}</div>`:''}</div>`).join(''))}
    ${box('납품시트 반영', '메인 컴퓨터가 15분마다 넣어요. 문제가 있으면 여기에 남아요', [...sheet, ...sheetNotes].map(o => `
      <div class="item">${kindTag(o)}${itemHead(o)}
        <span class="a">${o.sheet_synced_at?'<span class="tag ok">반영됨 · 확인할 점</span>':o.sheet_note?'<span class="tag warn">확인 필요</span>':'<span class="tag">반영 대기</span>'}</span>
        ${o.sheet_note?`<div class="detail" style="grid-column:1/-1"><span>${esc(o.sheet_note)}</span>${/시트 원 이름/.test(o.sheet_note)?'<span class="hint">"가입한 원" 탭에서 이 원의 시트 원 이름을 적으면 다음 반영 때 들어가요.</span>':''}</div>`:''}
        ${openId===o.id?`<div class="detail">${detail(o)}</div>`:''}</div>`).join(''))}
    ${box('견적서 요청', '견적서를 만들어 메일로 보낸 뒤 눌러주세요', quotes.map(o => `
      <div class="item"><span class="kind doc">견적서</span><span class="t"><b>${esc(memberOf(o).kg)} · ${esc(orderTitle(o))}</b><small>${esc(o.quote_email)}</small></span>
        <span class="a"><button class="btn small sun" data-act="quote" data-id="${o.id}">보냈어요</button></span></div>`).join(''))}
    ${box('거래명세서 요청', '거래명세서를 메일로 보낸 뒤 눌러주세요', stmts.map(o => `
      <div class="item"><span class="kind doc">명세서</span><span class="t"><b>${esc(memberOf(o).kg)} · ${esc(orderTitle(o))}</b><small>${esc(o.stmt_email)} · 요청 ${o.stmt_at?fmtDate(o.stmt_at):''}</small></span>
        <span class="a"><button class="btn small sun" data-act="stmt" data-id="${o.id}">보냈어요</button></span></div>`).join(''))}
    ${box('문의 답변', '원에 전화나 메일로 답한 뒤 눌러주세요 (원 어플에 완료로 보여요)', asks.map(o => `
      <div class="item">${kindTag(o)}${itemHead(o)}
        <span class="a"><button class="btn small sun" data-act="answered" data-id="${o.id}">${o.kind==='event'?'안내 완료':'답변 완료'}</button></span>
        ${openId===o.id?`<div class="detail">${detail(o)}</div>`:''}</div>`).join(''))}
    ${box('A/S·반품 진행 중', '업체별 방식(사이트·카톡·전화)으로 접수', asOpen.map(o => `
      <div class="item">${kindTag(o)}${itemHead(o)}
        <span class="a">${o.state===1?`<button class="btn small sun" data-act="asVendor" data-id="${o.id}">${esc(o.as_info?.vendor||'업체')} 접수했어요</button>`:`<button class="btn small" data-act="asDone" data-id="${o.id}">처리 완료</button>`}</span>
        ${openId===o.id?`<div class="detail">${detail(o)}</div>`:''}</div>`).join(''))}
    ${box('배송 알림 보낼 주문', '업체 발주가 모두 끝난 주문', ship.map(o => `
      <div class="item">${kindTag(o)}${itemHead(o)}
        <span class="a"><button class="btn small" data-act="ship" data-id="${o.id}">배송 출발</button></span>
        ${openId===o.id?`<div class="detail">${detail(o)}</div>`:''}</div>`).join(''))}`;
}
function detail(o){
  const m = memberOf(o);
  let h = `<span class="hint">${esc(m.kg)} · ${esc(m.name)} · ${esc(fmtPhone(m.phone))} · ${esc(m.region)}${m.email?' · '+esc(m.email):''}</span>`;
  if (o.kind === 'book') h += `<div class="tbl-wrap"><table><thead><tr><th>교재</th><th>업체</th>${AGES.map(a => `<th class="r">${a.replace('만','')}</th>`).join('')}<th>단계</th><th class="r">합계</th></tr></thead><tbody>
    ${o.lines.map(l => `<tr><td>${esc(l.name)}</td><td>${esc(l.vendor)}</td>${(l.q||[0,0,0,0,0,0]).map(x => `<td class="r num">${+x||'·'}</td>`).join('')}<td>${esc(lineSummary({st:l.st})) || '·'}</td><td class="r num"><b>${lineTotal(l)}</b></td></tr>`).join('')}</tbody></table></div>`;
  else if (o.kind === 'goods') h += `<div class="tbl-wrap"><table><thead><tr><th>품목</th><th>업체</th><th class="r">수량</th><th class="r">금액</th></tr></thead><tbody>
    ${o.lines.map(l => `<tr><td>${esc(l.name)}</td><td>${esc(l.vendor)}</td><td class="r num">${+l.qty||0}</td><td class="r num">${l.price?won(l.price*l.qty):'확인 필요'}</td></tr>`).join('')}</tbody></table></div>
    <span class="hint">결제: ${PAY_NAME[o.pay]||'-'}</span>`;
  if (isOrder(o) && o.memo) h += `<div class="reco"><b>주문 메모</b> · ${esc(o.memo)}</div>`;
  const a = o.as_info || {};
  if (o.kind === 'ask') h += `${a.topic?`<span class="tag">${esc(a.topic)}</span>`:''}<span>${esc(o.memo||'(내용 없음)')}</span>`;
  if (o.kind === 'event') h += `<span><b>${esc(a.name||'행사')}</b>${a.group?' ('+esc(a.group)+')':''}${a.date?' · 희망 날짜 '+esc(a.date):''}</span><span>연락받을 번호: <b class="num">${esc(fmtPhone(a.phone||''))}</b></span>${o.memo?`<span>${esc(o.memo)}</span>`:''}`;
  if (o.kind === 'return') h += `<span><b>교재 반품</b> · ${esc(a.item||'')}${a.ho?' '+esc(a.ho):''}${a.qty?' · '+esc(a.qty)+'개':''}${a.vendor?' · '+esc(a.vendor):''} · 사유: ${esc(a.reason||'')}</span>${o.memo?`<span>${esc(o.memo)}</span>`:''}`;
  const pics = (photoCache[o.id]||[]).map((s,i) => `<a href="${s}" target="_blank" rel="noopener"><img src="${s}" alt="사진 ${i+1}"></a>`).join('');
  if (o.kind === 'as') h += `<span>${esc(o.memo||'(내용 없음)')}</span><div class="as-ph">${pics || '<span class="hint">사진 불러오는 중…</span>'}</div>`;
  if (o.kind === 'return' && pics) h += `<div class="as-ph">${pics}</div>`;
  if (o.kind === 'book') {
    const delivLog = !o.ec_delivered_at && Array.isArray(o.log) ? [...o.log].reverse().find(l => /직납 완료(?! 취소)/.test(l.t || '')) : null;
    const delivAt = o.ec_delivered_at || (delivLog && delivLog.at) || null;
    h += `<span class="hint">납품시트: ${o.sheet_synced_at ? '반영됨 ' + fmtDate(o.sheet_synced_at) : o.state >= 1 ? '반영 대기' : '확인을 누르면 반영돼요'}${o.sheet_note ? ' · ' + esc(o.sheet_note) : ''}</span>`;
    if (delivAt) h += `<span class="hint"><span class="tag ok">직납 완료</span> ${fmtDate(delivAt)}${o.ec_delivered_by ? ' · 담당 ' + esc(o.ec_delivered_by) : ''}</span>`;
    else if (o.ec_synced_at) h += `<span class="hint">납품앱: 반영됨 ${fmtDate(o.ec_synced_at)} · 직납 대기</span>`;
  }
  h += `<ul class="log">${(o.log||[]).map(l => `<li class="num">${fmtDate(l.at)} ${esc(l.t)}</li>`).join('')}</ul>`;
  return h;
}
function vendorQueue(){
  const m = {};
  orders.filter(o => isOrder(o) && o.state === 1).forEach(o => (o.lines || []).forEach(l => {
    if ((o.done || {})[l.vendor]) return;
    const v = m[l.vendor] || (m[l.vendor] = {vendor:l.vendor, rows:[], ids:new Set()});
    v.ids.add(o.id); v.rows.push({kg:memberOf(o).kg, region:memberOf(o).region, name:l.name, n:l.q||l.st ? lineTotal(l) : l.qty, sum:l.q||l.st ? lineSummary(l) : '', memo:o.memo||'', month:o.month});
  }));
  return Object.values(m).sort((a,b) => a.vendor.localeCompare(b.vendor, 'ko'));
}

async function updateOrder(o, patch, logText){
  const log = [...(o.log || []), {at:new Date().toISOString(), t:logText}];
  const { error } = await sb.from('nk_orders').update({...patch, log, updated_at:new Date().toISOString()}).eq('id', o.id);
  if (error) throw error;
  Object.assign(o, patch, {log});
}

document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  const d = t.dataset;
  try {
    if (t.id === 'login'){
      const { data, error } = await sb.auth.signInWithPassword({ email:$('#lEmail').value.trim(), password:$('#lPw').value });
      if (error) { toast('이메일이나 비밀번호가 맞지 않아요.'); return; }
      session = data.session; isAdmin = await rpc('nk_is_admin', {}).catch(() => false); if (isAdmin) await load(); render(); return;
    }
    if (t.id === 'logout'){ await sb.auth.signOut(); session = null; isAdmin = false; render(); return; }
    if (t.id === 'reload'){ await load(); render(); toast('최신 상태로 바꿨어요.'); return; }
    if (t.id === 'csv'){ downloadCsv(); return; }
    if (d.tab){ tab = d.tab; render(); return; }
    if (d.region){ kgFilter = d.region; render(); return; }
    if (d.open){
      const id = +d.open; openId = openId === id ? null : id; fresh.delete(id); render();
      const o = orders.find(x => x.id === id);
      if (openId && (o.kind === 'as' || o.kind === 'return') && !photoCache[id]){
        const { data } = await sb.from('nk_orders').select('photos').eq('id', id).single();
        // 사진은 data:image 만 그림 (원이 보낸 값이라 다른 글자가 섞이면 화면에 코드가 들어갈 수 있음)
        photoCache[id] = ((data && data.photos) || []).filter(s => typeof s === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s)); render();
      }
      return;
    }
    if (d.member){
      const { error } = await sb.from('nk_members').update({status:d.status, approved_at:d.status==='approved'?new Date().toISOString():null}).eq('id', d.member);
      if (error) throw error;
      members.find(m => m.id === d.member).status = d.status; render(); toast(d.status === 'approved' ? '승인했어요. 이제 주문할 수 있어요.' : '거절했어요.'); return;
    }
    if (d.sheetname){
      const v = $(`#sn-${d.sheetname}`).value.trim() || null;
      const { error } = await sb.from('nk_members').update({sheet_name:v}).eq('id', d.sheetname);
      if (error) throw error;
      members.find(m => m.id === d.sheetname).sheet_name = v;
      // 이 원의 막혀 있던 주문은 다음 반영 때 다시 시도
      toast(v ? `납품시트 원 이름을 '${v}'(으)로 저장했어요.` : '시트 원 이름을 지웠어요.'); return;
    }
    if (d.copy){
      const v = vendorQueue().find(x => x.vendor === d.copy);
      const text = `[${v.vendor} 발주]\n` + v.rows.map(r => `${r.kg}(${r.region}) ${r.name}${r.month?' '+r.month:''} ${r.sum||r.n+'개'}${r.memo?' (메모: '+r.memo+')':''}`).join('\n');
      try { await navigator.clipboard.writeText(text); toast('복사했어요.'); } catch(_) { prompt('아래 내용을 복사하세요', text); }
      return;
    }
    // 원장님 행사
    if (t.id === 'gNew'){ gEdit = {open:true}; render(); $('#gTitle')?.focus(); return; }
    if (t.id === 'gCancel'){ gEdit = null; render(); return; }
    if (d.gedit){ gEdit = {...gatherings.find(g => g.id === +d.gedit)}; render(); window.scrollTo(0, 0); return; }
    if (t.id === 'gSave'){
      const v = gatherFromForm();
      if (!v.title){ toast('행사 이름을 적어주세요.'); return; }
      const now = new Date().toISOString();
      const { error } = gEdit.id ? await sb.from('nk_gatherings').update({...v, updated_at:now}).eq('id', gEdit.id) : await sb.from('nk_gatherings').insert(v);
      if (error) throw error;
      gEdit = null; await loadGatherings(); render(); toast(v.open ? '저장했어요. 원 어플 홈에 신청 버튼이 보여요.' : '저장했어요. (앱에는 아직 안 보여요)'); return;
    }
    if (d.gtoggle){
      const g = gatherings.find(x => x.id === +d.gtoggle);
      const { error } = await sb.from('nk_gatherings').update({open:!g.open, updated_at:new Date().toISOString()}).eq('id', g.id);
      if (error) throw error;
      await loadGatherings(); render(); toast(g.open ? '앱에서 내렸어요.' : '앱에 띄웠어요. 원 어플 홈에 신청 버튼이 보여요.'); return;
    }
    if (d.gdel){
      const g = gatherings.find(x => x.id === +d.gdel); const c = gCounts[g.id];
      if (!confirm(`'${g.title}' 행사를 지울까요?${c?.kg ? `\n신청한 ${c.kg}곳의 명단도 함께 지워져요.` : ''}`)) return;
      const { error } = await sb.from('nk_gatherings').delete().eq('id', g.id);
      if (error) throw error;
      if (gOpen === g.id) gOpen = null; await loadGatherings(); render(); toast('행사를 지웠어요.'); return;
    }
    if (d.gopen){ const id = +d.gopen; gOpen = gOpen === id ? null : id; render(); if (gOpen){ await loadSignups(id); render(); } return; }
    if (d.gcopy){
      const text = signupText(gatherings.find(x => x.id === +d.gcopy));
      try { await navigator.clipboard.writeText(text); toast('명단을 복사했어요.'); } catch(_) { prompt('아래 내용을 복사하세요', text); }
      return;
    }
    if (d.gcsv){
      const g = gatherings.find(x => x.id === +d.gcsv);
      const rows = [['원','지역','참석자','연락처','인원','메모','신청'], ...(gSignups[g.id]||[]).map(r => [r.kg, r.region, r.name, fmtPhone(r.phone||''), r.people, r.memo||'', fmtDate(r.created_at)])];
      saveCsv(rows, `${g.title.replace(/[\\/:*?"<>|]/g,'')}_신청명단.csv`); return;
    }
    if (d.act){
      const o = d.id ? orders.find(x => x.id === +d.id) : null; if (o) fresh.delete(o.id);
      if (d.act === 'confirm') await updateOrder(o, {state:1}, '확인');
      if (d.act === 'quote') await updateOrder(o, {quote_sent:true}, '견적서 발송');
      if (d.act === 'stmt') await updateOrder(o, {stmt_sent:true}, '거래명세서 발송');
      if (d.act === 'asVendor') await updateOrder(o, {state:2}, `${o.as_info?.vendor||'업체'} ${o.kind==='return'?'반품':'A/S'} 접수`);
      if (d.act === 'answered') await updateOrder(o, {state:2}, o.kind==='event' ? '안내 완료' : '답변 완료');
      if (d.act === 'asDone') await updateOrder(o, {state:3}, '처리 완료');
      if (d.act === 'ship') await updateOrder(o, {state:3}, '배송 출발');
      if (d.act === 'vendor'){
        for (const x of orders.filter(x => isOrder(x) && x.state === 1 && vendorsOf(x).includes(d.v) && !(x.done||{})[d.v])){
          const done = {...(x.done||{}), [d.v]:true};
          const all = vendorsOf(x).every(v => done[v]);
          await updateOrder(x, all ? {done, state:2} : {done}, `${d.v} 발주`);
        }
        toast(`${d.v} 발주 완료로 표시했어요.`);
      }
      render(); return;
    }
  } catch(err){ toast(err.message || '저장하지 못했어요. 다시 시도해 주세요.'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'lPw' || e.target.id === 'lEmail')) $('#login')?.click(); });

function downloadCsv(){
  const rows = [['주문번호','접수','원','지역','담당','연락처','구분','호수','업체','품목','만0','만1','만2','만3','만4','만5','단계','수량','금액','결제','견적서','상태','메모']];
  orders.forEach(o => { const m = memberOf(o);
    const base = [o.id, fmtDate(o.created_at), m.kg, m.region, m.name||'', fmtPhone(m.phone||''), KIND_NAME[o.kind], o.month||''];
    if (!isOrder(o)){ const a = o.as_info||{};
      const what = o.kind==='as' ? `${a.prog} ${a.step} ${a.ho}${a.week && a.week!=='없음'?' '+a.week:''}` : o.kind==='ask' ? (a.topic||'') : o.kind==='event' ? [a.name, a.date, fmtPhone(a.phone||'')].filter(Boolean).join(' ') : `${a.item||''} ${a.ho||''} ${a.reason||''}`.trim();
      rows.push([...base, a.vendor||'', what, '','','','','','', '', o.kind==='return'?a.qty||'':'', '', '', '', STATES[o.kind][o.state], o.memo||'']); return; }
    (o.lines||[]).forEach(l => rows.push([...base, l.vendor, l.name, ...(l.q||['','','','','','']), lineSummary({st:l.st}), l.q||l.st?lineTotal(l):l.qty, l.price?l.price*l.qty:'', PAY_NAME[o.pay]||'', o.quote_want?'요청':'', STATES[o.kind][o.state], o.memo||'']));
  });
  const d = new Date(); saveCsv(rows, `뉴키즈주문_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.csv`);
}
// 엑셀에서 바로 열리는 CSV (첫 글자가 = + - @ 이면 수식으로 읽히지 않게 ' 를 붙임)
function saveCsv(rows, name){
  const cell = v => { let s = String(v ?? ''); if (/^[=+\-@]/.test(s)) s = "'" + s; return `"${s.replace(/"/g,'""')}"`; };
  const csv = '﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = name; a.click();
}

// 1분마다 새 주문 확인
setInterval(async () => { if (isAdmin && !openId && !gEdit){ await load(); render(); } }, 60000);
boot();
</script>
