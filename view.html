<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴키즈 - 상세 보기</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f4f7fa !important;
            margin: 0;
            padding: 0;
        }

        .view-box-wrapper {
            width: 100% !important;
            max-width: 900px !important;
            margin: 100px auto 50px !important;
            padding: 0 20px !important;
            box-sizing: border-box !important;
            display: block !important;
        }

        .view-box-custom {
            width: 100% !important;
            background: #fff !important;
            padding: 50px 40px !important;
            border-radius: 12px !important;
            border: 1px solid #eaeaea !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03) !important;
            box-sizing: border-box !important;
            display: block !important;
        }

        .view-header {
            border-bottom: 2px solid #1a3c6e;
            padding-bottom: 20px;
            margin-bottom: 30px;
            text-align: center;
            width: 100%;
            display: block;
        }

        .view-title {
            font-size: 2.2rem;
            color: #1a3c6e;
            margin-bottom: 15px;
            font-weight: 800;
            word-break: keep-all;
        }

        .view-meta {
            color: #666;
            font-size: 0.95rem;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .view-content {
            line-height: 1.8;
            color: #333;
            font-size: 1.1rem;
            min-height: 300px;
            word-break: break-all;
            width: 100%;
            display: block;
        }

            .view-content img {
                max-width: 100%;
                height: auto;
                border-radius: 8px;
                margin: 15px 0;
            }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            color: #333;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

            .form-input:focus {
                outline: none;
                border-color: #1a3c6e;
            }

        @media screen and (max-width: 768px) {
            .view-box-wrapper {
                margin: 100px auto 20px !important;
                padding: 0 15px !important;
            }

            .view-box-custom {
                padding: 30px 20px !important;
            }

            .view-title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <header></header>

    <div class="view-box-wrapper">
        <div class="view-box-custom">

            <!-- 수정/삭제/비밀글 열람용 비밀번호 폼 -->
            <div id="secret-lock-box" style="display:none; text-align:center; padding: 50px 20px;">
                <h3 style="color:#1a3c6e; margin-bottom:15px;" id="lock-box-title">🔒 비밀글입니다</h3>
                <p style="color:#666; margin-bottom:20px;" id="lock-box-desc">작성 시 설정한 비밀번호를 입력해주세요.</p>
                <div style="display:flex; justify-content:center; gap:10px; max-width:400px; width:100%; margin: 0 auto;">
                    <input type="password" id="secret-pw-input" class="form-input" placeholder="비밀번호 입력" onkeypress="if(event.keyCode==13) verifySecretPassword();" style="flex:1;">
                    <button onclick="verifySecretPassword()" class="btn-action" style="white-space:nowrap;">확인</button>
                    <button id="btn-cancel-lock" class="btn-action" style="background:#666; white-space:nowrap; display:none;">취소</button>
                </div>
            </div>

            <div id="main-content-wrap" style="display:none; width: 100%;">

                <div class="view-header">
                    <h2 class="view-title" id="v-title">불러오는 중...</h2>
                    <div class="view-meta">
                        <span id="v-author">작성자: -</span>
                        <span id="v-date">작성일: -</span>
                        <span id="v-download-count" style="color:#f4a261; font-weight:bold;">📥 0회</span>
                    </div>
                </div>

                <div class="view-content" id="v-content"></div>

                <div id="download-files-area" style="margin-top: 40px; padding-top: 20px; border-top: 1px dashed #eee; display: none;">
                    <h4 style="color: #1a3c6e; margin-bottom: 15px;">📎 첨부파일</h4>
                    <div id="download-list-container" style="display: flex; flex-direction: column; gap: 10px;"></div>
                </div>

                <div id="admin-reply-area" style="display:none; margin-top: 40px; padding: 25px; background: #f0f7ff; border-radius: 12px; border: 1px solid #cce5ff;">
                    <h4 style="color: #1a3c6e; margin-bottom: 15px; font-size:1.1rem; display:flex; align-items:center; gap:8px;">
                        <span>💬</span> 관리자 답변
                    </h4>

                    <div id="admin-reply-content" style="line-height: 1.6; color: #333; font-size: 0.95rem;"></div>

                    <div id="admin-reply-form" style="display:none; margin-top: 20px; border-top: 1px dashed #b8daff; padding-top: 20px;">
                        <textarea id="new-reply-input" class="form-input" style="height:80px; resize:vertical; margin-bottom:10px; width:100%; padding:10px; border-radius:6px; border:1px solid #ccc; box-sizing:border-box;" placeholder="관리자 답변을 입력하세요..."></textarea>
                        <div style="text-align:right;">
                            <button onclick="submitAdminReply()" class="btn-action" style="background:#1a3c6e; padding:8px 25px; font-size:0.95rem; border:none; color:white; border-radius:6px; cursor:pointer;">답변 등록</button>
                        </div>
                    </div>
                </div>

                <div id="author-actions-area" style="display:none; margin-top:40px; padding-top:20px; border-top:1px solid #1a3c6e; justify-content:flex-end; gap:10px;">
                    <button onclick="openEditPost()" class="btn-action" style="background:#f4a261; padding:10px 25px; font-size:0.95rem;">수정</button>
                    <button onclick="deleteCurrentPost()" class="btn-action" style="background:#ff6b6b; padding:10px 25px; font-size:0.95rem;">삭제</button>
                </div>
            </div>

            <div class="btn-center-wrap" style="margin-top: 40px; text-align: center;">
                <button onclick="goBackToList()" class="btn-action" style="background:#666; width: 150px;">목록으로</button>
            </div>

        </div>
    </div>

    <!-- ★ 다운로드 전용 인증 폼 ★ -->
    <div id="download-auth-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:#fff; padding:30px; border-radius:12px; width:90%; max-width:400px; text-align:center; box-shadow:0 5px 15px rgba(0,0,0,0.3);">
            <h3 style="color:#1a3c6e; margin-bottom:10px;">🔒 다운로드 권한 인증</h3>
            <p style="color:#666; font-size:0.9rem; margin-bottom:20px;">이 자료를 다운로드하려면 학원 코드(비밀번호)를 입력해주세요.</p>
            <input type="password" id="dl-pw-input" class="form-input" placeholder="비밀번호 입력" style="margin-bottom:15px;" onkeypress="if(event.keyCode==13) verifyDownloadPassword();">
            <div style="display:flex; gap:10px; justify-content:center;">
                <button onclick="verifyDownloadPassword()" class="btn-action" style="flex:1;">확인</button>
                <button onclick="closeDownloadModal()" class="btn-action" style="background:#666; flex:1;">취소</button>
            </div>
        </div>
    </div>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="manager.js"></script>
    <script>
        let currentPostId = null;
        let postDataCache = null;
        let pendingAction = null;
        let isAdminLoggedIn = false;

        let isPostPasswordVerified = false; // 글 수정/삭제 인증 플래그
        let isDlPasswordVerified = false;   // 다운로드 인증 플래그

        // 다운로드 대기용 전역 변수
        let pendingDownloadUrl = '';
        let pendingDownloadName = '';

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            currentPostId = urlParams.get('id');

            if (!currentPostId) {
                alert("잘못된 접근입니다.");
                location.href = 'index.html';
                return;
            }

            const checkReady = setInterval(async () => {
                if (window.sb) {
                    clearInterval(checkReady);
                    const { data: { session } } = await window.sb.auth.getSession();
                    isAdminLoggedIn = !!session;
                    loadPostDetail(currentPostId);
                }
            }, 100);
        });

        function getListUrl(categoryCode) {
            let targetUrl = 'notice.html';

            if (window.GLOBAL_CATEGORIES && window.GLOBAL_CATEGORIES.length > 0) {
                const catInfo = window.GLOBAL_CATEGORIES.find(c => c.code === categoryCode);
                if (catInfo) {
                    if (catInfo.type === 'EDU') {
                        targetUrl = 'child.html';
                    } else if (catInfo.type === 'EVENT') {
                        targetUrl = 'program.html';
                    }
                }
            }
            return targetUrl + '#' + categoryCode;
        }

        function goBackToList() {
            if (postDataCache && postDataCache.category) {
                location.href = getListUrl(postDataCache.category);
            } else {
                history.back();
            }
        }

        async function loadPostDetail(id) {
            const { data, error } = await window.sb.from('total_posts').select('*').eq('id', id).single();

            if (error || !data) {
                document.getElementById('v-content').innerHTML = "<div style='text-align:center; padding:50px;'>게시글을 찾을 수 없습니다.</div>";
                document.getElementById('main-content-wrap').style.display = 'block';
                return;
            }

            postDataCache = data;

            // ★ 게시글 자체 비밀번호와 다운로드 전용 비밀번호를 명확히 분리하여 캐싱
            postDataCache.actualPassword = data.password || data.video_url || '';
            postDataCache.dlPassword = data.download_password || '';

            document.getElementById('v-title').innerText = data.title;
            document.title = "뉴키즈 - " + data.title;

            const isNotice = data.category === 'notice';
            document.getElementById('v-author').innerText = "작성자: " + (isNotice ? "관리자" : (data.link_url || '익명'));
            document.getElementById('v-date').innerText = "작성일: " + new Date(data.created_at).toISOString().split('T')[0];
            document.getElementById('v-download-count').innerText = `📥 다운로드 ${data.download_count || 0}회`;

            const isSecretPost = (data.is_secret === true || String(data.is_secret) === 'true');

            // 게시글 자체가 비밀글이면 열람을 막음
            if (isSecretPost && !isAdminLoggedIn) {
                showLockBox("🔒 비밀글입니다", "이 글의 내용을 보려면 작성 시 설정한 비밀번호를 입력해주세요.", "view");
            } else {
                renderContent();
            }
        }

        // 게시글 자체 기능(수정/삭제/비밀글) 인증 모달
        function showLockBox(title, desc, action) {
            pendingAction = action;
            document.getElementById('main-content-wrap').style.display = 'none';
            document.getElementById('lock-box-title').innerText = title;
            document.getElementById('lock-box-desc').innerText = desc;
            document.getElementById('secret-pw-input').value = '';
            document.getElementById('secret-lock-box').style.display = 'block';

            const cancelBtn = document.getElementById('btn-cancel-lock');
            if (action === 'edit' || action === 'delete') {
                cancelBtn.setAttribute('onclick', 'cancelSecretBox()');
                cancelBtn.style.display = 'inline-block';
                cancelBtn.innerText = '취소';
            } else {
                cancelBtn.setAttribute('onclick', 'goBackToList()');
                cancelBtn.style.display = 'inline-block';
                cancelBtn.innerText = '이전화면';
            }
        }

        function cancelSecretBox() {
            document.getElementById('secret-lock-box').style.display = 'none';
            document.getElementById('main-content-wrap').style.display = 'block';
            pendingAction = null;
        }

        function verifySecretPassword() {
            const inputPw = document.getElementById('secret-pw-input').value.trim();
            const actualPw = postDataCache.actualPassword;

            if (!inputPw) return alert("비밀번호를 입력해주세요.");

            if (inputPw === actualPw) {
                isPostPasswordVerified = true;

                if (pendingAction === 'view') {
                    document.getElementById('secret-lock-box').style.display = 'none';
                    renderContent();
                } else if (pendingAction === 'edit') {
                    location.href = `write.html?edit=${currentPostId}#${postDataCache.category}`;
                } else if (pendingAction === 'delete') {
                    executeDeletePost();
                }
                pendingAction = null;
            } else {
                alert("비밀번호가 일치하지 않습니다.");
            }
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            switch (ext) {
                case 'pdf': return '📕';
                case 'hwp': case 'hwpx': return '🟦';
                case 'ppt': case 'pptx': return '🟧';
                case 'xls': case 'xlsx': case 'csv': return '📗';
                case 'doc': case 'docx': return '📝';
                case 'zip': case 'rar': case '7z': return '📦';
                case 'jpg': case 'jpeg': case 'png': case 'gif': return '🖼️';
                case 'mp4': case 'avi': case 'mov': return '🎬';
                case 'mp3': case 'wav': return '🎵';
                default: return '📎';
            }
        }

        function renderContent() {
            document.getElementById('secret-lock-box').style.display = 'none';
            document.getElementById('main-content-wrap').style.display = 'block';

            let finalContent = postDataCache.content || '';
            finalContent = finalContent.replace(/\[투표:(\d+)\]/g, '<iframe id="form-iframe-$1" src="form.html?id=$1" width="100%" frameborder="0" scrolling="no" style="border:1px solid #ddd; border-radius:12px; margin:30px 0; overflow:hidden; transition:height 0.3s ease;"></iframe>');

            document.getElementById('v-content').innerHTML = finalContent;

            if (postDataCache.image_url && postDataCache.image_url.trim() !== '' && postDataCache.image_url !== 'null') {
                const files = postDataCache.image_url.split('||').map(u => u.trim()).filter(u => u);
                if (files.length > 0) {
                    const downloadArea = document.getElementById('download-files-area');
                    const downloadList = document.getElementById('download-list-container');
                    let fileHtml = '';

                    // ★ 오직 '다운로드 전용 비밀번호(dlPassword)' 여부로만 잠금 상태를 평가합니다.
                    const isLocked = !isAdminLoggedIn && postDataCache.dlPassword && !isDlPasswordVerified;

                    files.forEach(item => {
                        let fileUrl = item;
                        let fileName = "다운로드 파일";

                        if (item.includes('@@')) {
                            const parts = item.split('@@');
                            fileUrl = parts[0];
                            fileName = parts[1];
                        } else {
                            let rawName = item.split('/').pop().split('?')[0];
                            try { rawName = decodeURIComponent(rawName); } catch (e) { }
                            fileName = rawName.includes('___') ? rawName.split('___').pop() : rawName;
                        }

                        const safeUrl = fileUrl.replace(/'/g, "\\'");
                        const safeName = fileName.replace(/'/g, "\\'");
                        const fileIcon = getFileIcon(fileName);

                        const btnLabel = isLocked ? '🔒 제한됨' : '다운로드';
                        const btnBg = isLocked ? 'background:#e67e22;' : 'background:#1a3c6e;';
                        const btnShadow = isLocked ? 'box-shadow: 0 2px 4px rgba(230, 126, 34, 0.2);' : 'box-shadow: 0 2px 4px rgba(26, 60, 110, 0.2);';

                        fileHtml += `
                                    <div onclick="attemptDownload('${safeUrl}', '${safeName}')" style="display:flex; justify-content:space-between; align-items:center; background:#f0f7ff; padding:15px; border-radius:10px; border:1px solid #cce5ff; cursor:pointer; transition: background 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02);">
                                        <div style="display:flex; align-items:center; gap:12px; flex: 1; min-width: 0;">
                                            <span style="font-size:1.6rem;">${fileIcon}</span>
                                            <span style="font-size:1.05rem; color:#1a3c6e; font-weight:bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${fileName}</span>
                                        </div>
                                        <span style="font-size:0.85rem; color:#fff; padding:6px 14px; border-radius:6px; margin-left:15px; white-space:nowrap; ${btnBg} ${btnShadow}">${btnLabel}</span>
                                    </div>
                                `;
                    });

                    downloadList.innerHTML = fileHtml;
                    downloadArea.style.display = 'block';
                }
            }

            const isNoticeCategory = postDataCache.category === 'notice';
            if (isNoticeCategory) {
                document.getElementById('author-actions-area').style.display = 'none';
            } else {
                document.getElementById('author-actions-area').style.display = 'flex';
            }

            loadAdminReplies();
        }

        // ★ 다운로드 시크릿 로직 (다운로드 전용 비밀번호가 있을 때만 작동)
        function attemptDownload(url, filename) {
            if (isAdminLoggedIn || !postDataCache.dlPassword || isDlPasswordVerified) {
                executeDownload(url, filename);
            } else {
                pendingDownloadUrl = url;
                pendingDownloadName = filename;
                document.getElementById('dl-pw-input').value = '';
                document.getElementById('download-auth-modal').style.display = 'flex';
                setTimeout(() => document.getElementById('dl-pw-input').focus(), 100);
            }
        }

        function closeDownloadModal() {
            document.getElementById('download-auth-modal').style.display = 'none';
            pendingDownloadUrl = '';
            pendingDownloadName = '';
        }

        function verifyDownloadPassword() {
            const inputPw = document.getElementById('dl-pw-input').value.trim();
            const actualDlPw = postDataCache.dlPassword;

            if (!inputPw) return alert("다운로드 비밀번호를 입력해주세요.");

            if (inputPw === actualDlPw) {
                isDlPasswordVerified = true;
                document.getElementById('download-auth-modal').style.display = 'none';
                renderContent();
                executeDownload(pendingDownloadUrl, pendingDownloadName);
            } else {
                alert("비밀번호가 일치하지 않습니다.");
            }
        }

        async function executeDownload(url, filename) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);

                if (postDataCache) {
                    let currentCount = postDataCache.download_count || 0;
                    currentCount += 1;
                    postDataCache.download_count = currentCount;

                    document.getElementById('v-download-count').innerText = `📥 다운로드 ${currentCount}회`;
                    window.sb.from('total_posts').update({ download_count: currentCount }).eq('id', currentPostId);
                }

            } catch (e) {
                window.open(url, '_blank');
            }
        }

        // --- 기타 기존 함수 (관리자 답변 등) ---
        async function loadAdminReplies() {
            const { data, error } = await window.sb.from('post_comments')
                .select('*')
                .eq('post_id', currentPostId)
                .order('created_at', { ascending: true });

            const replyArea = document.getElementById('admin-reply-area');
            const replyContent = document.getElementById('admin-reply-content');
            const replyForm = document.getElementById('admin-reply-form');

            if (isAdminLoggedIn) {
                replyForm.style.display = 'block';
            } else {
                replyForm.style.display = 'none';
            }

            if (data && data.length > 0) {
                let html = '';
                data.forEach((c, idx) => {
                    const dateStr = new Date(c.created_at).toLocaleString();

                    let safeContent = c.content.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
                    safeContent = safeContent.replace(/\n/g, '<br>');

                    const borderStyle = idx !== data.length - 1 ? 'border-bottom: 1px dashed #b8daff; margin-bottom: 15px; padding-bottom: 15px;' : '';
                    const deleteBtn = isAdminLoggedIn ? `<button onclick="deleteReply(${c.id})" style="background:none; border:none; color:#ff6b6b; cursor:pointer; font-size:0.8rem; font-weight:bold; float:right;">❌ 삭제</button>` : '';

                    html += `
                            <div style="${borderStyle}; padding-bottom: 10px;">
                                ${deleteBtn}
                                <div style="font-size:0.85rem; color:#666; margin-bottom:8px;">${dateStr}</div>
                                <div style="font-weight:bold; color:#1a3c6e; font-size:1.05rem;">${safeContent}</div>
                            </div>`;
                });
                replyContent.innerHTML = html;
                replyContent.style.display = 'block';
                replyArea.style.display = 'block';
            } else {
                replyContent.innerHTML = '';
                replyContent.style.display = 'none';

                if (isAdminLoggedIn) {
                    replyArea.style.display = 'block';
                } else {
                    replyArea.style.display = 'none';
                }
            }
        }

        async function submitAdminReply() {
            const content = document.getElementById('new-reply-input').value.trim();
            if (!content) return alert("답변 내용을 입력하세요.");
            if (!isAdminLoggedIn) return alert("관리자 권한이 필요합니다.");

            const { error } = await window.sb.from('post_comments').insert([{
                post_id: currentPostId,
                author: '관리자',
                password: 'admin',
                content: content
            }]);

            if (error) {
                alert("답변 등록 실패: " + error.message);
            } else {
                document.getElementById('new-reply-input').value = '';
                loadAdminReplies();
            }
        }

        async function deleteReply(replyId) {
            if (!confirm("이 답변을 삭제하시겠습니까?")) return;
            const { error } = await window.sb.from('post_comments').delete().eq('id', replyId);
            if (error) {
                alert("삭제 실패: " + error.message);
            } else {
                loadAdminReplies();
            }
        }

        async function openEditPost() {
            if (postDataCache.category === 'notice') {
                return alert("공지글은 수정할 수 없습니다.");
            }

            if (isAdminLoggedIn) {
                location.href = `write.html?edit=${currentPostId}#${postDataCache.category}`;
                return;
            }

            const isSecretPost = (postDataCache.is_secret === true || String(postDataCache.is_secret) === 'true');
            if (isSecretPost) {
                location.href = `write.html?edit=${currentPostId}#${postDataCache.category}`;
            } else {
                showLockBox("✍️ 글 수정 본인 인증", "본인 확인을 위해 글 작성 시 설정한 비밀번호를 입력해주세요.", "edit");
            }
        }

        async function deleteCurrentPost() {
            if (postDataCache.category === 'notice') {
                return alert("공지글은 삭제할 수 없습니다.");
            }

            if (isAdminLoggedIn) {
                if (confirm("정말 이 게시글을 영구 삭제하시겠습니까?")) executeDeletePost();
                return;
            }

            const isSecretPost = (postDataCache.is_secret === true || String(postDataCache.is_secret) === 'true');
            if (isSecretPost) {
                if (confirm("정말 이 게시글을 영구 삭제하시겠습니까?")) {
                    executeDeletePost();
                }
            } else {
                showLockBox("🗑️ 글 삭제 본인 인증", "본인 확인을 위해 글 작성 시 설정한 비밀번호를 입력해주세요.", "delete");
            }
        }

        async function executeDeletePost() {
            const { error } = await window.sb.from('total_posts').delete().eq('id', currentPostId);
            if (error) {
                alert("삭제 실패: " + error.message);
            } else {
                alert("게시글이 안전하게 삭제되었습니다.");
                goBackToList();
            }
        }

        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'resizeIframe') {
                let iframe = document.getElementById('form-iframe-' + event.data.formId);
                if (!iframe) {
                    const iframes = document.querySelectorAll('iframe');
                    for (let f of iframes) {
                        if (f.src && f.src.includes('id=' + event.data.formId)) {
                            iframe = f;
                            break;
                        }
                    }
                }
                if (iframe) {
                    iframe.style.height = (event.data.height + 30) + 'px';
                }
            }
        });
    </script>
</body>
</html>
