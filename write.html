<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴키즈 - 글쓰기</title>

    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <!-- 공통 스타일 시트 로드 -->
    <link rel="stylesheet" href="style.css?v=20261026">
</head>
<body>
    <header></header>

    <div class="write-container">
        <div class="write-card">
            <h2 id="page-title" class="write-title-main">✏️ 글쓰기</h2>

            <!-- 시스템 분류용 숨김 필드 -->
            <input type="hidden" id="write-category" value="">

            <div class="form-group">
                <label class="form-label">제목</label>
                <input type="text" id="write-title" class="form-input" placeholder="제목을 입력하세요">
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label class="form-label">작성자</label>
                    <input type="text" id="write-link" class="form-input" placeholder="이름">
                </div>
                <div class="form-col">
                    <label class="form-label">비밀번호</label>
                    <input type="password" id="write-password" class="form-input" placeholder="삭제 및 수정 시 필요">

                    <div class="secret-wrap">
                        <input type="checkbox" id="write-is-secret">
                        <label for="write-is-secret">비밀글로 설정 (관리자와 본인만 열람)</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">내용</label>
                <input type="file" id="hidden-image-input" accept="image/*" multiple style="display:none;">
                <div id="editor-container" style="height: 350px; border-radius: 4px; border: 1px solid #ccc; font-size:1rem;"></div>
            </div>

            <div class="form-group" style="padding-top: 15px; border-top: 1px dashed #eee;">
                <label class="form-label" style="color: #666; font-size: 0.9rem;">📎 첨부파일 (선택사항)</label>
                <input type="file" id="write-file" class="form-input" accept="*/*" multiple style="padding: 8px; font-size: 0.9rem;" onchange="handleNewFiles(this)">
                <!-- 기존 파일 및 새로 추가된 파일을 통합 관리하는 UI 영역 -->
                <div id="existing-files-list" style="margin-top:10px; display:flex; flex-direction:column; gap:8px;"></div>
            </div>

            <div class="btn-wrap">
                <button id="btn-submit" onclick="submitPost()" class="btn-submit">등록하기</button>
                <button onclick="history.back()" class="btn-cancel">취소</button>
            </div>
        </div>
    </div>

    <footer></footer>

    <!-- 로딩 오버레이 -->
    <div id="loading" class="loading-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:9999; justify-content:center; align-items:center; font-size:1.5rem; font-weight:bold; color:#1a3c6e;">
        처리 중입니다...
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://unpkg.com/quill-blot-formatter@1.0.5/dist/quill-blot-formatter.min.js"></script>
    <script src="config.js?v=20261026"></script>
    <script src="manager.js?v=20261101-rls"></script>

    <script>
        let quill;
        const ADMIN_UID = 'f17f6f28-84d7-426e-9eb1-cdac8ec015d4';
        const PUBLIC_POST_FIELDS = 'id,created_at,title,content,image_url,category,thumbnail_url,link_url,order_num,video_url,is_visible,is_secret,download_count,is_notice,publish_at,has_download_password';
        let isAdminEditor = false;
        let editId = null;
        let fileItems = []; // 통합 파일 배열 (기존 서버 파일 문자열 객체 또는 새로 선택된 File 객체)

        document.addEventListener("DOMContentLoaded", async function () {
            while (!window.sb) await new Promise(resolve => setTimeout(resolve, 50));
            const { data: { session } } = await window.sb.auth.getSession();
            isAdminEditor = session?.user?.id === ADMIN_UID;
            if (typeof Quill !== 'undefined') {
                Quill.register('modules/blotFormatter', QuillBlotFormatter.default);
                quill = new Quill('#editor-container', {
                    theme: 'snow',
                    placeholder: '내용을 자유롭게 작성해주세요.',
                    modules: {
                        blotFormatter: {},
                        toolbar: {
                            container: [[{ 'header': [1, 2, 3, false] }], ['bold', 'italic', 'underline', { 'color': [] }], [{ 'align': [] }, 'link', 'image']],
                            handlers: { image: function () { document.getElementById('hidden-image-input').click(); } }
                        }
                    }
                });

                document.getElementById('hidden-image-input').addEventListener('change', async function () {
                    if (this.files && this.files.length > 0) {
                        showLoading(true);
                        try {
                            for (let i = 0; i < this.files.length; i++) {
                                const file = this.files[i];
                                if (!file.type.startsWith('image/')) continue;
                                const ext = file.name.split('.').pop();
                                const safeKey = `user_${Date.now()}_${i}.${ext}`;
                                const { data, error } = await window.sb.storage.from('images').upload(safeKey, file);
                                if (error) throw error;
                                const publicUrl = window.sb.storage.from('images').getPublicUrl(data.path).data.publicUrl;
                                const range = quill.getSelection(true);
                                let idx = range ? range.index : quill.getLength();
                                quill.insertEmbed(idx, 'image', publicUrl);
                                quill.setSelection(idx + 1);
                            }
                        } catch (e) {
                            alert("이미지 업로드 실패: " + e.message);
                        } finally {
                            showLoading(false);
                            this.value = '';
                        }
                    }
                });
            }

            const checkReady = setInterval(async () => {
                if (window.sb && window.GLOBAL_CATEGORIES && window.GLOBAL_CATEGORIES.length > 0) {
                    clearInterval(checkReady);

                    const urlParams = new URLSearchParams(window.location.search);
                    editId = urlParams.get('edit');
                    const hashCat = location.hash.replace('#', '');

                    if (hashCat) {
                        document.getElementById('write-category').value = hashCat;
                        const catInfo = window.GLOBAL_CATEGORIES.find(c => c.code === hashCat);
                        if (catInfo) {
                            document.getElementById('page-title').innerText = `✏️ ${catInfo.name} 글쓰기`;
                        }
                    }

                    if (editId) {
                        document.getElementById('btn-submit').innerText = "수정 완료";
                        await loadEditData(editId);
                    }
                }
            }, 100);
        });

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        async function loadEditData(id) {
    showLoading(true);
    let data, error, currentEditPassword = '';
    if (isAdminEditor) {
        const result = await window.sb.from('total_posts').select(PUBLIC_POST_FIELDS).eq('id', id).single();
        data = result.data; error = result.error;
    } else {
        currentEditPassword = sessionStorage.getItem(`post-edit-password:${id}`) || '';
        sessionStorage.removeItem(`post-edit-password:${id}`);
        const result = await window.sb.functions.invoke('public-post-actions', {
            body: { action: 'load_for_edit', id: Number(id), password: currentEditPassword }
        });
        data = result.data?.post; error = result.error || (!data ? new Error('게시글 또는 비밀번호를 확인할 수 없습니다.') : null);
    }
    showLoading(false);
    if (error || !data) {
        alert("게시글 정보를 불러올 수 없습니다. 비밀번호를 확인해주세요.");
        history.back();
        return;
    }
    document.getElementById('write-category').value = data.category;
    document.getElementById('write-title').value = data.title;
    document.getElementById('write-link').value = data.link_url || '';
    document.getElementById('write-password').value = isAdminEditor ? '' : currentEditPassword;
    if (!isAdminEditor) document.getElementById('write-password').placeholder = '수정/삭제 비밀번호';
    document.getElementById('write-is-secret').checked = data.is_secret === true || String(data.is_secret) === 'true';
    quill.root.innerHTML = data.content || '';
    if (data.image_url && data.image_url !== 'null') {
        const urls = data.image_url.split('||').map(u => u.trim()).filter(Boolean);
        fileItems = urls.map(item => ({ type: 'server', value: item }));
        renderFileList();
    }
}
// 새 파일 선택 시 기존 목록에 추가
        function handleNewFiles(input) {
            if (input.files && input.files.length > 0) {
                for (let i = 0; i < input.files.length; i++) {
                    fileItems.push({ type: 'new', value: input.files[i] });
                }
                input.value = ''; // 동일 파일 재선택 가능하도록 초기화
                renderFileList();
            }
        }

        // 파일 목록 UI 렌더링 (순서 변경 버튼 포함)
        function renderFileList() {
            const list = document.getElementById('existing-files-list');
            list.innerHTML = '';

            if (fileItems.length === 0) {
                list.innerHTML = '<span style="color:#888; font-size:0.85rem;">첨부된 파일이 없습니다.</span>';
                return;
            }

            fileItems.forEach((fileObj, idx) => {
                let displayName = '';
                if (fileObj.type === 'server') {
                    let item = fileObj.value;
                    if (item.includes('@@')) { 
                        displayName = item.split('@@')[1]; 
                    } else {
                        let rawFilename = item.split('/').pop().split('?')[0];
                        try { rawFilename = decodeURIComponent(rawFilename); } catch (e) { }
                        displayName = rawFilename.includes('___') ? rawFilename.split('___').pop() : rawFilename;
                        
                        // 파일명 앞의 타임스탬프 숫자와 밑줄(예: 1701234567_) 제거
                        displayName = displayName.replace(/^[0-9]+_/, '');
                    }
                } else {
                    displayName = fileObj.value.name;
                }

                const isFirst = idx === 0;
                const isLast = idx === fileItems.length - 1;

                list.innerHTML += `
                        <div style="display:flex; justify-content:space-between; align-items:center; background:#f0f7ff; padding:8px 12px; border-radius:6px; border:1px solid #cce5ff;">
                            <span style="font-size:0.9rem; color:#1a3c6e; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; margin-right:10px;">📎 ${displayName}</span>
                            <div style="display:flex; gap:4px; align-items:center; flex-shrink:0;">
                                <button type="button" onclick="moveFile(${idx}, -1)" ${isFirst ? 'disabled style="opacity:0.3; cursor:not-allowed;"' : ''} style="background:#1a3c6e; color:white; border:none; border-radius:4px; padding:3px 8px; cursor:pointer; font-size:0.75rem;">▲ 위로</button>
                                <button type="button" onclick="moveFile(${idx}, 1)" ${isLast ? 'disabled style="opacity:0.3; cursor:not-allowed;"' : ''} style="background:#1a3c6e; color:white; border:none; border-radius:4px; padding:3px 8px; cursor:pointer; font-size:0.75rem;">▼ 아래로</button>
                                <button type="button" onclick="removeFile(${idx})" style="background:#ff6b6b; color:white; border:none; border-radius:4px; padding:3px 8px; cursor:pointer; font-size:0.75rem; margin-left:4px;">삭제</button>
                            </div>
                        </div>`;
            });
        }

        // 순서 변경 함수 (index 위치의 파일을 direction(-1 또는 1)만큼 이동)
        window.moveFile = function (idx, direction) {
            const targetIdx = idx + direction;
            if (targetIdx < 0 || targetIdx >= fileItems.length) return;
            const temp = fileItems[idx];
            fileItems[idx] = fileItems[targetIdx];
            fileItems[targetIdx] = temp;
            renderFileList();
        }

        window.removeFile = function (idx) {
            fileItems.splice(idx, 1);
            renderFileList();
        };

        function getFirstImageFromContent(html) {
            const d = document.createElement('div');
            d.innerHTML = html;
            const i = d.querySelector('img');
            return i ? i.src : null;
        }

        async function submitPost() {
            const title = document.getElementById('write-title').value.trim();
            const author = document.getElementById('write-link').value.trim();
            const password = document.getElementById('write-password').value.trim();
            const isSecret = document.getElementById('write-is-secret').checked;
            const category = document.getElementById('write-category').value || 'notice';

            if (!title) return alert("제목을 입력해주세요.");
            if (!isAdminEditor && !password) return alert("게시글 수정/삭제를 위해 비밀번호를 입력해주세요.");
            if (!isAdminEditor && isSecret) return alert("비밀글은 관리자만 등록할 수 있습니다.");

            showLoading(true);

            let finalFileUrls = [];

            // fileItems 배열 순서대로 서버 업로드 및 문자열 구성
            for (let i = 0; i < fileItems.length; i++) {
                const item = fileItems[i];
                if (item.type === 'server') {
                    finalFileUrls.push(item.value);
                } else {
                    const df = item.value;
                    const ext = df.name.split('.').pop();
                    const safeKey = `d_${Date.now()}_${i}.${ext}`;
                    const { data, error } = await window.sb.storage.from('images').upload(safeKey, df);
                    if (error) {
                        showLoading(false);
                        return alert("첨부파일 업로드 실패: " + error.message);
                    }
                    const fileUrl = window.sb.storage.from('images').getPublicUrl(data.path).data.publicUrl;
                    finalFileUrls.push(fileUrl + '@@' + df.name);
                }
            }

            let du = finalFileUrls.length > 0 ? finalFileUrls.join('||') : null;
            const thumbUrl = getFirstImageFromContent(quill.root.innerHTML) || null;

            const pd = {
                title: title,
                content: quill.root.innerHTML,
                category: category,
                link_url: author,
                is_secret: isSecret,
                image_url: du,
                thumbnail_url: thumbUrl,
                is_visible: true
            };

            let resultError;
            if (editId) {
                if (isAdminEditor) {
                    if (password) pd.password = password;
                    const { error } = await window.sb.from('total_posts').update(pd).eq('id', editId);
                    resultError = error;
                } else {
                    const { error } = await window.sb.functions.invoke('public-post-actions', {
                        body: { action: 'update', id: Number(editId), password, post: pd }
                    });
                    resultError = error;
                }
            } else if (isAdminEditor) {
                pd.order_num = 0;
                if (password) pd.password = password;
                const { error } = await window.sb.from('total_posts').insert([pd]);
                resultError = error;
            } else {
                const { error } = await window.sb.functions.invoke('public-post-actions', {
                    body: { action: 'create', password, post: pd }
                });
                resultError = error;
            }

            showLoading(false);

            if (resultError) {
                alert("저장 중 오류 발생: " + resultError.message);
            } else {
                alert("게시글이 성공적으로 저장되었습니다.");
                location.href = `notice.html#${category}`;
            }
        }
    </script>
</body>
</html>
