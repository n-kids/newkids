<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴키즈 - 게시판</title>
    <meta name="description" content="뉴키즈(New Kids)의 주요 공지사항과 교육 자료를 확인하세요. 어린이집과 유치원 원장님들을 위한 유익한 최신 운영 소식을 전해드립니다.">
    <meta name="keywords" content="뉴키즈 공지사항, 김포뉴키즈, 고양뉴키즈, 파주뉴키즈, 유치원 교육자료">
    <!-- 공통 스타일 시트 로드 -->
    <link rel="stylesheet" href="style.css?v=20261026">
</head>
<body id="main-body">

    <header></header>

    <div class="board-header-section" id="view-hero">
        <div class="container">
            <h1 id="board-title" style="font-size: 2.2rem; margin-bottom:10px; color:#1a3c6e;">📢 알림 & 소식</h1>
            <p id="board-desc" style="color:#666;">데이터를 불러오는 중입니다...</p>
        </div>
    </div>

    <div class="board-container" style="max-width: 1100px; margin: 40px auto; box-sizing: border-box;">

        <!-- 상단 유틸리티 버튼 행 (찜하기 / 최근본자료 / 글쓰기) -->
        <div class="top-btn-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
            <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                <!-- 찜한 자료 버튼 -->
                <button id="btn-scrap-mode" onclick="toggleScrapMode()" class="hashtag-btn" style="border-color:#f4a261; color:#f4a261;">
                    ⭐ 찜한 자료
                </button>
                <!-- 최근 본 자료 버튼 -->
                <button id="btn-recent-mode" onclick="toggleRecentMode()" class="hashtag-btn" style="border-color:#2a9d8f; color:#2a9d8f;">
                    🕒 최근 본 자료
                </button>
            </div>
            <button id="btn-user-write" class="btn-action" style="display: none; margin:0;" onclick="location.href='write.html#' + currentCategory">✏️ 글쓰기</button>
        </div>



        <!-- 해시태그 영역 -->
        <div class="filter-wrap" style="display:flex; margin-bottom: 25px; width: 100%;">
            <div class="hashtag-container" id="hashtag-area" style="flex:1; min-width: 0; width: 100%;">
                <span style="color:#666; font-size:0.9rem;">태그 분석 중...</span>
            </div>
        </div>

        <div class="board-list-head" style="display:grid; grid-template-columns: 80px 100px 1fr 120px; padding:12px 10px; font-weight:bold; border-bottom:2px solid #1a3c6e; color:#333;">
            <div style="text-align:center;">번호</div>
            <div style="text-align:center;">작성자</div>
            <div style="padding-left:10px;">제목</div>
            <div style="text-align:center;">작성일 / 다운로드</div>
        </div>

        <div id="board-list-wrapper">
            <div style="text-align:center; padding:50px; color:#666;">데이터를 불러오는 중입니다...</div>
        </div>

        <div id="load-more-box" style="display:none; justify-content:center; margin-top:40px;">
            <button onclick="loadMore()" class="btn-load-more">더보기 ＋</button>
        </div>

        <div style="display: flex; justify-content: center; align-items: center; margin-top: 40px; gap: 5px;">
            <input type="text" id="search-input" class="form-input" style="width: 250px; padding: 8px;" placeholder="제목 검색" onkeypress="if(event.keyCode==13) executeSearch();">
            <button onclick="executeSearch()" class="btn-action" style="padding: 8px 15px;">검색</button>
        </div>
    </div>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=20261026"></script>
    <script src="manager.js?v=20261101"></script>

    <script>
        const ITEMS_PER_PAGE = 10;
        let currentPage = 1;
        let currentCategory = location.hash.replace('#', '');
        let currentSearchKeyword = '';
        let boardCategories = [];
        let isScrapMode = false;
        let isRecentMode = false;
        let currentFormatFilter = 'ALL';

        document.addEventListener("DOMContentLoaded", () => {
            const checkReady = setInterval(() => {
                if (window.sb && window.GLOBAL_CATEGORIES && window.GLOBAL_CATEGORIES.length > 0) {
                    clearInterval(checkReady);

                    boardCategories = window.GLOBAL_CATEGORIES.filter(c => c.type === 'BOARD');

                    if (boardCategories.length > 0) {
                        if (!currentCategory || !boardCategories.find(c => c.code === currentCategory)) {
                            currentCategory = boardCategories[0].code;
                        }

                        updateBoardHeader();
                        buildDynamicHashtags().then(() => loadBoardList(1));
                    } else {
                        document.getElementById('board-list-wrapper').innerHTML = "<div style='text-align:center; padding:50px;'>생성된 게시판이 없습니다.</div>";
                    }
                }
            }, 100);
        });

        window.addEventListener('hashchange', () => {
            currentCategory = location.hash.replace('#', '');
            if (!currentCategory && boardCategories.length > 0) currentCategory = boardCategories[0].code;

            currentSearchKeyword = '';
            const searchInput = document.getElementById('search-input');
            if (searchInput) searchInput.value = '';

            updateBoardHeader();
            buildDynamicHashtags().then(() => loadBoardList(1));
        });

        function updateBoardHeader() {
            const catInfo = boardCategories.find(c => c.code === currentCategory);
            if (catInfo) {
                document.getElementById('board-title').innerText = catInfo.name;
                document.getElementById('board-desc').innerText = catInfo.hero_desc || "뉴키즈의 게시판입니다.";
                document.title = "뉴키즈 - " + catInfo.name;
            }

            const writeBtn = document.getElementById('btn-user-write');
            if (currentCategory === 'notice') {
                writeBtn.style.display = 'none';
            } else {
                writeBtn.style.display = 'inline-block';
            }
        }

        async function buildDynamicHashtags() {
            const hashtagArea = document.getElementById('hashtag-area');

            const { data, error } = await window.sb.from('total_posts')
                .select('title')
                .eq('category', currentCategory)
                .neq('is_visible', false);

            if (error || !data || data.length === 0) {
                hashtagArea.innerHTML = '';
                return;
            }

            let tags = new Set();

            data.forEach(item => {
                if (item.title) {
                    const match = item.title.match(/\[(.*?)\]/);
                    if (match && match[1]) {
                        const innerText = match[1];
                        const parts = innerText.split(/[,-]/);
                        parts.forEach(p => {
                            const tag = p.trim();
                            if (tag) tags.add(tag);
                        });
                    }
                }
            });

            const sortedTags = Array.from(tags).sort();

            if (sortedTags.length === 0) {
                hashtagArea.innerHTML = '';
                return;
            }

            let html = `<button class="hashtag-btn ${currentSearchKeyword === '' ? 'active' : ''}" onclick="clickHashtag('', this)">#전체보기</button>`;

            sortedTags.forEach(tag => {
                const isActive = (currentSearchKeyword === tag) ? 'active' : '';
                html += `<button class="hashtag-btn ${isActive}" onclick="clickHashtag('${tag}', this)">#${tag}</button>`;
            });

            hashtagArea.innerHTML = html;
        }

        window.clickHashtag = function (keyword, btnEl) {
            document.querySelectorAll('.hashtag-container .hashtag-btn').forEach(btn => btn.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');

            document.getElementById('search-input').value = keyword;
            currentSearchKeyword = keyword;
            loadBoardList(1);
        };

        window.filterByFormat = function (format, btnEl) {
            document.querySelectorAll('.format-filter').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            currentFormatFilter = format;
            loadBoardList(1);
        };

        function executeSearch() {
            const inputVal = document.getElementById('search-input').value.trim();
            currentSearchKeyword = inputVal;
            loadBoardList(1);
        }

        window.toggleScrapMode = function () {
            isScrapMode = !isScrapMode;
            isRecentMode = false;
            document.getElementById('btn-recent-mode').style.background = '#fff';
            document.getElementById('btn-recent-mode').style.color = '#2a9d8f';

            const btn = document.getElementById('btn-scrap-mode');
            if (isScrapMode) {
                btn.style.background = '#f4a261';
                btn.style.color = '#fff';
                btn.innerText = '⭐ 찜한 자료 보는 중';
            } else {
                btn.style.background = '#fff';
                btn.style.color = '#f4a261';
                btn.innerText = '⭐ 찜한 자료';
            }
            loadBoardList(1);
        };

        window.toggleRecentMode = function () {
            isRecentMode = !isRecentMode;
            isScrapMode = false;
            document.getElementById('btn-scrap-mode').style.background = '#fff';
            document.getElementById('btn-scrap-mode').style.color = '#f4a261';

            const btn = document.getElementById('btn-recent-mode');
            if (isRecentMode) {
                btn.style.background = '#2a9d8f';
                btn.style.color = '#fff';
                btn.innerText = '🕒 최근 본 자료 보는 중';
            } else {
                btn.style.background = '#fff';
                btn.style.color = '#2a9d8f';
                btn.innerText = '🕒 최근 본 자료';
            }
            loadBoardList(1);
        };

        window.toggleScrap = function (event, postId) {
            event.stopPropagation();
            let savedScraps = JSON.parse(localStorage.getItem('nk_scraps') || '[]');
            const btn = event.target;

            if (savedScraps.includes(postId)) {
                savedScraps = savedScraps.filter(id => id !== postId);
                btn.innerText = '☆';
            } else {
                savedScraps.push(postId);
                btn.innerText = '⭐';
            }
            localStorage.setItem('nk_scraps', JSON.stringify(savedScraps));
        };

        window.recordRecentAndGo = function (postId, url) {
            let recentList = JSON.parse(localStorage.getItem('nk_recent') || '[]');
            recentList = recentList.filter(id => id !== postId);
            recentList.unshift(postId);
            if (recentList.length > 20) recentList.pop();
            localStorage.setItem('nk_recent', JSON.stringify(recentList));
            location.href = url;
        };

        window.loadMore = function () {
            loadBoardList(currentPage + 1, true);
        };

        async function loadBoardList(page, append = false) {
            currentPage = page;
            const listDiv = document.getElementById('board-list-wrapper');
            const loadMoreBox = document.getElementById('load-more-box');

            if (!append) {
                listDiv.innerHTML = '<div style="text-align:center; padding:50px; color:#666;">로딩 중...</div>';
            }

            let savedScraps = JSON.parse(localStorage.getItem('nk_scraps') || '[]');
            let recentList = JSON.parse(localStorage.getItem('nk_recent') || '[]');

            if (isScrapMode && savedScraps.length === 0) {
                listDiv.innerHTML = `<div style="text-align:center; padding:50px; border-bottom:1px solid #eaeaea;">찜(⭐)해둔 자료가 없습니다.</div>`;
                loadMoreBox.style.display = 'none';
                return;
            }
            if (isRecentMode && recentList.length === 0) {
                listDiv.innerHTML = `<div style="text-align:center; padding:50px; border-bottom:1px solid #eaeaea;">최근 본 자료가 없습니다.</div>`;
                loadMoreBox.style.display = 'none';
                return;
            }

            const from = (page - 1) * ITEMS_PER_PAGE;
            const to = from + ITEMS_PER_PAGE - 1;

            let query = window.sb.from('total_posts')
                .select('id, title, category, created_at, link_url, is_secret, download_count, is_notice, image_url', { count: 'exact' })
                .eq('category', currentCategory)
                .neq('is_visible', false);

            if (currentSearchKeyword !== '') {
                query = query.ilike('title', `%${currentSearchKeyword}%`);
            }

            if (isScrapMode) {
                query = query.in('id', savedScraps);
            } else if (isRecentMode) {
                query = query.in('id', recentList);
            }

            // 자료실은 제목 앞 [과목명] 기준 가나다순, 그 외 게시판은 최신순
            query = query.order('is_notice', { ascending: false, nullsFirst: false });
            query = (currentCategory === 'reference')
                ? query.order('title', { ascending: true }).order('created_at', { ascending: false })
                : query.order('created_at', { ascending: false });
            const { data, count, error } = await query.range(from, to);

            if (error) {
                if (!append) listDiv.innerHTML = `<div style="text-align:center; padding:30px;">에러: ${error.message}</div>`;
                return;
            }

            let processedData = data || [];
            if (currentFormatFilter !== 'ALL' && processedData.length > 0) {
                processedData = processedData.filter(item => {
                    if (!item.image_url) return false;
                    const upperUrl = item.image_url.toUpperCase();
                    return upperUrl.includes('.' + currentFormatFilter);
                });
            }

            if (processedData.length === 0) {
                if (!append) listDiv.innerHTML = `<div style="text-align:center; padding:50px; border-bottom:1px solid #eaeaea;">등록되거나 조건에 맞는 글이 없습니다.</div>`;
                loadMoreBox.style.display = 'none';
                return;
            }

            if (!append) listDiv.innerHTML = '';

            const postIds = processedData.map(item => item.id);
            let answeredSet = new Set();

            if (postIds.length > 0) {
                const { data: commentsData } = await window.sb.from('post_comments').select('post_id').in('post_id', postIds);
                if (commentsData) {
                    commentsData.forEach(c => answeredSet.add(c.post_id));
                }
            }

            let html = '';
            processedData.forEach((item, index) => {
                const date = new Date(item.created_at).toISOString().split('T')[0];
                let authorName = item.link_url ? item.link_url.trim() : '익명';
                let isAdminPost = false;

                if (currentCategory === 'notice') {
                    authorName = '관리자';
                    isAdminPost = true;
                } else if (authorName === '관리자') {
                    isAdminPost = true;
                } else if (authorName === '익명' || authorName.startsWith('http://') || authorName.startsWith('https://')) {
                    authorName = '관리자';
                    isAdminPost = true;
                }

                const displayNum = count - from - index;
                const secretIcon = (item.is_secret === true || String(item.is_secret) === 'true') ? '🔒 ' : '';
                const dlCount = item.download_count || 0;

                let statusBadge = '';
                if (!isAdminPost) {
                    if (answeredSet.has(item.id)) {
                        statusBadge = `<span class="badge" style="background:#1a3c6e; color:white; margin-right:8px; border-radius:12px; padding:3px 8px; font-size:0.75rem;">답변완료</span>`;
                    } else {
                        statusBadge = `<span class="badge" style="background:#e9ecef; color:#888; margin-right:8px; border-radius:12px; padding:3px 8px; font-size:0.75rem;">답변대기</span>`;
                    }
                }

                const isScrapped = savedScraps.includes(item.id);
                const starIcon = isScrapped ? '⭐' : '☆';

                const isNoticePost = (item.is_notice === true);
                const rowBg = isNoticePost ? 'background-color: rgba(244, 162, 97, 0.08);' : '';
                const displayNumHtml = isNoticePost ? '<span style="color:#e74c3c; font-weight:bold;">공지</span>' : displayNum;
                const noticeIcon = isNoticePost ? '📌 ' : '';

                html += `
                            <div class="board-list-row" onclick="recordRecentAndGo(${item.id}, 'view.html?id=${item.id}')" style="display:grid; grid-template-columns: 80px 100px 1fr 120px; padding:15px 10px; align-items:center; cursor:pointer; ${rowBg}">
                                <div style="text-align:center; font-weight:bold; color:#666;">${displayNumHtml}</div>
                                <div style="text-align:center;"><span class="badge" style="background:#f1f3f5; color:#555; padding:3px 8px; border-radius:4px; font-size:0.8rem;">${authorName}</span></div>
                                <div style="padding-left:10px; display:flex; align-items:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                                    <button class="scrap-btn" onclick="toggleScrap(event, ${item.id})">${starIcon}</button>
                                    ${statusBadge}${secretIcon}${noticeIcon}<span style="overflow:hidden; text-overflow:ellipsis;">${item.title}</span>
                                </div>
                                <div style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px;">
                                    <span style="font-size:0.85rem; color:#666;">${date}</span>
                                    <span style="font-size:0.75rem; color:#888; background:rgba(0,0,0,0.05); padding:2px 6px; border-radius:4px;">📥 ${dlCount}</span>
                                </div>
                            </div>`;
            });

            listDiv.innerHTML += html;

            if (count > to + 1) {
                loadMoreBox.style.display = 'flex';
            } else {
                loadMoreBox.style.display = 'none';
            }
        }
    </script>
</body>
</html>
