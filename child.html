<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴키즈 - 교육 프로그램</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header></header>
    <div id="loading" class="loading-overlay" style="display: flex;">데이터를 불러오는 중입니다...</div>

    <section class="sub-hero bg-child" id="view-hero">
        <div class="container-wide">
            <h1 id="page-title">교육 프로그램</h1>
            <p id="page-desc">아이들의 꿈을 키워주는 다양한 교재를 소개합니다.</p>
        </div>
    </section>

    <section>
        <div class="container">
            <div id="post-list" class="main-grid"></div>
        </div>
    </section>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="manager.js"></script>

    <script>
        const NO_IMAGE_URL = "https://placehold.co/400x300/e0e0e0/666666?text=No+Image";

        document.addEventListener("DOMContentLoaded", function () {
            loadCategoryPosts();
            window.addEventListener('hashchange', loadCategoryPosts);
        });

        async function loadCategoryPosts() {
            const category = window.location.hash.substring(1) || 'korean';
            setTimeout(() => { if (window.applySubPageHero) window.applySubPageHero(); }, 500);

            document.getElementById('loading').style.display = 'flex';
            const postListEl = document.getElementById('post-list');
            postListEl.innerHTML = '';

            try {
                // [수정] video_url이 'ORDER_ITEM' (발주 전용)이 아닌 것만 가져오기
                // SELECT 문에 video_url 포함 필수
                const { data, error } = await window.sb.from('total_posts')
                    .select('id, title, thumbnail_url, content, created_at, video_url')
                    .eq('category', category)
                    .eq('is_visible', true)
                    .neq('video_url', 'ORDER_ITEM') // ★ 핵심 수정
                    .order('order_num', { ascending: true })
                    .order('created_at', { ascending: false });

                if (!data || data.length === 0) {
                    listContainer.innerHTML = `
        <div style="text-align:center; padding: 80px 20px; color:#888; background-color:#f9f9f9; border-radius:12px; grid-column: 1 / -1; width: 100%;">
            <div style="font-size: 3rem; margin-bottom: 15px;">📭</div>
            <h3 style="color:#555; margin-bottom: 10px;">현재 준비 중인 프로그램입니다.</h3>
            <p style="font-size: 1rem;">새로운 콘텐츠가 곧 업데이트될 예정입니다. 조금만 기다려주세요!</p>
        </div>
    `;
                    return;
                }
                data.forEach(item => {
                    let thumb = item.thumbnail_url || NO_IMAGE_URL;
                    let desc = item.content ? item.content.replace(/<[^>]*>?/gm, '').substring(0, 50) + '...' : '';

                    postListEl.insertAdjacentHTML('beforeend', `
                                <a href="view.html?id=${item.id}" class="card post-card">
                                    <div class="card-img-wrap post-thumb">
                                        <img src="${thumb}" alt="${item.title}" onerror="this.src='${NO_IMAGE_URL}';">
                                    </div>
                                    <div class="card-body post-info">
                                        <h3 class="card-title post-title">${item.title}</h3>
                                        <p class="card-text post-desc">${desc}</p>
                                    </div>
                                </a>`);
                });
            } catch (err) { console.error(err); }
            finally { document.getElementById('loading').style.display = 'none'; }
        }
    </script>
</body>
</html>
