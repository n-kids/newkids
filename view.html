<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴키즈 - 상세 보기</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #view-hero.sub-hero {
            height: auto !important;
            background-color: #ffffff !important;
            border-bottom: 1px solid #eaeaea !important;
            padding: 30px 0 !important;
            margin: 0 !important;
            box-shadow: none !important;
            text-align: center !important;
        }

        #view-hero h1 {
            color: #111111 !important;
            font-size: 2.2rem !important;
            font-weight: bold !important;
            margin-bottom: 5px !important;
            text-shadow: none !important;
        }

        #view-hero p {
            color: #666666 !important;
            font-size: 0.95rem !important;
            margin: 0 !important;
            text-shadow: none !important;
        }

        .post-title {
            font-size: 2rem;
            color: #1a3c6e;
            margin-bottom: 15px;
            font-weight: bold;
            line-height: 1.3;
            text-align: center;
        }

        .post-meta {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            color: #666;
            font-size: 0.95rem;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <header></header>

    <section class="sub-hero" id="view-hero">
        <div class="container">
            <h1 id="v-title">불러오는 중...</h1>
            <p id="v-date">작성일: -</p>
        </div>
    </section>

    <section style="background-color: #f8f9fa; padding: 40px 0;">
        <div class="container">
            <div class="proposal-box" style="max-width: 900px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 12px;">

                <!-- 게시글 본문 영역 -->
                <div id="v-content" style="line-height: 1.6; color: #333;">
                    데이터를 불러오는 중입니다...
                </div>

                <!-- 첨부파일 및 다운로드 영역 -->
                <div id="download-files-area" style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; display: none;">
                    <h4 style="color: #1a3c6e; margin-bottom: 15px;">📎 첨부파일 및 다운로드</h4>
                    <div id="download-list-container" style="display: flex; flex-direction: column; gap: 8px;"></div>
                </div>

                <div class="btn-center-wrap" style="margin-top: 40px;">
                    <button onclick="history.back()" class="btn-action" style="background:#666; width: 150px;">목록으로</button>
                </div>
            </div>
        </div>
    </section>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="manager.js"></script>
    <script>
        let currentPostId = null;

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            currentPostId = urlParams.get('id');

            if (!currentPostId) {
                alert("잘못된 접근입니다.");
                location.href = 'index.html';
                return;
            }

            const checkReady = setInterval(() => {
                if (window.sb) {
                    clearInterval(checkReady);
                    loadPostDetail(currentPostId);
                }
            }, 100);
        });

        async function loadPostDetail(id) {
            const { data, error } = await window.sb.from('total_posts').select('*').eq('id', id).single();

            if (error || !data) {
                document.getElementById('v-content').innerHTML = "<div style='text-align:center; padding:50px;'>게시글을 찾을 수 없습니다.</div>";
                return;
            }

            document.getElementById('v-title').innerText = data.title;
            document.title = "뉴키즈 - " + data.title;

            let finalContent = data.content || '';
            finalContent = finalContent.replace(/\[투표:(\d+)\]/g, '<iframe id="form-iframe-$1" src="form.html?id=$1" width="100%" frameborder="0" scrolling="no" style="border:1px solid #ddd; border-radius:12px; margin:30px 0; overflow:hidden; transition:height 0.3s ease;"></iframe>');

            document.getElementById('v-content').innerHTML = finalContent;
            document.getElementById('v-date').innerText = "작성일: " + new Date(data.created_at).toISOString().split('T')[0];

            // 첨부파일 렌더링 (자바스크립트 함수로 원본 이름 강제 다운로드 연결)
            if (data.image_url && data.image_url.trim() !== '' && data.image_url !== 'null') {
                const files = data.image_url.split('||').map(u => u.trim()).filter(u => u);
                if (files.length > 0) {
                    const downloadArea = document.getElementById('download-files-area');
                    const downloadList = document.getElementById('download-list-container');
                    let fileHtml = '';

                    files.forEach(item => {
                        let fileUrl = item;
                        let fileName = "다운로드 파일";

                        if (item.includes('@@')) {
                            const parts = item.split('@@');
                            fileUrl = parts[0];
                            fileName = parts[1];
                        } else {
                            let rawName = item.split('/').pop().split('?')[0];
                            try { rawName = decodeURIComponent(rawName); } catch (e) { }
                            fileName = rawName.includes('___') ? rawName.split('___').pop() : rawName;
                        }

                        // 인코딩 문제 방지를 위해 작은따옴표 처리
                        const safeUrl = fileUrl.replace(/'/g, "\\'");
                        const safeName = fileName.replace(/'/g, "\\'");

                        fileHtml += `
                                <div onclick="downloadFileWithOriginalName('${safeUrl}', '${safeName}')" style="display:flex; justify-content:space-between; align-items:center; background:#f8f9fa; padding:12px 15px; border-radius:8px; border:1px solid #e9ecef; cursor:pointer; text-decoration:none; color:#1a3c6e; font-weight:bold; transition: background 0.2s;">
                                    <span>📥 ${fileName}</span>
                                    <span style="font-size:0.85rem; background:#1a3c6e; color:#fff; padding:4px 10px; border-radius:4px;">다운로드</span>
                                </div>
                            `;
                    });

                    downloadList.innerHTML = fileHtml;
                    downloadArea.style.display = 'block';
                }
            }
        }

        // ★ 원본 파일명으로 강제 다운로드하는 자바스크립트 함수
        async function downloadFileWithOriginalName(url, filename) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);
            } catch (e) {
                console.error("다운로드 실패:", e);
                // 네트워크 정책으로 실패 시 새 창으로 열기 보완
                window.open(url, '_blank');
            }
        }

        // 폼 iframe 높이 조절 리스너
        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'resizeIframe') {
                let iframe = document.getElementById('form-iframe-' + event.data.formId);
                if (!iframe) {
                    const iframes = document.querySelectorAll('iframe');
                    for (let f of iframes) {
                        if (f.src && f.src.includes('id=' + event.data.formId)) {
                            iframe = f;
                            break;
                        }
                    }
                }
                if (iframe) {
                    iframe.style.height = (event.data.height + 30) + 'px';
                }
            }
        });
    </script>
</body>
</html>
