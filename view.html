<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴키즈 - 상세 내용</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <style>
        .view-content .ql-align-center {
            text-align: center !important;
        }

        .view-content .ql-align-right {
            text-align: right !important;
        }

        .view-content .ql-align-justify {
            text-align: justify !important;
        }

        .view-content .ql-align-center img {
            display: block;
            margin: 0 auto !important;
        }

        .view-content .ql-align-right img {
            display: block;
            margin-left: auto !important;
            margin-right: 0 !important;
        }

        .view-content .ql-align-left img {
            display: block;
            margin-left: 0 !important;
            margin-right: auto !important;
        }
    </style>
</head>
<body>
    <header></header>
    <div id="loading" class="loading-overlay">내용을 불러오는 중입니다...</div>

    <section class="sub-hero" id="view-hero" style="background-color: #1a3c6e;">
        <div class="container">
            <h1 id="page-title"></h1>
            <p id="page-desc"></p>
        </div>
    </section>

    <section>
        <div class="container-wide">
            <div class="view-box">
                <div class="view-header">
                    <h2 class="view-title" id="post-title"></h2>
                    <p class="view-date" id="post-date"></p>
                </div>

                <div class="view-media" id="view-media" style="display:none;"></div>

                <div id="download-container" class="download-container"></div>

                <div class="view-content ql-editor" id="post-content"></div>

                <div id="link-container" style="text-align: center; margin: 40px 0 20px;"></div>

                <a href="javascript:history.back()" class="btn-list">목록으로 돌아가기</a>
            </div>
        </div>
    </section>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="manager.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');

            if (postId) {
                const checkSb = setInterval(() => {
                    if (window.sb) {
                        clearInterval(checkSb);
                        loadPostDetail(postId);
                    }
                }, 100);
            }
        });

        function isVideo(url) {
            if (!url) return false;
            return /\.(mp4|webm|ogg|mov|avi|mkv)(\?|$)/i.test(url);
        }

        function isImage(url) {
            if (!url) return false;
            return /\.(jpeg|jpg|gif|png|webp|svg)(\?|$)/i.test(url);
        }

        async function loadPostDetail(id) {
            document.getElementById('loading').style.display = 'flex';
            try {
                const { data, error } = await window.sb.from('total_posts').select('*').eq('id', id).single();
                if (error || !data) throw new Error("데이터 없음");

                document.getElementById('post-title').innerText = data.title;
                document.getElementById('post-date').innerText = window.formatDate(data.created_at);
                document.getElementById('post-content').innerHTML = data.content;

                const mediaBox = document.getElementById('view-media');
                const downloadBox = document.getElementById('download-container');
                mediaBox.innerHTML = '';
                downloadBox.innerHTML = '';

                let rawVideo = data.video_url || "";
                let videoVal = rawVideo.trim();

                if (videoVal === 'ORDER_ITEM' || videoVal === 'null' || videoVal === '') {
                    videoVal = null;
                }
                else if (videoVal.startsWith('ORDER_ALL|')) {
                    const parts = videoVal.split('|');
                    videoVal = (parts.length > 1 && parts[1].trim() !== '') ? parts[1].trim() : null;
                }

                if (videoVal && !videoVal.startsWith('http')) {
                    videoVal = null;
                }

                // 비디오 렌더링
                if (videoVal) {
                    const yid = window.getYoutubeId(videoVal);
                    mediaBox.innerHTML += yid
                        ? `<iframe src="https://www.youtube.com/embed/${yid}" frameborder="0" allowfullscreen style="margin-bottom:15px;"></iframe>`
                        : `<video controls style="width:100%; border-radius:10px; margin-bottom:15px;"><source src="${videoVal}"></video>`;
                    mediaBox.style.display = 'block';
                }

                // (view.html의 loadPostDetail 함수 내부에 있는 다중 파일 파싱 부분을 이 코드로 교체하세요)
                if (data.image_url && data.image_url !== 'null' && data.image_url.trim() !== '') {
                    const urls = data.image_url.split('||');

                    urls.forEach(fileData => {
                        fileData = fileData.trim();
                        if (!fileData) return;

                        let fileUrl = fileData;
                        let displayFilename = "";

                        // '@@' 구분자를 통해 URL과 한글 원본 이름을 분리합니다.
                        if (fileData.includes('@@')) {
                            const parts = fileData.split('@@');
                            fileUrl = parts[0];
                            displayFilename = parts[1];
                        } else {
                            // 과거에 올렸던 파일 하위 호환
                            let rawFilename = fileUrl.split('/').pop().split('?')[0];
                            try { rawFilename = decodeURIComponent(rawFilename); } catch (e) { }
                            displayFilename = rawFilename.includes('___') ? rawFilename.split('___').pop() : rawFilename;
                        }

                        const fileExt = displayFilename.split('.').pop().toUpperCase();

                        if (isVideo(fileUrl)) {
                            mediaBox.innerHTML += `<video controls style="width:100%; border-radius:10px; margin-bottom:15px;"><source src="${fileUrl}"></video>`;
                            mediaBox.style.display = 'block';
                        } else if (isImage(fileUrl)) {
                            mediaBox.innerHTML += `<img src="${fileUrl}" style="width:100%; border-radius:8px; margin-bottom:15px;" onerror="this.style.display='none'">`;
                            mediaBox.style.display = 'block';
                        }

                        const forceDownloadUrl = fileUrl + (fileUrl.includes('?') ? '&' : '?') + 'download=' + encodeURIComponent(displayFilename);

                        downloadBox.innerHTML += `
            <a href="${forceDownloadUrl}" class="link-btn-style btn-download" style="display: inline-block; margin: 5px;">
                📂 ${displayFilename} 다운로드
            </a>`;
                    });
                }

                if (!mediaBox.innerHTML.trim()) {
                    mediaBox.style.display = 'none';
                }

                const linkBox = document.getElementById('link-container');
                linkBox.innerHTML = "";

                if (data.link_url && data.link_url.trim() !== "" && data.link_url !== "null") {
                    let finalLink = data.link_url.trim();
                    if (!finalLink.startsWith('http')) finalLink = 'https://' + finalLink;

                    linkBox.innerHTML = `
                                    <a href="${finalLink}" target="_blank" class="link-btn-style">
                                        🔗 관련 사이트 바로가기
                                    </a>`;
                }

                if (typeof window.updateHeroBackground === 'function') {
                    window.updateHeroBackground(data.category);
                }

            } catch (err) {
                console.error(err);
                alert("불러오기 실패: " + err.message);
                history.back();
            }
            finally { document.getElementById('loading').style.display = 'none'; }
        }
    </script>
</body>
</html>
