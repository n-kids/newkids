<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴키즈 - 교재 발주 요청</title>
    <link rel="stylesheet" href="style.css?v=20261127-1">
    <link id="nk-subpage-theme" rel="stylesheet" href="subpage-theme.css?v=20261127-1">
<link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
    <header></header>

    <section class="sub-hero" id="view-hero">
        <div class="container">
            <h1>교재 발주 요청</h1>
            <p>카테고리를 선택하고 연령과 수량을 입력해 주세요.</p>
        </div>
    </section>

    <section style="background-color: #f8f9fa;">
        <div class="container">
            <form id="orderForm" class="proposal-box">
                <h2 class="form-section-title">👤 주문자 정보</h2>

                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">원명 (필수)</label>
                        <input type="text" name="wonName" class="form-input" placeholder="예: 해바라기 어린이집" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">담당자 성함 (필수)</label>
                        <input type="text" name="manager" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">연락처 (필수)</label>
                        <input type="tel" name="phone" class="form-input" placeholder="010-0000-0000" maxlength="13" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">이메일 (선택)</label>
                        <input type="email" name="email" class="form-input" placeholder="sample@email.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">지역 (시/구) (필수)</label>
                        <input type="text" name="region" class="form-input" placeholder="예: 서울 강남구" required>
                    </div>
                </div>

                <h2 class="form-section-title" style="margin-top: 40px;">📦 교재 선택 (카테고리 클릭)</h2>

                <div id="loading-msg" style="text-align:center; padding:30px; color:#666;">
                    상품 정보를 불러오는 중입니다...
                </div>

                <div id="product-list-area" class="order-list-box"></div>

                <div class="form-group full-width" style="margin-top: 20px;">
                    <label class="form-label">기타 요청사항</label>
                    <textarea name="remarks" class="form-input" style="height: 80px;" placeholder="추가 전달 사항이 있다면 적어주세요."></textarea>
                </div>

                <div id="nk-order-summary" class="nk-sticky-summary" hidden aria-live="polite">
                    <div class="nk-summary-bar">
                        <div class="nk-summary-info">
                            <span class="nk-summary-badge">주문 요약</span>
                            <strong class="nk-summary-count" id="nk-order-summary-text">선택된 교재 없음</strong>
                        </div>
                        <div class="nk-summary-actions">
                            <button type="button" class="nk-summary-toggle" id="nk-order-summary-toggle" aria-expanded="false" aria-controls="nk-order-summary-detail">내역 보기</button>
                            <button type="button" class="nk-summary-submit" id="nk-order-summary-submit">발주하기</button>
                        </div>
                    </div>
                    <div class="nk-summary-detail" id="nk-order-summary-detail" hidden>
                        <ul class="nk-summary-list" id="nk-order-summary-list"></ul>
                    </div>
                </div>

                <div class="btn-center-wrap">
                    <button type="submit" class="btn-action">발주하기</button>
                </div>
            </form>
        </div>
    </section>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=20261127-1"></script>
    <script src="manager.js?v=20261127-1"></script>

    <script>
        let CATEGORY_NAMES = {};

        document.addEventListener("DOMContentLoaded", function () {
            const checkSb = setInterval(() => {
                if (window.sb) {
                    clearInterval(checkSb);
                    loadDynamicOrderProducts(window.sb);
                }
            }, 100);
        });

        async function loadDynamicOrderProducts(sb) {
            try {
                const { data: catData, error: catError } = await sb
                    .from('program_categories')
                    .select('*')
                    .eq('type', 'EDU')
                    .eq('is_visible', true)
                    .order('order_num');

                if (catError || !catData) throw new Error("카테고리 로드 실패");

                const eduCodes = [];
                catData.forEach(c => {
                    CATEGORY_NAMES[c.code] = c.name;
                    eduCodes.push(c.code);
                });

                const nowIso = new Date().toISOString();
                const { data: posts, error: postError } = await sb.from('total_posts')
                    .select('*')
                    .in('category', eduCodes)
                    .like('video_url', 'ORDER_%')
                    .neq('is_visible', false)
                    .neq('is_draft', true)
                    .or(`publish_at.is.null,publish_at.lte.${nowIso}`)
                    .order('order_num', { ascending: true });

                document.getElementById('loading-msg').style.display = 'none';
                const listArea = document.getElementById('product-list-area');

                if (!posts || posts.length === 0) {
                    listArea.innerHTML = `<div style="text-align:center; padding:30px; color:#767676;">등록된 발주 상품이 없습니다.<br>관리자 페이지에서 상품을 등록해주세요.</div>`;
                    return;
                }

                const groupedData = (posts || []).reduce((acc, item) => {
                    const c = item.category || 'etc';
                    (acc[c] = acc[c] || []).push(item);
                    return acc;
                }, {});

                let html = "";
                eduCodes.forEach(code => {
                    const items = groupedData[code] || [];

                    html += `<div class="category-wrapper">
                                            <div class="order-category-header" onclick="toggleCategory(this)">
                                                <span>${CATEGORY_NAMES[code] || code}</span>
                                                <span class="toggle-icon">▼</span>
                                            </div>
                                            <div class="order-category-content">`;

                    if (items.length > 0) {
                        items.forEach(item => {
                            const safeTitle = window.escapeHtml(item.title);
                            html += `<div class="order-item-row" data-title="${safeTitle}" onclick="toggleProductItem(this)">
                                                    <div class="order-item-info">
                                                        <h3>${safeTitle}</h3>
                                                        <span class="check-indicator">✔</span>
                                                    </div>
                                                    <div class="dynamic-qty-container" onclick="event.stopPropagation()">
                                                        ${generateDynamicInputArea()}
                                                    </div>
                                                 </div>`;
                        });
                    } else {
                        html += `<div style="padding:15px; text-align:center; color:#767676; font-size:0.9rem;">상품 준비 중입니다.</div>`;
                    }
                    html += `</div></div>`;
                });
                listArea.innerHTML = html;

            } catch (e) {
                console.error(e);
                document.getElementById('loading-msg').innerText = "오류가 발생했습니다.";
            }
        }

        function generateDynamicInputArea() {
            return `<div class="qty-rows-wrapper">
                                    <div class="qty-row">
                                        <select class="age-select">
                                            <option value="1">1세</option><option value="2">2세</option><option value="3">3세</option>
                                            <option value="4">4세</option><option value="5">5세</option><option value="6">6세</option><option value="7">7세</option>
                                        </select>
                                        <div class="nk-qty-stepper">
                                            <button type="button" class="nk-step-btn nk-step-minus" aria-label="수량 1 감소" onclick="stepOrderQty(this, -1)">−</button>
                                            <input type="number" min="0" inputmode="numeric" class="dynamic-qty-input" placeholder="0" oninput="checkRowData(this)">
                                            <button type="button" class="nk-step-btn nk-step-plus" aria-label="수량 1 증가" onclick="stepOrderQty(this, 1)">+</button>
                                        </div>
                                    </div>
                                </div>
                                <button type="button" class="btn-add-row" onclick="addQtyRow(this)">+ 연령 추가하기</button>`;
        }

        window.toggleCategory = function (h) {
            if (window.event) window.event.stopPropagation();
            const w = h.closest('.category-wrapper');
            const isActive = w.classList.contains('active');
            document.querySelectorAll('.category-wrapper').forEach(cw => {
                cw.classList.remove('active');
                cw.querySelector('.order-category-content').classList.remove('show');
            });
            if (!isActive) {
                w.classList.add('active');
                w.querySelector('.order-category-content').classList.add('show');
            }
        };

        document.addEventListener('click', function (e) {
            if (!e.target.closest('.category-wrapper')) {
                document.querySelectorAll('.category-wrapper').forEach(cw => {
                    cw.classList.remove('active');
                    const content = cw.querySelector('.order-category-content');
                    if (content) content.classList.remove('show');
                });
            }
        });

        window.toggleProductItem = function (r) {
            if (window.event) window.event.stopPropagation();
            const active = r.classList.contains('active');
            const p = r.closest('.order-category-content');
            p.querySelectorAll('.order-item-row.active').forEach(row => row.classList.remove('active'));
            if (!active) r.classList.add('active');
        };

        function updateOrderSummary() {
            const summaryEl = document.getElementById('nk-order-summary');
            const textEl = document.getElementById('nk-order-summary-text');
            const listEl = document.getElementById('nk-order-summary-list');
            const detailEl = document.getElementById('nk-order-summary-detail');
            const toggleBtn = document.getElementById('nk-order-summary-toggle');
            if (!summaryEl || !textEl || !listEl) return;

            const rows = document.querySelectorAll('.order-item-row');
            const itemTitles = new Set();
            let totalQty = 0;
            const summaryEntries = [];

            rows.forEach(r => {
                const title = r.getAttribute('data-title') || '';
                r.querySelectorAll('.qty-row').forEach(qr => {
                    const age = qr.querySelector('.age-select') ? qr.querySelector('.age-select').value : '';
                    const input = qr.querySelector('.dynamic-qty-input');
                    const q = input ? (parseInt(input.value, 10) || 0) : 0;
                    if (q > 0) {
                        itemTitles.add(title);
                        totalQty += q;
                        summaryEntries.push(`${title} (${age}세 · ${q}부)`);
                    }
                });
            });

            if (totalQty === 0) {
                summaryEl.hidden = true;
                if (detailEl) detailEl.hidden = true;
                if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'false');
                document.body.classList.remove('nk-has-summary');
                listEl.replaceChildren();
                return;
            }

            summaryEl.hidden = false;
            document.body.classList.add('nk-has-summary');
            textEl.textContent = `총 ${itemTitles.size}종 · ${totalQty}부`;

            const frag = document.createDocumentFragment();
            summaryEntries.forEach(entry => {
                const li = document.createElement('li');
                li.textContent = entry;
                frag.appendChild(li);
            });
            listEl.replaceChildren(frag);
        }

        (function initOrderSummaryBar() {
            const toggleBtn = document.getElementById('nk-order-summary-toggle');
            const detailEl = document.getElementById('nk-order-summary-detail');
            const submitBtn = document.getElementById('nk-order-summary-submit');
            if (toggleBtn && detailEl) {
                toggleBtn.addEventListener('click', () => {
                    const nextOpen = detailEl.hidden;
                    detailEl.hidden = !nextOpen;
                    toggleBtn.setAttribute('aria-expanded', String(nextOpen));
                    toggleBtn.textContent = nextOpen ? '내역 닫기' : '내역 보기';
                });
            }
            if (submitBtn) {
                submitBtn.addEventListener('click', () => {
                    const f = document.getElementById('orderForm');
                    if (!f) return;
                    if (!f.reportValidity()) {
                        const firstInvalid = f.querySelector(':invalid');
                        if (firstInvalid) firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        return;
                    }
                    f.requestSubmit();
                });
            }
            document.addEventListener('change', e => {
                if (e.target && e.target.classList && e.target.classList.contains('age-select')) {
                    updateOrderSummary();
                }
            });
        })();

        window.stepOrderQty = function (btn, delta) {
            const stepper = btn.closest('.nk-qty-stepper');
            if (!stepper) return;
            const input = stepper.querySelector('.dynamic-qty-input');
            if (!input) return;
            const current = parseInt(input.value, 10) || 0;
            const next = Math.max(0, current + delta);
            input.value = next > 0 ? String(next) : '';
            window.checkRowData(input);
        };

        window.checkRowData = function (el) {
            const r = el.closest('.order-item-row');
            const inputs = r.querySelectorAll('.dynamic-qty-input');
            let has = false; inputs.forEach(i => { if (parseInt(i.value, 10) > 0) has = true; });
            if (has) r.classList.add('has-data'); else r.classList.remove('has-data');

            const w = r.closest('.category-wrapper');
            const h = w.querySelector('.order-category-header');
            const all = w.querySelectorAll('.dynamic-qty-input');
            let t = 0; all.forEach(i => { const v = parseInt(i.value, 10); if (v > 0) t += v; });
            if (t > 0) h.classList.add('has-data'); else h.classList.remove('has-data');
            updateOrderSummary();
        };

        window.addQtyRow = function (b) {
            const w = b.previousElementSibling;
            const d = document.createElement('div'); d.className = 'qty-row';
            d.innerHTML = `<select class="age-select"><option value="1">1세</option><option value="2">2세</option><option value="3">3세</option><option value="4">4세</option><option value="5">5세</option><option value="6">6세</option><option value="7">7세</option></select><div class="nk-qty-stepper"><button type="button" class="nk-step-btn nk-step-minus" aria-label="수량 1 감소" onclick="stepOrderQty(this, -1)">−</button><input type="number" min="0" inputmode="numeric" class="dynamic-qty-input" placeholder="0" oninput="checkRowData(this)"><button type="button" class="nk-step-btn nk-step-plus" aria-label="수량 1 증가" onclick="stepOrderQty(this, 1)">+</button></div><button type="button" class="btn-remove-row" onclick="removeQtyRow(this)">×</button>`;
            w.appendChild(d);
        };

        window.removeQtyRow = function (b) {
            const row = b.closest('.order-item-row');
            b.parentElement.remove();
            const i = row.querySelectorAll('.dynamic-qty-input');
            if (i.length > 0) checkRowData(i[0]); else {
                row.classList.remove('has-data');
                const w = row.closest('.category-wrapper');
                if (w) {
                    const h = w.querySelector('.order-category-header');
                    const all = w.querySelectorAll('.dynamic-qty-input');
                    let t = 0; all.forEach(v => { const q = parseInt(v.value, 10); if (q > 0) t += q; });
                    if (t > 0) h.classList.add('has-data'); else h.classList.remove('has-data');
                }
                updateOrderSummary();
            }
        };

        const form = document.getElementById('orderForm');
        if (form) {
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                const btn = form.querySelector('.btn-action');
                const orig = btn.innerText;
                const details = [];
                document.querySelectorAll('.order-item-row').forEach(r => {
                    const t = r.getAttribute('data-title');
                    const rows = r.querySelectorAll('.qty-row');
                    let sub = [];
                    rows.forEach(qr => {
                        const a = qr.querySelector('.age-select').value;
                        const q = parseInt(qr.querySelector('.dynamic-qty-input').value);
                        if (q > 0) sub.push(`${a}세(${q}권)`);
                    });
                    if (sub.length > 0) details.push(`[${t}] : ${sub.join(', ')}`);
                });

                if (details.length === 0) return alert("주문할 교재를 선택해주세요.");

                btn.disabled = true; btn.innerText = "전송 중...";
                const fd = new FormData(form);
                const d = {
                    type: "ORDER",
                    wonName: fd.get("wonName"),
                    manager: fd.get("manager"),
                    phone: fd.get("phone"),
                    email: fd.get("email"),
                    region: fd.get("region"),
                    deliveryDate: "미지정",
                    orderDetails: details.join("\n"),
                    remarks: fd.get("remarks"),
                    timestamp: new Date().toLocaleString()
                };

                fetch(CONFIG.ORDER_SHEET_URL, { method: "POST", body: JSON.stringify(d) })
                    .then(r => r.json()).then(r => {
                        if (r.result === 'success') { alert("발주 요청이 완료되었습니다!"); location.reload(); }
                        else throw new Error(r.error);
                    }).catch(e => { alert("전송 실패: " + e); btn.disabled = false; btn.innerText = orig; });
            });
        }
    </script>
</body>
</html>
