<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴키즈 - 글쓰기</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body style="background:#f9fbfd;">

    <header></header>

    <div class="container" style="padding-top:100px; padding-bottom:50px;">
        <div class="panel-box" style="max-width:1200px; margin:0 auto;">
            <h2 id="write-header-title" style="text-align:center; color:#1a3c6e; margin-bottom:30px;">✏️ 게시판 글쓰기</h2>

            <div class="form-group">
                <label class="form-label">제목</label>
                <input type="text" id="w-title" class="form-input" placeholder="제목을 입력하세요">
            </div>

            <div class="form-group" style="background:#f0f7ff; padding:15px; border-radius:8px; border:1px solid #cce5ff; margin-bottom:20px;">
                <label class="form-label" style="margin-bottom:10px;">게시글 공개 설정</label>
                <div style="display:flex; gap:30px; align-items:center;">
                    <label style="cursor:pointer; display:flex; align-items:center; font-weight:bold;">
                        <input type="radio" name="w-secret" value="false" checked style="width:18px; height:18px; margin-right:8px; accent-color:#1a3c6e;">
                        🌐 공개글 (누구나 볼 수 있음)
                    </label>
                    <label style="cursor:pointer; display:flex; align-items:center; font-weight:bold; color:#d35400;">
                        <input type="radio" name="w-secret" value="true" style="width:18px; height:18px; margin-right:8px; accent-color:#d35400;">
                        🔒 비밀글 (작성자와 관리자만 볼 수 있음)
                    </label>
                </div>
            </div>
            <div style="display:flex; gap:15px; margin-bottom:20px;">
                <div style="flex:1;">
                    <label class="form-label">작성자</label>
                    <input type="text" id="w-author" class="form-input" placeholder="이름 또는 닉네임">
                </div>
                <div style="flex:1;">
                    <label class="form-label">비밀번호 (수정/삭제용)</label>
                    <input type="password" id="w-password" class="form-input" placeholder="비밀번호 4자리 이상">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">내용</label>
                <textarea id="w-content" class="form-input" style="height:300px; resize:vertical;" placeholder="내용을 입력해주세요."></textarea>
            </div>

            <div style="text-align:center; margin-top:30px; display:flex; gap:10px; justify-content:center;">
                <button onclick="saveUserPost()" class="btn-action" style="min-width:150px;">글 등록하기</button>
                <button onclick="history.back()" class="btn-action" style="background:#999; min-width:150px;">취소</button>
            </div>
        </div>
    </div>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="manager.js"></script>
    <script>
        // 현재 접속한 게시판의 코드를 가져옵니다. (예: write.html#free -> free)
        const targetCategory = location.hash.replace('#', '') || 'free';

        document.addEventListener("DOMContentLoaded", () => {
            const checkReady = setInterval(() => {
                if (window.GLOBAL_CATEGORIES && window.GLOBAL_CATEGORIES.length > 0) {
                    clearInterval(checkReady);
                    const catInfo = window.GLOBAL_CATEGORIES.find(c => c.code === targetCategory);
                    if (catInfo) {
                        document.getElementById('write-header-title').innerText = `✏️ ${catInfo.name} 글쓰기`;
                    }
                }
            }, 100);
        });

        async function saveUserPost() {
            const title = document.getElementById('w-title').value.trim();
            const author = document.getElementById('w-author').value.trim();
            const password = document.getElementById('w-password').value.trim();
            const content = document.getElementById('w-content').value.trim();
            
            // 👇 라디오 버튼에서 사용자가 선택한 비밀글 여부(true/false 문자열)를 가져와서 진짜 Boolean(참/거짓) 값으로 변환
            const isSecret = document.querySelector('input[name="w-secret"]:checked').value === "true";

            if (!title || !author || !password || !content) {
                return alert("모든 항목을 입력해주세요.");
            }

            if (!confirm("글을 등록하시겠습니까?")) return;

            // HTML 태그 이스케이프 처리 및 줄바꿈 적용
            const safeContent = window.escapeHtml(content).replace(/\n/g, "<br>");

            // 💡 데이터베이스에 is_secret 값 포함하여 저장
            const { error } = await window.sb.from('total_posts').insert([{
                category: targetCategory,  // 파악한 현재 게시판에 저장
                title: window.escapeHtml(title),
                content: safeContent,
                link_url: window.escapeHtml(author), // 작성자
                video_url: password,                 // 비밀번호
                order_num: 0,
                is_visible: true,
                is_secret: isSecret                  // 🔒 비밀글 여부 저장!
            }]);

            if (error) {
                alert("오류 발생: " + error.message);
            } else {
                alert("글이 성공적으로 등록되었습니다!");
                location.href = `notice.html#${targetCategory}`; // 작성 후 해당 게시판으로 복귀
            }
        }
    </script>
</body>
</html>
