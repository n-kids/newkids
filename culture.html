<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴키즈 - 원어민 문화 체험</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .intro-summary {
            background-color: #fff;
            text-align: center;
            padding: 60px 20px;
            border-bottom: 1px solid #eee;
        }

        .intro-box {
            max-width: 800px;
            margin: 0 auto;
            border: 2px solid var(--primary-color);
            padding: 40px;
            border-radius: 15px;
            background-color: #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

            .intro-box h3 {
                font-size: 1.6rem;
                color: var(--primary-color);
                margin-bottom: 20px;
                font-weight: bold;
            }

            .intro-box p {
                font-size: 1.1rem;
                color: #555;
                word-break: keep-all;
            }
    </style>
</head>
<body>
    <header></header>

    <section class="sub-hero bg-culture">
        <div class="container-wide">
            <h1>원어민 문화 체험</h1>
            <p>세계 여러 나라의 문화를 원어민 선생님과 생생하게 경험해요!</p>
        </div>
    </section>

    <section class="intro-summary">
        <div class="intro-box">
            <h3>🌍 글로벌 리더로 자라나는 첫걸음</h3>
            <p>
                매달 새로운 나라의 문화를 체험하며, 아이들의 시야를 넓혀줍니다.<br>
                원어민 선생님과 함께하는 즐거운 놀이 활동을 통해<br>
                자연스럽게 영어를 접하고 다문화 감수성을 키울 수 있습니다.
            </p>
        </div>
    </section>

    <section style="background-color: var(--bg-light);">
        <div class="container">
            <h2 style="text-align: left; margin-bottom: 30px;">📸 체험 활동 현장</h2>
            <div id="post-list" class="gallery-grid">
                <div style="text-align:center; width:100%; grid-column: 1/-1; padding:50px; color:#666;">로딩 중...</div>
            </div>
        </div>
    </section>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="manager.js"></script>

    <script>
        const CATEGORY_NAME = 'culture'; // 카테고리 설정

        document.addEventListener("DOMContentLoaded", function () {
            const checkSb = setInterval(() => {
                if (window.sb) {
                    clearInterval(checkSb);
                    loadPosts(window.sb);
                }
            }, 100);
        });

        async function loadPosts(sb) {
            const { data } = await sb.from('total_posts')
                .select('*')
                .eq('category', CATEGORY_NAME)
                .eq('is_visible', true)
                .order('order_num', { ascending: true })
                .order('created_at', { ascending: false });

            const list = document.getElementById('post-list');
            list.innerHTML = "";

            if (!data || data.length === 0) {
                listContainer.innerHTML = `
        <div style="text-align:center; padding: 80px 20px; color:#888; background-color:#f9f9f9; border-radius:12px; grid-column: 1 / -1; width: 100%;">
            <div style="font-size: 3rem; margin-bottom: 15px;">📭</div>
            <h3 style="color:#555; margin-bottom: 10px;">현재 준비 중인 프로그램입니다.</h3>
            <p style="font-size: 1rem;">새로운 콘텐츠가 곧 업데이트될 예정입니다. 조금만 기다려주세요!</p>
        </div>
    `;
                return;
            }
            data.forEach(item => {
                let displayImg = item.thumbnail_url;
                if (!displayImg) {
                    try {
                        const parsed = JSON.parse(item.image_url);
                        if (Array.isArray(parsed) && parsed.length > 0) displayImg = parsed[0];
                        else displayImg = item.image_url;
                    } catch (e) {
                        displayImg = item.image_url;
                    }
                }

                const yId = window.getYoutubeId(displayImg);
                let isVideo = !!yId;
                if (yId) {
                    displayImg = `https://img.youtube.com/vi/${yId}/hqdefault.jpg`;
                } else if (!displayImg) {
                    displayImg = 'https://via.placeholder.com/400x300?text=No+Image';
                }

                const linkIcon = item.link_url ? `<div class="link-icon">🔗</div>` : '';
                const div = document.createElement('div');
                div.className = 'card';
                div.onclick = () => {
                    if (item.link_url && item.link_url.trim() !== "") {
                        let url = item.link_url;
                        if (!url.startsWith('http')) url = 'https://' + url;
                        window.open(url, '_blank');
                    } else {
                        location.href = `view.html?id=${item.id}`;
                    }
                };

                div.innerHTML = `
                        ${linkIcon}
                        <div class="card-img-wrap">
                            <img src="${displayImg}" class="card-img" onerror="this.src='https://via.placeholder.com/400x300?text=Error'">
                            <div style="display:${isVideo ? 'block' : 'none'}; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:white; font-size:3rem; text-shadow:0 0 10px rgba(0,0,0,0.5);">▶</div>
                        </div>
                        <div class="card-body">
                            <div class="card-title">${item.title}</div>
                            <div class="card-text">${item.content}</div>
                        </div>`;
                list.appendChild(div);
            });
        }
    </script>
</body>
</html>
