<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴키즈 - 어린이집/유치원 파트너</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* =========================================
           [팝업 슬라이더 스타일]
           ========================================= */
        #popup-layer {
            position: fixed;
            top: 100px;
            left: 20px;
            z-index: 20000;
            display: none; /* JS로 제어 */
        }

        .popup-slider-box {
            width: 450px;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
            border: 1px solid #ddd;
            position: relative;
            animation: popupFadeIn 0.5s ease;
        }

        @keyframes popupFadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 슬라이드 영역 */
        .slider-wrapper {
            position: relative;
            width: 100%;
            height: auto;
            background: #f0f0f0;
            min-height: 250px;
        }

        .popup-slide {
            display: none; /* 기본 숨김 */
            width: 100%;
        }

            .popup-slide.active {
                display: block; /* 활성화된 슬라이드만 표시 */
                animation: fadeIn 0.5s;
            }

        @keyframes fadeIn {
            from {
                opacity: 0.5;
            }

            to {
                opacity: 1;
            }
        }

        .popup-slide img {
            width: 100%;
            display: block;
            height: auto;
        }

        /* 화살표 네비게이션 */
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 10;
        }

            .slider-btn:hover {
                background: rgba(0, 0, 0, 0.7);
            }

        .prev-btn {
            left: 10px;
        }

        .next-btn {
            right: 10px;
        }

        /* 페이지 인디케이터 (점) */
        .slider-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
        }

            .dot.active {
                background: #fff;
                transform: scale(1.2);
            }

        /* 하단 닫기 바 */
        .popup-footer {
            background: #222;
            color: #fff;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .popup-close-today {
            cursor: pointer;
            color: #ccc;
        }

            .popup-close-today:hover {
                color: #fff;
                text-decoration: underline;
            }

        .popup-close {
            cursor: pointer;
            font-weight: bold;
            color: #fff;
        }

        /* 👇 모바일 대응 (이 부분이 핵심적으로 수정되었습니다!) */
        @media (max-width: 768px) {
            #popup-layer {
                top: 28%;
                left: 30%;
                transform: translate(-50%, -50%);
                width: 65%;
                max-width: 260px;
            }

            .popup-slider-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header></header>

    <div id="popup-layer">
        <div class="popup-slider-box">
            <div class="slider-wrapper" id="slider-content">
            </div>

            <button class="slider-btn prev-btn" id="btn-prev" style="display:none;">❮</button>
            <button class="slider-btn next-btn" id="btn-next" style="display:none;">❯</button>
            <div class="slider-dots" id="slider-dots"></div>

            <div class="popup-footer">
                <span class="popup-close-today" onclick="closePopupToday()">오늘 하루 열지 않기</span>
                <span class="popup-close" onclick="closePopup()">닫기 [X]</span>
            </div>
        </div>
    </div>

    <section class="hero">
        <div class="container hero-content">
            <h1>우리 원에 필요한 모든 즐거움<br>뉴키즈 (New Kids)</h1>
            <p>검증된 영유아 교재부터 특별한 원어민 행사까지,<br>선생님과 아이들이 모두 행복한 교육 파트너</p>
            <a href="proposal.html" class="btn">제안서 / 견적 요청하기</a>
        </div>
    </section>

    <section id="curriculum">
        <div class="container-wide">
            <h2>뉴키즈 교육 프로그램</h2>
            <p class="section-desc">영아부터 유아까지, 핵심 영역의 통합 교육 솔루션</p>
            <div id="edu-grid" class="main-grid program-grid"></div>
        </div>
    </section>

    <section id="events" class="bg-gray">
        <div class="container">
            <h2>특별한 행사 프로그램</h2>
            <p class="section-desc">아이들에게 잊지 못할 추억을 선물하세요</p>
            <div id="event-grid" class="main-grid"></div>
        </div>
    </section>

    <section id="contact" class="contact-section bg-gray">
        <div class="container">
            <h2 class="contact-title">궁금하신 점이 있으신가요?</h2>
            <p class="contact-desc">아래 번호로 전화주시면 자세한 상담을 도와드리겠습니다.</p>
            <div class="contact-info-wrap">
                <a href="tel:010-2333-2563" class="contact-link"><span class="contact-icon">📞</span>상담문의 1: <strong>010-2333-2563</strong></a>
                <a href="tel:010-5522-8109" class="contact-link"><span class="contact-icon">📞</span>상담문의 2: <strong>010-5522-8109</strong></a>
            </div>
        </div>
    </section>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="manager.js"></script>

    <script>
        let currentSlideIndex = 0;
        let totalSlides = 0;
        let slideInterval = null;

        document.addEventListener("DOMContentLoaded", function () {
            // Supabase 로드 대기
            const checkSb = setInterval(() => {
                if (window.sb) {
                    clearInterval(checkSb);
                    console.log("System Ready: Supabase Loaded");
                    loadMainCategories();
                    initPopupSlider();
                }
            }, 100);
        });

        // =========================================
        // [팝업 슬라이더 초기화 및 실행]
        // =========================================
        async function initPopupSlider() {
            try {
                // 1. 오늘 하루 안 보기 체크
                const today = new Date().toISOString().split('T')[0];
                if (localStorage.getItem('hide_main_popup_date') === today) {
                    return;
                }

                // 2. DB 데이터 가져오기
                const { data, error } = await window.sb.from('site_popups')
                    .select('*')
                    .eq('is_visible', true)
                    .order('order_num', { ascending: true })
                    .order('created_at', { ascending: false });

                if (error || !data || data.length === 0) return;

                // 3. HTML 렌더링
                const sliderContent = document.getElementById('slider-content');
                const dotsContainer = document.getElementById('slider-dots');
                sliderContent.innerHTML = '';
                dotsContainer.innerHTML = '';
                totalSlides = data.length;

                data.forEach((popup, index) => {
                    const div = document.createElement('div');
                    div.className = `popup-slide ${index === 0 ? 'active' : ''}`;
                    div.dataset.index = index;

                    let imgHtml = `<img src="${popup.image_url}" alt="공지">`;

                    if (popup.link_url && popup.link_url.trim() !== '') {
                        let url = popup.link_url.trim();
                        if (!url.startsWith('http') && !url.includes('.html')) url = 'https://' + url;
                        div.innerHTML = `<a href="${url}" target="_blank">${imgHtml}</a>`;
                    } else {
                        div.innerHTML = imgHtml;
                    }
                    sliderContent.appendChild(div);

                    if (totalSlides > 1) {
                        const dot = document.createElement('div');
                        dot.className = `dot ${index === 0 ? 'active' : ''}`;
                        dot.onclick = () => showSlide(index);
                        dotsContainer.appendChild(dot);
                    }
                });

                // 4. 네비게이션 및 자동 슬라이드 설정
                if (totalSlides > 1) {
                    document.getElementById('btn-prev').style.display = 'flex';
                    document.getElementById('btn-next').style.display = 'flex';

                    document.getElementById('btn-prev').onclick = () => changeSlide(-1);
                    document.getElementById('btn-next').onclick = () => changeSlide(1);

                    // [수정] 자동 슬라이드 속도 2초로 변경
                    startAutoSlide();

                    const box = document.querySelector('.popup-slider-box');
                    box.addEventListener('mouseenter', stopAutoSlide);
                    box.addEventListener('mouseleave', startAutoSlide);
                }

                document.getElementById('popup-layer').style.display = 'block';

            } catch (e) { console.error("팝업 로드 오류:", e); }
        }

        function changeSlide(n) {
            let nextIndex = currentSlideIndex + n;
            if (nextIndex >= totalSlides) nextIndex = 0;
            if (nextIndex < 0) nextIndex = totalSlides - 1;
            showSlide(nextIndex);
        }

        function showSlide(index) {
            currentSlideIndex = index;

            const slides = document.querySelectorAll('.popup-slide');
            slides.forEach(s => s.classList.remove('active'));
            slides[currentSlideIndex].classList.add('active');

            const dots = document.querySelectorAll('.dot');
            if (dots.length > 0) {
                dots.forEach(d => d.classList.remove('active'));
                dots[currentSlideIndex].classList.add('active');
            }
        }

        function startAutoSlide() {
            if (totalSlides <= 1) return;
            stopAutoSlide();
            // [수정] 2000ms = 2초
            slideInterval = setInterval(() => changeSlide(1), 2000);
        }

        function stopAutoSlide() {
            if (slideInterval) clearInterval(slideInterval);
        }

        function closePopup() {
            document.getElementById('popup-layer').style.display = 'none';
            stopAutoSlide();
        }

        function closePopupToday() {
            const today = new Date().toISOString().split('T')[0];
            localStorage.setItem('hide_main_popup_date', today);
            closePopup();
        }

        async function loadMainCategories() {
            try {
                const { data } = await window.sb.from('program_categories')
                    .select('*')
                    .eq('is_visible', true)
                    .order('order_num');

                if (!data) return;

                const eduGrid = document.getElementById('edu-grid');
                const eventGrid = document.getElementById('event-grid');

                const legacyFiles = ['season', 'culture', 'performance'];
                const iconMap = {
                    'korean': '🇰🇷', 'reading': '📖', 'english': '🔤', 'math': '🔢',
                    'science': '🔬', 'art': '🎨', 'coding': '💻', 'environment': '🌱',
                    'nuri': '🐣', 'infant': '🧸', 'special': '✨',
                    'season': '🎉', 'culture': '🌍', 'performance': '👨‍👩‍👧‍👦'
                };

                data.forEach(cat => {
                    let href = cat.type === 'EDU' ? `child.html#${cat.code}` : (legacyFiles.includes(cat.code) ? `${cat.code}.html` : `program.html#${cat.code}`);
                    let icon = iconMap[cat.code] || '⭐';

                    const html = `
                            <a href="${href}" class="card">
                                <div class="card-icon">${icon}</div>
                                <h3>${cat.name}</h3>
                                <p>${cat.hero_desc || '뉴키즈의 특별한 프로그램'}</p>
                                <span class="card-link">자세히 보기 &rarr;</span>
                            </a>`;

                    if (cat.type === 'EDU') eduGrid.insertAdjacentHTML('beforeend', html);
                    else if (cat.type === 'EVENT') eventGrid.insertAdjacentHTML('beforeend', html);
                });
            } catch (e) { console.error("카테고리 로드 실패:", e); }
        }
    </script>
</body>
</html>
