<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴키즈 - 글쓰기</title>

    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-color: #f4f7fa !important;
            margin: 0;
            padding: 0;
        }

        /* ★ 글쓰기 폼 가로 폭 강제 확장 및 고정 (view.html과 완벽하게 동일한 900px 기준) ★ */
        .write-container {
            width: 100% !important;
            max-width: 900px !important;
            margin: 50px auto !important;
            padding: 0 20px !important;
            box-sizing: border-box !important;
            display: block !important;
        }

        .write-card {
            width: 100% !important;
            background: #fff !important;
            border: 1px solid #eaeaea !important;
            border-radius: 12px !important;
            padding: 50px 40px !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03) !important;
            box-sizing: border-box !important;
            display: block !important;
        }

        .write-title-main {
            text-align: center;
            color: #1a3c6e;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .form-label {
            display: block;
            color: #1a3c6e;
            font-weight: 800;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            color: #333;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

            .form-input:focus {
                outline: none;
                border-color: #1a3c6e;
            }

            .form-input::placeholder {
                color: #aaa;
            }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-col {
            flex: 1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .secret-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

            .secret-wrap input[type="checkbox"] {
                width: 16px;
                height: 16px;
                accent-color: #1a3c6e;
                cursor: pointer;
            }

            .secret-wrap label {
                font-size: 0.9rem;
                color: #555;
                cursor: pointer;
                font-weight: bold;
            }

        .btn-wrap {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 40px;
        }

        .btn-submit {
            background-color: #1a3c6e;
            color: #fff;
            border: none;
            padding: 12px 40px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-cancel {
            background-color: #999;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit:hover {
            background-color: #132b4f;
        }

        .btn-cancel:hover {
            background-color: #777;
        }

        @media screen and (max-width: 768px) {
            .write-container {
                margin: 20px auto !important;
                padding: 0 15px !important;
            }

            .write-card {
                padding: 30px 20px !important;
            }

            .form-row {
                flex-direction: column;
                gap: 20px;
            }

            .write-title-main {
                font-size: 1.6rem;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <header></header>

    <div class="write-container">
        <div class="write-card">
            <h2 id="page-title" class="write-title-main">✏️ 글쓰기</h2>

            <!-- 시스템 분류용 숨김 필드 -->
            <input type="hidden" id="write-category" value="">

            <div class="form-group">
                <label class="form-label">제목</label>
                <input type="text" id="write-title" class="form-input" placeholder="제목을 입력하세요">
            </div>

            <div class="form-row">
                <div class="form-col">
                    <label class="form-label">작성자</label>
                    <input type="text" id="write-link" class="form-input" placeholder="이름">
                </div>
                <div class="form-col">
                    <label class="form-label">비밀번호</label>
                    <input type="password" id="write-password" class="form-input" placeholder="삭제 및 수정 시 필요">

                    <div class="secret-wrap">
                        <input type="checkbox" id="write-is-secret">
                        <label for="write-is-secret">비밀글로 설정 (관리자와 본인만 열람)</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">내용</label>
                <input type="file" id="hidden-image-input" accept="image/*" multiple style="display:none;">
                <div id="editor-container" style="height: 350px; border-radius: 4px; border: 1px solid #ccc; font-size:1rem;"></div>
            </div>

            <div class="form-group" style="padding-top: 15px; border-top: 1px dashed #eee;">
                <label class="form-label" style="color: #666; font-size: 0.9rem;">📎 첨부파일 (선택사항)</label>
                <input type="file" id="write-file" class="form-input" accept="*/*" multiple style="padding: 8px; font-size: 0.9rem;">
                <div id="existing-files-list" style="margin-top:10px; display:flex; flex-direction:column; gap:5px;"></div>
            </div>

            <div class="btn-wrap">
                <button id="btn-submit" onclick="submitPost()" class="btn-submit">등록하기</button>
                <button onclick="history.back()" class="btn-cancel">취소</button>
            </div>
        </div>
    </div>

    <footer></footer>

    <!-- 로딩 오버레이 -->
    <div id="loading" class="loading-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:9999; justify-content:center; align-items:center; font-size:1.5rem; font-weight:bold; color:#1a3c6e;">
        처리 중입니다...
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://unpkg.com/quill-blot-formatter@1.0.5/dist/quill-blot-formatter.min.js"></script>
    <script src="config.js"></script>
    <script src="manager.js"></script>

    <script>
        let quill;
        let editId = null;
        let keptFiles = [];

        document.addEventListener("DOMContentLoaded", async function () {
            if (typeof Quill !== 'undefined') {
                Quill.register('modules/blotFormatter', QuillBlotFormatter.default);
                quill = new Quill('#editor-container', {
                    theme: 'snow',
                    placeholder: '내용을 자유롭게 작성해주세요.',
                    modules: {
                        blotFormatter: {},
                        toolbar: {
                            container: [[{ 'header': [1, 2, 3, false] }], ['bold', 'italic', 'underline', { 'color': [] }], [{ 'align': [] }, 'link', 'image']],
                            handlers: { image: function () { document.getElementById('hidden-image-input').click(); } }
                        }
                    }
                });

                document.getElementById('hidden-image-input').addEventListener('change', async function () {
                    if (this.files && this.files.length > 0) {
                        showLoading(true);
                        try {
                            for (let i = 0; i < this.files.length; i++) {
                                const file = this.files[i];
                                if (!file.type.startsWith('image/')) continue;
                                const ext = file.name.split('.').pop();
                                const safeKey = `user_${Date.now()}_${i}.${ext}`;
                                const { data, error } = await window.sb.storage.from('images').upload(safeKey, file);
                                if (error) throw error;
                                const publicUrl = window.sb.storage.from('images').getPublicUrl(data.path).data.publicUrl;
                                const range = quill.getSelection(true);
                                let idx = range ? range.index : quill.getLength();
                                quill.insertEmbed(idx, 'image', publicUrl);
                                quill.setSelection(idx + 1);
                            }
                        } catch (e) {
                            alert("이미지 업로드 실패: " + e.message);
                        } finally {
                            showLoading(false);
                            this.value = '';
                        }
                    }
                });
            }

            const checkReady = setInterval(async () => {
                if (window.sb && window.GLOBAL_CATEGORIES && window.GLOBAL_CATEGORIES.length > 0) {
                    clearInterval(checkReady);

                    const urlParams = new URLSearchParams(window.location.search);
                    editId = urlParams.get('edit');
                    const hashCat = location.hash.replace('#', '');

                    if (hashCat) {
                        document.getElementById('write-category').value = hashCat;
                        const catInfo = window.GLOBAL_CATEGORIES.find(c => c.code === hashCat);
                        if (catInfo) {
                            document.getElementById('page-title').innerText = `✏️ ${catInfo.name} 글쓰기`;
                        }
                    }

                    if (editId) {
                        document.getElementById('btn-submit').innerText = "수정 완료";
                        await loadEditData(editId);
                    }
                }
            }, 100);
        });

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        async function loadEditData(id) {
            showLoading(true);
            const { data, error } = await window.sb.from('total_posts').select('*').eq('id', id).single();
            showLoading(false);

            if (error || !data) {
                alert("게시글 정보를 불러올 수 없습니다.");
                history.back();
                return;
            }

            document.getElementById('write-category').value = data.category;
            document.getElementById('write-title').value = data.title;
            document.getElementById('write-link').value = data.link_url || '';
            document.getElementById('write-password').value = data.password || data.video_url || '';
            document.getElementById('write-is-secret').checked = (data.is_secret === true || String(data.is_secret) === 'true');

            quill.root.innerHTML = data.content || '';

            if (data.image_url && data.image_url !== 'null') {
                keptFiles = data.image_url.split('||').map(u => u.trim()).filter(u => u);
                renderExistingFiles();
            }
        }

        function renderExistingFiles() {
            const list = document.getElementById('existing-files-list');
            list.innerHTML = '';
            keptFiles.forEach((item, idx) => {
                let display = item;
                if (item.includes('@@')) { display = item.split('@@')[1]; }
                else {
                    let rawFilename = item.split('/').pop().split('?')[0];
                    try { rawFilename = decodeURIComponent(rawFilename); } catch (e) { }
                    display = rawFilename.includes('___') ? rawFilename.split('___').pop() : rawFilename;
                }
                list.innerHTML += `
                        <div style="display:flex; justify-content:space-between; align-items:center; background:#f0f7ff; padding:8px 12px; border-radius:6px; border:1px solid #cce5ff;">
                            <span style="font-size:0.9rem; color:#1a3c6e;">📎 ${display}</span>
                            <button type="button" onclick="removeExistingFile(${idx})" style="background:#ff6b6b; color:white; border:none; border-radius:4px; padding:4px 10px; cursor:pointer; font-size:0.8rem;">삭제</button>
                        </div>`;
            });
        }
        window.removeExistingFile = function (idx) { keptFiles.splice(idx, 1); renderExistingFiles(); };

        function getFirstImageFromContent(html) {
            const d = document.createElement('div');
            d.innerHTML = html;
            const i = d.querySelector('img');
            return i ? i.src : null;
        }

        async function submitPost() {
            const title = document.getElementById('write-title').value.trim();
            const author = document.getElementById('write-link').value.trim();
            const password = document.getElementById('write-password').value.trim();
            const isSecret = document.getElementById('write-is-secret').checked;
            const category = document.getElementById('write-category').value || 'notice';

            if (!title) return alert("제목을 입력해주세요.");
            if (!password) return alert("게시글 수정/삭제를 위해 비밀번호를 반드시 입력해주세요.");

            showLoading(true);

            const fileInput = document.getElementById('write-file');
            let newUploadedUrls = [];
            if (fileInput.files.length > 0) {
                for (let i = 0; i < fileInput.files.length; i++) {
                    const df = fileInput.files[i];
                    const ext = df.name.split('.').pop();
                    const safeKey = `d_${Date.now()}_${i}.${ext}`;
                    const { data, error } = await window.sb.storage.from('images').upload(safeKey, df);
                    if (error) { showLoading(false); return alert("첨부파일 업로드 실패: " + error.message); }
                    const fileUrl = window.sb.storage.from('images').getPublicUrl(data.path).data.publicUrl;
                    newUploadedUrls.push(fileUrl + '@@' + df.name);
                }
            }
            const finalFileUrls = [...keptFiles, ...newUploadedUrls];
            let du = finalFileUrls.length > 0 ? finalFileUrls.join('||') : null;

            const thumbUrl = getFirstImageFromContent(quill.root.innerHTML) || null;

            const pd = {
                title: title,
                content: quill.root.innerHTML,
                category: category,
                link_url: author,
                password: password,
                is_secret: isSecret,
                image_url: du,
                thumbnail_url: thumbUrl,
                is_visible: true
            };

            let resultError;
            if (editId) {
                const { error } = await window.sb.from('total_posts').update(pd).eq('id', editId);
                resultError = error;
            } else {
                pd.order_num = 0;
                const { error } = await window.sb.from('total_posts').insert([pd]);
                resultError = error;
            }

            showLoading(false);

            if (resultError) {
                alert("저장 중 오류 발생: " + resultError.message);
            } else {
                alert("게시글이 성공적으로 저장되었습니다.");
                location.href = `notice.html#${category}`;
            }
        }
    </script>
</body>
</html>
