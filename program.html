<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴키즈 - 행사 프로그램</title>
    <meta name="description" content="시즌 테마 행사, 원어민 문화 체험, 부모 참여 행사까지. 김포, 고양, 파주 어린이집·유치원에 딱 맞는 뉴키즈의 특별 행사 프로그램을 만나보세요.">
    <meta name="keywords" content="뉴키즈 행사, 어린이집 행사, 유치원 이벤트, 김포, 고양, 파주 유치원행사">
    <link rel="stylesheet" href="style.css?v=20261026">
    <style>
        /* culture 페이지에 있던 카테고리 소개 박스 */
        .intro-summary {
            background-color: #fff;
            text-align: center;
            padding: 60px 20px;
            border-bottom: 1px solid #eee;
        }

        .intro-box {
            max-width: 800px;
            margin: 0 auto;
            border: 2px solid var(--primary-color);
            padding: 40px;
            border-radius: 15px;
            background-color: #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

            .intro-box h3 {
                font-size: 1.6rem;
                color: var(--primary-color);
                margin-bottom: 20px;
                font-weight: bold;
            }

            .intro-box p {
                font-size: 1.1rem;
                color: #555;
                word-break: keep-all;
            }
    </style>
<link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
    <header></header>
    <div id="loading" class="loading-overlay" style="display: flex;">데이터를 불러오는 중입니다...</div>

    <section class="sub-hero" id="view-hero">
        <div class="container">
            <h1>행사 프로그램</h1>
            <p>아이들에게 잊지 못할 추억을 선물하세요</p>
        </div>
    </section>

    <section id="intro-section" class="intro-summary" style="display: none;">
        <div class="intro-box" id="intro-box"></div>
    </section>

    <section style="background-color: var(--bg-light);">
        <div class="container">
            <h2 id="gallery-heading" style="text-align: left; margin-bottom: 30px;">📸 활동 갤러리</h2>
            <div id="post-list" class="gallery-grid">
            </div>
        </div>
    </section>

    <section style="text-align: center; background-color: var(--primary-color); color: #fff;">
        <div class="container">
            <h2 style="color: #fff;">우리 원에 딱 맞는 행사를 찾으시나요?</h2>
            <p style="margin-bottom: 20px;">원하는 날짜와 인원을 알려주시면 맞춤 견적서를 보내드립니다.</p>
            <a href="proposal.html" class="btn">📋 견적 및 상담 신청</a>
        </div>
    </section>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=20261026"></script>
    <script src="manager.js?v=20261102"></script>

    <script>
        // 카테고리별 부가 문구 (기존 개별 페이지에 있던 내용)
        const CATEGORY_EXTRAS = {
            culture: {
                heading: '📸 체험 활동 현장',
                intro: '<h3>🌍 글로벌 리더로 자라나는 첫걸음</h3><p>매달 새로운 나라의 문화를 체험하며, 아이들의 시야를 넓혀줍니다.<br>원어민 선생님과 함께하는 즐거운 놀이 활동을 통해<br>자연스럽게 영어를 접하고 다문화 감수성을 키울 수 있습니다.</p>'
            }
        };

        document.addEventListener("DOMContentLoaded", function () {
            const checkSb = setInterval(() => {
                if (window.sb) {
                    clearInterval(checkSb);
                    loadCategoryPosts();
                }
            }, 100);
            window.addEventListener('hashchange', () => {
                if (window.sb) loadCategoryPosts();
            });
        });

        function currentCategoryCode() {
            const hash = window.location.hash.substring(1);
            if (hash) return hash;
            const events = (window.GLOBAL_CATEGORIES || []).filter(c => c.type === 'EVENT');
            return events.length ? events[0].code : 'season';
        }

        async function loadCategoryPosts() {
            const category = currentCategoryCode();
            setTimeout(() => { if (window.applySubPageHero) window.applySubPageHero(); }, 500);

            // 카테고리별 소개 문구 (있으면 표시)
            const extras = CATEGORY_EXTRAS[category] || {};
            const introSection = document.getElementById('intro-section');
            if (extras.intro) {
                document.getElementById('intro-box').innerHTML = extras.intro;
                introSection.style.display = '';
            } else {
                introSection.style.display = 'none';
            }
            document.getElementById('gallery-heading').textContent = extras.heading || '📸 활동 갤러리';

            document.getElementById('loading').style.display = 'flex';
            const list = document.getElementById('post-list');
            list.innerHTML = '';

            try {
                const { data, error } = await window.sb.from('total_posts')
                    .select('*')
                    .eq('category', category)
                    .eq('is_visible', true)
                    .order('order_num', { ascending: true })
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    list.innerHTML = `
        <div style="text-align:center; padding: 80px 20px; color:#888; background-color:#f9f9f9; border-radius:12px; grid-column: 1 / -1; width: 100%;">
            <div style="font-size: 3rem; margin-bottom: 15px;">📭</div>
            <h3 style="color:#555; margin-bottom: 10px;">현재 준비 중인 프로그램입니다.</h3>
            <p style="font-size: 1rem;">새로운 콘텐츠가 곧 업데이트될 예정입니다. 조금만 기다려주세요!</p>
        </div>
    `;
                    return;
                }

                // Supabase 스토리지 이미지 기본 경로 (config.js의 URL 활용)
                const STORAGE_BASE_URL = `${CONFIG.SUPABASE_URL}/storage/v1/object/public/post_images/`;

                data.forEach(item => {
                    let displayImg = "";

                    // 1. 이미지 경로 분석 및 결정
                    let rawImg = item.thumbnail_url || item.image_url;

                    // JSON 배열 형태인 경우 첫 번째 이미지 추출
                    try {
                        const parsed = JSON.parse(rawImg);
                        if (Array.isArray(parsed) && parsed.length > 0) rawImg = parsed[0];
                    } catch (e) { /* 일반 문자열인 경우 통과 */ }

                    // 유튜브 ID 추출 시도
                    const yId = (typeof window.getYoutubeId === 'function') ? window.getYoutubeId(rawImg) : extractYoutubeId(rawImg);
                    let isVideo = !!yId;

                    if (yId) {
                        displayImg = `https://img.youtube.com/vi/${yId}/hqdefault.jpg`;
                    } else if (rawImg) {
                        // 전체 URL이면 그대로 사용, 파일명이면 스토리지 경로 결합
                        displayImg = rawImg.startsWith('http') ? rawImg : STORAGE_BASE_URL + rawImg;
                    } else {
                        displayImg = 'https://placehold.co/400x300/e0e0e0/666666?text=No+Image';
                    }

                    const linkIcon = item.link_url ? `<div class="link-icon">🔗</div>` : '';

                    const div = document.createElement('div');
                    div.className = 'card';
                    div.style.cursor = 'pointer';
                    div.onclick = () => {
                        if (item.link_url && item.link_url.trim() !== "") {
                            let url = item.link_url;
                            if (!url.startsWith('http')) url = 'https://' + url;
                            window.open(url, '_blank');
                        } else {
                            location.href = `view.html?id=${item.id}`;
                        }
                    };

                    // 2. 카드 내부 구성 (제목 중심)
                    div.innerHTML = `
                            ${linkIcon}
                            <div class="card-img-wrap">
                                <img src="${displayImg}" class="card-img" onerror="this.src='https://placehold.co/400x300/e0e0e0/666666?text=Error'">
                                <div style="display:${isVideo ? 'block' : 'none'}; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:white; font-size:3rem; text-shadow:0 0 10px rgba(0,0,0,0.5);">▶</div>
                            </div>
                            <div class="card-body" style="padding: 15px; text-align: center;">
                                <div class="card-title" style="margin: 0; font-weight: 600; font-size: 1.1rem; word-break: keep-all;">${item.title}</div>
                            </div>
                        `;
                    list.appendChild(div);
                });
            } catch (err) {
                console.error('게시글 로드 오류:', err);
                list.innerHTML = `<div style="text-align:center; grid-column:1/-1; padding:50px; color:red;">데이터를 불러오는 중 오류가 발생했습니다.</div>`;
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // 유튜브 ID 추출 보조 함수 (window.getYoutubeId가 없을 경우 대비)
        function extractYoutubeId(url) {
            if (!url || typeof url !== 'string') return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }
    </script>
</body>
</html>
